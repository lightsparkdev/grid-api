<?xml version="1.0" encoding="UTF-8"?>
<!--
  Grid card design template: back.
  Artboard 1536 x 969 px (ISO/IEC 7810 ID-1, 85.6 x 53.98 mm, 1 mm = 17.94 px).
  The back is a fixed template. This overlay shows where the fixed elements
  sit so your background color or artwork can account for them. Keep it on a
  hidden or non-printing layer; nothing here prints.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="969" viewBox="0 0 1536 969" fill="none" font-family="Helvetica, Arial, sans-serif">
  <g id="card-outline" stroke="#FF21CC" stroke-width="2">
    <rect x="1" y="1" width="1534" height="967" rx="56" />
  </g>
  <g id="magnetic-stripe" stroke="#FF21CC" stroke-width="1.5">
    <rect x="0" y="72" width="1536" height="228" />
    <text x="24" y="196" font-size="20" fill="#FF21CC" stroke="none">Magnetic stripe: y 72-300 px, full width</text>
  </g>
  <g id="account-block" stroke="#FF21CC" stroke-width="1.5" stroke-dasharray="8 8">
    <rect x="56" y="476" width="620" height="187" />
    <text x="56" y="464" font-size="18" fill="#FF21CC" stroke="none">Account block: name, number, expiry and code. 57 px type, left edge 56 px</text>
  </g>
  <g id="contactless-indicator" stroke="#FF21CC" stroke-width="1.5" stroke-dasharray="8 8">
    <rect x="1415" y="470" width="67" height="90" />
    <text x="1482" y="600" font-size="18" fill="#FF21CC" stroke="none" text-anchor="end">Contactless indicator: 90 px tall, right edge 1482</text>
  </g>
  <g id="visa-debit-lockup" stroke="#FF21CC" stroke-width="1.5">
    <rect x="1089" y="650" width="447" height="319" stroke-dasharray="4 8" />
    <rect x="1143" y="704" width="339" height="211" />
    <text x="1073" y="676" font-size="18" fill="#FF21CC" stroke="none" text-anchor="end">Visa DEBIT lockup (silver foil): 339 x 211 px at (1143, 704), 54 px clear space</text>
  </g>
  <g id="service-and-issuer" stroke="#FF21CC" stroke-width="1.5" stroke-dasharray="8 8">
    <rect x="56" y="876" width="620" height="55" />
    <text x="700" y="900" font-size="18" fill="#FF21CC" stroke="none">Support phone and URL, then "Issued by Lead Bank". 22 px type</text>
  </g>
</svg>
