get:
  summary: Get the card authorization endpoint
  description: >-
    Get the endpoint Grid calls for real-time card authorization decisions.
    `404` is the normal response for a platform that has not enrolled an
    endpoint, and means Grid's own checks decide every authorization.
  operationId: getCardAuthorizationEndpoint
  tags:
    - Cards
  security:
    - BasicAuth: []
  responses:
    '200':
      description: The enrolled card authorization endpoint.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/cards/CardAuthorizationEndpoint.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: >-
        No card authorization endpoint is enrolled. This is the normal state
        for a platform that has not enrolled one.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
    '501':
      description: >-
        Not implemented in this environment. Cards are not enabled for
        every Grid deployment; environments without card support return
        `501 NOT_IMPLEMENTED`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error501.yaml
put:
  summary: Enroll a card authorization endpoint
  description: >-
    Enroll the endpoint Grid calls to ask your platform for a real-time
    decision on each card authorization that Grid's own checks approve. See
    the `CARD_AUTHORIZATION.REQUEST` webhook for the request your endpoint
    receives and the decision it must return.


    Before enrolling, Grid sends your endpoint one signed
    `CARD_AUTHORIZATION.REQUEST` with `data.isTest: true` and example data.
    Answer it without running your business checks. Enrollment succeeds
    only if your endpoint returns `200` with a valid
    `CardAuthorizationDecision` within `responseTimeoutMs`; the decision in
    that response is ignored. Otherwise this returns
    `400 WEBHOOK_DELIVERY_ERROR` and the enrolled endpoint, if any, is
    unchanged.


    This setting has its own resource, outside `PATCH /platform/config`,
    because enrolling calls your endpoint and can fail on that call alone.


    Calling this again replaces the enrolled endpoint. The change applies to
    authorizations that arrive after this call returns.
  operationId: enrollCardAuthorizationEndpoint
  tags:
    - Cards
  security:
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/cards/CardAuthorizationEndpointRequest.yaml
        example:
          url: https://api.mycompany.com/grid/card-authorizations
          timeoutBehavior: DECLINE
  responses:
    '200':
      description: The enrolled card authorization endpoint.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/cards/CardAuthorizationEndpoint.yaml
    '400':
      description: >-
        Bad request. `INVALID_INPUT` when `url` is not a public HTTPS URL.
        `WEBHOOK_DELIVERY_ERROR` when the test request did not return a
        valid response in time.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
    '501':
      description: >-
        Not implemented in this environment. Cards are not enabled for
        every Grid deployment; environments without card support return
        `501 NOT_IMPLEMENTED`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error501.yaml
delete:
  summary: Remove the card authorization endpoint
  description: >-
    Stop sending card authorizations to your platform for a decision. Grid's
    own checks decide authorizations that arrive after this call returns.
    Returns `204` whether or not an endpoint was enrolled.
  operationId: deleteCardAuthorizationEndpoint
  tags:
    - Cards
  security:
    - BasicAuth: []
  responses:
    '204':
      description: The endpoint was removed, or none was enrolled.
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
    '501':
      description: >-
        Not implemented in this environment. Cards are not enabled for
        every Grid deployment; environments without card support return
        `501 NOT_IMPLEMENTED`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error501.yaml
