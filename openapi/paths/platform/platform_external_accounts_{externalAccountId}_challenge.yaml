post:
  summary: Start an ownership verification challenge
  description: |
    Start (or restart) ownership verification for a `FIRST_PARTY` self-custody
    crypto wallet external account in `PENDING_OWNERSHIP_VERIFICATION` or
    `UNVERIFIED` status. The response carries the method-specific challenge
    material:

    - `WALLET_SIGNATURE` — a `messageToSign`; have the wallet sign it exactly
      and submit the result to the verify endpoint to complete verification
      synchronously.
    - `LIVENESS` — a hosted `verificationLink` (and possibly an embed
      `token`); the user completes a biometric flow and verification completes
      asynchronously. The outcome is delivered via
      `EXTERNAL_ACCOUNT.STATUS_UPDATED` webhooks or by polling the account.

    While a `WALLET_SIGNATURE` challenge is outstanding, calling this endpoint
    again returns that same challenge, with the same `messageToSign` and
    `expiresAt`. Reloading a signing page therefore does not invalidate the
    message the user is about to sign. You get a new challenge once the
    outstanding one expires or its attempt fails.

    Requesting `LIVENESS` always starts a liveness attempt, even while a
    signature challenge is outstanding.

    An `UNVERIFIED` account stays `UNVERIFIED` until a retry succeeds.
    Completing ownership verification moves the account to `ACTIVE`.
  operationId: createPlatformExternalAccountOwnershipChallenge
  tags:
    - External Accounts
  security:
    - BasicAuth: []
  parameters:
    - name: externalAccountId
      in: path
      description: External account ID
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/external_accounts/OwnershipChallengeRequest.yaml
  responses:
    '201':
      description: Challenge created; the method-specific material is returned.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/external_accounts/OwnershipChallenge.yaml
    '400':
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: External account not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        Ownership verification is not applicable to this external account
        (not a self-custody crypto wallet, not `FIRST_PARTY`, or already
        verified).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
