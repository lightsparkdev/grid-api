parameters:
  - name: externalAccountId
    in: path
    description: The unique identifier of the platform external account (self-custody crypto wallet) whose ownership is being verified.
    required: true
    schema:
      type: string
post:
  summary: Start platform external account ownership verification
  description: |
    Begin ownership verification for a `FIRST_PARTY` self-custody crypto wallet
    external account owned by the platform. Choose a `method`:

    - `WALLET_SIGNATURE` — the response includes a `messageToSign`; have the
      wallet sign it and submit the result to
      `POST /platform/external-accounts/{externalAccountId}/verify-ownership/confirm`
      to complete verification synchronously.
    - `LIVENESS` — the response includes a `verificationLink` (and a `token`
      for embedding); the user completes a hosted biometric flow and
      verification completes asynchronously. Status transitions are delivered
      via `EXTERNAL_ACCOUNT.OWNERSHIP_VERIFICATION_*` webhooks and reflected in
      the account's `ownershipVerificationStatus`.

    This endpoint is only meaningful for accounts whose
    `ownershipVerificationStatus` is `REQUIRED` or `FAILED`. For other accounts, this returns `409`.
  operationId: verifyPlatformExternalAccountOwnership
  tags:
    - External Accounts
  security:
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/external_accounts/OwnershipVerificationStartRequest.yaml
  responses:
    '200':
      description: Ownership verification started; the method-specific material is returned.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/external_accounts/OwnershipVerificationStart.yaml
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: External account not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: Ownership verification is not applicable to this external account.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
