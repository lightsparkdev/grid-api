parameters:
  - name: id
    in: path
    description: The id of the internal account whose statement was delivered.
    required: true
    schema:
      type: string
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002

post:
  summary: Send a receipt for a periodic statement
  description: >
    Record your monthly receipt that you pulled and issued this account's
    periodic statement for a period. Grid stores it as the delivery record for
    that account and period.


    Send it once a month for each account, after you have issued the statement
    built from `GET /internal-accounts/{id}/balance-changes`. Send it within
    five days of the month's end for every customer holding a card: Grid checks
    then that every cardholder's statement was issued.


    `periodStart` names the period: the first day of the statement month, as a
    date. It must be the first of a month, and a month that has already
    begun.


    Sending a receipt is idempotent. The stored time is the first receipt's,
    so calling this again does not move it. If `deliveredAt` is omitted, the
    current time is used.
  operationId: confirmStatementDelivery
  tags:
    - Periodic Statements
  security:
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/internal_accounts/ConfirmStatementDeliveryRequest.yaml
  responses:
    '200':
      description: Receipt recorded
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/internal_accounts/StatementDelivery.yaml
    '400':
      description: >-
        Bad request. Returned when `periodStart` is not the first day of a
        month or names a month that has not begun, when `deliveredAt` (or,
        if omitted, the time of the request) is in the future or before the
        period has ended, or when the account has no statement of its own.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Internal account not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        The period is not final yet. Card settlement for the month has not
        closed, so its statement could still change and cannot have been
        issued. Send the receipt once `GET
        /internal-accounts/{id}/balance-changes` serves the month.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
