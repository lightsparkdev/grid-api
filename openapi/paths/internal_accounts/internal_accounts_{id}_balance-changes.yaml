parameters:
  - name: id
    in: path
    description: The id of the internal account to list balance changes for.
    required: true
    schema:
      type: string
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002

get:
  summary: List balance changes for a period
  description: >
    Every change to this account's balance in a window, in the order the money
    moved, with the opening and closing balances for that window in the same
    response.


    `GET /transactions` returns one row per transaction. This returns one row
    per change to the balance, and a transaction that moves the balance more
    than once produces more than one change: an ACH deposit and its later
    return are two, and a card purchase that clears in two parts is two. Each
    change's `transactionId` names its transaction, so fetch it from
    `GET /transactions/{transactionId}` for its type, counterparty, merchant
    and rail.


    **The identity to assert:** `openingBalance + Σ(data[].amount) ==
    closingBalance`, summed over every page. The opening and closing balances
    describe the window rather than the page, so they are the same on every
    page. Page until `hasMore` is false, then assert the identity.


    `startDate` and `endDate` are instants in any timezone, UTC included, and
    the window is half-open: a change at exactly `endDate` belongs to the next
    window. Consecutive windows therefore tile with no gap and no overlap.


    A window whose card settlement has not closed is refused with `409
    NOT_YET_AVAILABLE`, because its figures could still change. Retry once
    it has settled.


    **Fees are inside the changes.** A fee Grid charges comes out of the
    balance, so it is already in `amount`: inside a send's change, or a change
    of its own for a withdrawal's fee. Each change's `fee` says how much of
    its `amount` was a fee, negative when charged and positive when refunded.
    To show a fee separately, split the change into `amount - fee` and `fee`.
    Never add `fee` on top of `amount`, or the identity stops holding. Card
    transactions carry no Grid fee.
  operationId: listInternalAccountBalanceChanges
  tags:
    - Periodic Statements
  security:
    - BasicAuth: []
  parameters:
    - name: startDate
      in: query
      required: true
      description: >-
        Start of the window, inclusive, in ISO 8601 format. Must carry a
        timezone, either `Z` for UTC or an offset.
      schema:
        type: string
        format: date-time
      example: '2026-08-01T00:00:00-05:00'
    - name: endDate
      in: query
      required: true
      description: >-
        End of the window, exclusive, in ISO 8601 format. Must carry a timezone,
        either `Z` for UTC or an offset, and must not be in the future.
      schema:
        type: string
        format: date-time
      example: '2026-09-01T00:00:00-05:00'
    - name: limit
      in: query
      required: false
      description: Maximum number of changes to return per page
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    - name: cursor
      in: query
      required: false
      description: >-
        Cursor for pagination: the `nextCursor` from the previous page,
        unchanged. Send it with the same account, `startDate` and `endDate` as
        that page. A cursor expires 24 hours after it is issued.
      schema:
        type: string
  responses:
    '200':
      description: The balance changes in the window, with the balances that bound it
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/internal_accounts/BalanceChangeListResponse.yaml
    '400':
      description: >-
        Bad request. Returned when `startDate` or `endDate` is missing, has no
        timezone, or is in the future, when `startDate` is not before
        `endDate`, when
        `cursor` was not issued by this endpoint for the same account and
        window or has expired, or when the account has no
        statement of its own.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Internal account not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        The window is not final yet. Card settlement for one of its boundaries
        has not closed, so its balances and changes could still change. Retry
        once it has settled.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
