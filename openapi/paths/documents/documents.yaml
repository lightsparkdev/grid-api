post:
  summary: Upload a document
  description: |
    Upload a verification document for a customer or beneficial owner.
    The request must use multipart/form-data with the file in the `file` field
    and metadata in the remaining fields.

    Supported file types: `application/pdf`, `image/jpeg`, and `image/png`.
    Grid matches on the `Content-Type` of the multipart part, not the file
    extension. Any other type, and any file over 10 MB, returns
    `400 INVALID_INPUT`.

    Grid forwards the file to its verification provider, which screens it as
    the request is handled and can reject it with `422 DOCUMENT_REJECTED`.
    To pass that screen, a photo or scan of a document must:

    - show the whole document, with all four corners inside the frame and
      nothing overlapping an edge
    - be in focus and free of glare, so every field and the machine-readable
      zone can be read
    - be in color, not a black-and-white copy
    - be a photo or scan of the physical document, not a screen capture, and
      not retouched in an image editor
    - be unexpired
  operationId: uploadDocument
  tags:
    - Documents
  security:
    - BasicAuth: []
  requestBody:
    $ref: ../../components/schemas/documents/DocumentUploadRequestBody.yaml
  responses:
    '201':
      description: Document uploaded successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/documents/Document.yaml
    '400':
      description: Bad request - Invalid file type, size, or parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Document holder not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '422':
      description: >-
        The verification provider rejected the file. `precheckErrors` names
        each problem it found. No document is created, so re-upload a
        corrected file with `POST /documents`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error422.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
get:
  summary: List documents
  description: >
    Retrieve a list of documents with optional filtering by document holder.
  operationId: listDocuments
  tags:
    - Documents
  security:
    - BasicAuth: []
  parameters:
    - name: documentHolder
      in: query
      description: Filter by document holder ID (Customer or BeneficialOwner)
      required: false
      schema:
        type: string
    - name: limit
      in: query
      description: Maximum number of results to return (default 20, max 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: cursor
      in: query
      description: Cursor for pagination (returned from previous request)
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/documents/DocumentListResponse.yaml
    '400':
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
