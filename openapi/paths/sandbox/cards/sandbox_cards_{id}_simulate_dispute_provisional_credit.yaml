post:
  summary: Simulate a provisional credit on a card dispute
  description: >
    Instruct a provisional credit to the cardholder on the transaction's open
    dispute, as the card issuer does while a dispute runs. The credit is paid
    from the card's funding source when the platform is enabled for dispute
    funding.


    Production returns `404` on this path.
  operationId: sandboxSimulateCardDisputeProvisionalCredit
  tags:
    - Sandbox
  security:
    - BasicAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: The id of the card the dispute is filed against.
      schema:
        type: string
      example: Card:019542f5-b3e7-1d02-0000-000000000010
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/cards/SandboxCardDisputeCreditRequest.yaml
        examples:
          fullProvisionalCredit:
            summary: Credit the cardholder the whole $15.00 disputed amount
            value:
              cardTransactionId: Transaction:019542f5-b3e7-1d02-0000-000000000100
              amount: 1500
  responses:
    '202':
      description: The credit was instructed.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/cards/SandboxCardDisputeResponse.yaml
    '400':
      description: >-
        Bad request - Invalid parameters, the transaction has no open dispute,
        or the amount exceeds the disputed amount
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error401.yaml
    '403':
      description: Forbidden - request was made with a production platform token
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error403.yaml
    '404':
      description: Card or card transaction not found
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        Conflict. The simulation targets a card in a program where the card
        issuer makes authorization decisions. These sandbox simulators support
        only card programs where Grid makes authorization decisions. This is a
        property of the card's program, so retrying will not help.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error500.yaml
