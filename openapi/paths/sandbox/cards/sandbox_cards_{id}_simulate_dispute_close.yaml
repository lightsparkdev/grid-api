post:
  summary: Simulate closing a card dispute
  description: >
    Close the transaction's open dispute with a disposition, as the card
    issuer does when the network process ends. A `PARTIALLY_WON` close is the
    one outcome whose split the caller names, with `recoveredAmount`; every
    other disposition recovers all of the disputed amount or none of it.


    Production returns `404` on this path.
  operationId: sandboxSimulateCardDisputeClose
  tags:
    - Sandbox
  security:
    - BasicAuth: []
  parameters:
    - name: id
      in: path
      required: true
      description: The id of the card the dispute is filed against.
      schema:
        type: string
      example: Card:019542f5-b3e7-1d02-0000-000000000010
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/cards/SandboxCardDisputeCloseRequest.yaml
        examples:
          wonDispute:
            summary: The cardholder wins the whole disputed amount
            value:
              cardTransactionId: Transaction:019542f5-b3e7-1d02-0000-000000000100
              disposition: WON
          partiallyWonDispute:
            summary: The network gives back $4.00 of a $15.00 dispute
            value:
              cardTransactionId: Transaction:019542f5-b3e7-1d02-0000-000000000100
              disposition: PARTIALLY_WON
              recoveredAmount: 400
  responses:
    '202':
      description: The dispute was closed.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/cards/SandboxCardDisputeResponse.yaml
    '400':
      description: >-
        Bad request - Invalid parameters, the transaction has no open dispute,
        or a `PARTIALLY_WON` close named a `recoveredAmount` that is not
        strictly between 0 and the disputed amount
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error401.yaml
    '403':
      description: Forbidden - request was made with a production platform token
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error403.yaml
    '404':
      description: Card or card transaction not found
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        Conflict. The simulation targets a card in a program where the card
        issuer makes authorization decisions. These sandbox simulators support
        only card programs where Grid makes authorization decisions. This is a
        property of the card's program, so retrying will not help.
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error500.yaml
