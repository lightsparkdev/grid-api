post:
  summary: Simulate funding an internal account
  description: >
    Simulate receiving funds into an internal account in the sandbox environment.
    This is useful for testing scenarios where you need to add funds to a customer's
    or platform's internal account without going through a real bank transfer or
    following payment instructions.

    This endpoint is only for the sandbox environment and will fail for
    production platforms/keys.

    ### Funding a rule-based account

    Funding a `RULE_BASED` account triggers its sweep, exactly as a settled
    deposit does in production: the balance is swept to the rule's
    destination and the account is left at zero. A sweep the destination's
    corridor cannot carry fails, and the balance moves to the account holder's
    own account in the same currency instead. Either way the rule-based account
    is left at zero; it never holds a balance.

    The sweep's transaction reports a placeholder ACH depositor as its
    `REALTIME_FUNDING` source and the funded account as its
    `ruleBasedAccountId`, matching what a production deposit reports.

    To simulate the information a depositor attaches to a payment, pass
    `remittanceInformation`. It appears on the swept transaction's `source`
    (see `remittanceInformation` in the request body for which field).

    `description` cannot be set when funding a rule-based account: the swept
    transaction's description comes from the account's sweep rule, exactly as
    it does for a production deposit. Sending it returns `400 INVALID_INPUT`.

    ### Funding other account types

    `description` sets the memo on the incoming transaction for the credit.
    With `remittanceInformation` set, the credit is reported as a
    `REALTIME_FUNDING` ACH deposit from a placeholder sandbox depositor,
    matching what a production bank deposit reports.

    The request is validated before any funds are credited, so a request
    rejected with `400` leaves the balance unchanged.

    Sandbox simulates the API contract and the routing decision, not the
    banking rails. The quote, the corridor bounds, the destination checks and
    the webhook are all real; the settlement legs behind them are not, so
    timings and failure modes that originate at a partner bank cannot be
    reproduced here.
  operationId: sandboxFundInternalAccount
  tags:
    - Sandbox
  security:
    - BasicAuth: []
  parameters:
    - name: accountId
      in: path
      required: true
      description: The ID of the internal account to fund
      schema:
        type: string
      example: InternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/sandbox/SandboxFundRequest.yaml
        examples:
          fundUSDAccount:
            summary: Fund USD internal account with $1,000
            value:
              amount: 100000
          fundBTCAccount:
            summary: Fund BTC internal account with 0.01 BTC
            value:
              amount: 1000000
          fundUSDAccountWithDescription:
            summary: Fund USD internal account with a memo
            value:
              amount: 100000
              description: Test deposit for invoice reconciliation
          fundUSDAccountWithRemittance:
            summary: Fund USD internal account with depositor remittance information
            value:
              amount: 100000
              remittanceInformation: INV-2026-0042
          fundRuleBasedAccountWithRemittance:
            summary: Fund a rule-based account with depositor remittance information
            value:
              amount: 100000
              remittanceInformation: INV-2026-0042
  responses:
    '200':
      description: Internal account funded successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/InternalAccount.yaml
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: Forbidden - request was made with a production platform token
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '404':
      description: Internal account not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
