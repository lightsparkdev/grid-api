parameters:
  - name: id
    in: path
    description: System-generated unique card identifier
    required: true
    schema:
      type: string
post:
  summary: Unblock a card PIN
  description: >-
    Clear a `BLOCKED` PIN, restoring the cardholder's existing PIN without
    changing it. A PIN blocks after three consecutive incorrect entries;
    until it is cleared, PIN-verified transactions decline.


    Unblocking is idempotent and safe to call on a card whose `pinStatus` is
    already `OK`. It has no effect on a card with no PIN set, which returns
    `409` — set a PIN with `POST /cards/{id}/set-pin` instead.


    Each card permits one unblock attempt per rolling seven days. Further attempts
    return `409 PIN_CHANGE_REQUIRED` with `details.pinUnblockAvailableAt`.
    Change the PIN through either PIN-entry flow to recover sooner; changing
    the PIN does not reset the unblock allowance.


    Only request an unblock after authenticating the cardholder and receiving
    their explicit request. Do not automatically unblock after a declined
    transaction.


    Grid supports online PINs only. Offline PIN cards
    are not supported. Read `GET /cards/{id}` to check `pinStatus`.


    Every call is audit-logged with the requesting actor.
  operationId: unblockCardPin
  tags:
    - Cards
  security:
    - BasicAuth: []
  responses:
    '204':
      description: PIN unblock accepted; read GET /cards/{id} for its `pinStatus`.
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: >-
        Forbidden. The session has no attributable actor to audit the change
        against (for example, an impersonated dashboard session).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '404':
      description: Card not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        Conflict. Returned with `CONFLICT` for a closed card, a card with no PIN to
        unblock, or a card that does not support PIN management. Returned with
        `PIN_CHANGE_REQUIRED` when the card's seven-day unblock allowance is
        consumed. Change the PIN or wait until `details.pinUnblockAvailableAt`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
    '501':
      description: >-
        Not implemented in this environment. Cards are not enabled for
        every Grid deployment; environments without card support return
        `501 NOT_IMPLEMENTED`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error501.yaml
