parameters:
  - name: id
    in: path
    description: System-generated unique card identifier
    required: true
    schema:
      type: string
post:
  summary: Add a card to a digital wallet from a website
  description: >-
    Mint the payload Apple's or Google's web "Add to Wallet" button needs to
    add the card to the cardholder's wallet from your website (web push
    provisioning). Call it from your backend when the button asks for the
    card: from Apple's `jwsResolver`, or from Google's `onSessionCreated`
    with the three values it supplies. Hand the response straight to the
    wallet's script.


    The payload is encrypted to the wallet provider's keys, so neither your
    site nor your servers ever see card data. Do not store or log it; it is
    valid for one attempt. Authenticate the cardholder before calling.


    Web push provisioning is enabled per website by the card issuer and needs
    each wallet provider's approval of your site. Until then the call returns
    `409 CONFLICT`. See
    [Digital wallet tokenization](/cards/card-management/digital-wallet-tokenization).


    Only `ACTIVE` cards can be added. Every call is audit-logged with the
    requesting actor and the target wallet.
  operationId: webTokenizeCard
  tags:
    - Cards
  security:
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/cards/WebTokenizationRequestOneOf.yaml
        examples:
          applePay:
            summary: Apple Pay
            value:
              wallet: APPLE_PAY
          googlePay:
            summary: Google Pay
            value:
              wallet: GOOGLE_PAY
              serverSessionId: 8c3b8a7e-2a5d-4b7f-9c1e-6d2f0a1b3c4d
              publicDeviceId: 3f1c2b8e-7d4a-4c1e-9b2f-6a5d0e8c7b1a
              publicWalletId: 9b7e6d5c-4a3b-4f2e-8d1c-0b9a8f7e6d5c
  responses:
    '200':
      description: Provisioning payload minted.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/cards/WebTokenizationResponseOneOf.yaml
          examples:
            applePay:
              summary: Apple Pay
              value:
                wallet: APPLE_PAY
                applePay:
                  jws:
                    header:
                      kid: 2f6c8f6a-9a64-4f4e-8a3c-5b0d6e1f2a3b
                    protected: eyJhbGciOiJFUzI1NiJ9
                    payload: eyJlbmMiOiIuLi4ifQ
                    signature: c2lnbmF0dXJl
                  state: 7d1c0e9b-3a2f-4b6e-9c8d-1e0f2a3b4c5d
            googlePay:
              summary: Google Pay
              value:
                wallet: GOOGLE_PAY
                googlePay:
                  tspOpc: ZW5jcnlwdGVkLXRzcC1vcGM=
    '400':
      description: >-
        Invalid input. The body does not match the request shape for its
        `wallet`, or the wallet provider rejected the values. Start the
        add-to-wallet flow again on the page to obtain fresh values.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: >-
        Forbidden. The session has no attributable actor to audit the request
        against (for example, an impersonated dashboard session).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '404':
      description: Card not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        Conflict. `CARD_NOT_MUTABLE` when the card is `CLOSED`; `CONFLICT`
        when the card is not `ACTIVE`, its
        `cardCapabilities.supportsDigitalWalletTokenization` is false, or web
        push provisioning is not enabled for the card's program.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
    '501':
      description: >-
        Not implemented in this environment. Cards are not enabled for
        every Grid deployment; environments without a configured card
        issuer return `501 NOT_IMPLEMENTED`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error501.yaml
