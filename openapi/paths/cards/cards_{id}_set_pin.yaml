parameters:
  - name: id
    in: path
    description: System-generated unique card identifier
    required: true
    schema:
      type: string
post:
  summary: Set a card PIN
  description: >-
    Set or replace the card's online PIN using a block encrypted in your
    client with the published PIN encryption public key. Grid cannot decrypt
    the block and never stores or logs PIN material.


    Use this when you operate your own PIN-entry UI. For a hosted PIN-entry
    iframe, use
    `GET /cards/{id}/set-pin-url` — the two are alternatives, and a card may
    use either at any time.


    Setting a PIN clears a `BLOCKED` PIN, so a cardholder locked out by
    incorrect attempts can recover by choosing a new PIN without a separate
    unblock. Read `GET /cards/{id}` for the resulting status. Grid supports
    online PINs only; offline PIN cards are not supported.


    Every call is audit-logged with the requesting actor.
  operationId: setCardPin
  tags:
    - Cards
  security:
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/cards/CardPinSetRequest.yaml
  responses:
    '204':
      description: PIN change accepted.
    '400':
      description: >-
        Bad request. Returned with `INVALID_INPUT` when `encryptedPinBlock`
        is absent, is not valid base64, or the encrypted block is rejected.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: >-
        Forbidden. The session has no attributable actor to audit the change
        against (for example, an impersonated dashboard session).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '404':
      description: Card not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        Conflict. Returned with `CONFLICT` for a closed card or a card that
        does not support PIN management.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
    '501':
      description: >-
        Not implemented in this environment. Cards are not enabled for
        every Grid deployment; environments without card support return
        `501 NOT_IMPLEMENTED`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error501.yaml
