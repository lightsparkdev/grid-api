parameters:
  - name: id
    in: path
    description: System-generated unique card identifier
    required: true
    schema:
      type: string
get:
  summary: Get a card
  description: >-
    Retrieve a card by its system-generated id. To display the card's full
    PAN, CVV, and expiry to the cardholder, request a reveal with
    `POST /cards/{id}/reveal` — the card resource itself never
    carries the reveal URL.
  operationId: getCardById
  tags:
    - Cards
  security:
    - BasicAuth: []
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/cards/Card.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Card not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
    '501':
      description: >-
        Not implemented in this environment. Cards are not enabled for
        every Grid deployment; environments without a configured card
        issuer return `501 NOT_IMPLEMENTED`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error501.yaml
patch:
  summary: Update a card
  description: >
    Update a card's `state`, bound `fundingSources`, and / or
    `maxSpendPerTransaction`. At least one field must be supplied.


    - `state` transitions are limited to `ACTIVE ⇄ FROZEN` and
    `ACTIVE | FROZEN → CLOSED`. `CLOSED` is terminal and irreversible.
    Any other transition returns `409 INVALID_STATE_TRANSITION`.

    - `fundingSources`, when supplied, fully replaces the card's bound
    funding sources. Array order determines the priority Authorization
    Decisioning tries them in. Each id must belong to the cardholder and
    be denominated in the card's currency; the list must contain at least
    one source. `fundingSources` cannot be supplied alongside
    `state: CLOSED`.

    - `maxSpendPerTransaction`, when supplied, replaces the card-specific
    per-transaction cap. Supply a positive integer in the smallest unit of the
    card's currency to set it or null to clear it. If the platform config sets
    `cardConfigs.maxSpendPerTransaction`, Grid enforces the lower of the card
    and platform values. Limits are supported only for card programs where
    Grid makes the authorization decision. `maxSpendPerTransaction` cannot be
    supplied alongside `state: CLOSED`.


    This endpoint is authenticated by the platform credential alone and
    returns `200` directly. It deliberately does not use Grid's 202 →
    signed-retry pattern: that pattern signs with the session key of a
    credential on the owning internal account, so it models actions taken
    *by* the end user on their own credentials or funds. Freezing or
    closing a card is routinely an action taken *about* a user and without
    them present - fraud response, offboarding, an ops-driven freeze - and
    requiring the cardholder's signature would make exactly those cases
    impossible. Operations that expose sensitive card data
    (`POST /cards/{id}/reveal`, 3DS password retrieval) are SCA-railed
    instead, because there the cardholder is the party being served.


    Effects:

    - `state: FROZEN`: Authorization Decisioning declines new auths with
    `CARD_PAUSED`. Existing pulls and in-flight reconciliation continue —
    freezing does not pause the lifecycle of authorizations that already
    passed.

    - `state: ACTIVE`: normal authorization behavior resumes.

    - `state: CLOSED`: terminal close. The card transitions to
    `state: "CLOSED"` with `stateReason: "CLOSED_BY_PLATFORM"` and stays
    in the system for audit and reconciliation. All pending auths
    reconcile to a terminal state via the existing reconcile primitive.
    Inbound clearings received after close follow the standard
    force-post / late-presentment path — Lightspark absorbs the loss if
    a post-hoc pull on the now-unbound source fails. Funding-source
    bindings are detached. Refunds already in flight still complete
    because Lightspark holds the card-reserve keys.

    - `fundingSources` change: emits `card.funding_source_change` reflecting
    the new ordered binding.


    The `card.state_change` webhook fires on every successful `state`
    transition; the `card.funding_source_change` webhook fires whenever
    `fundingSources` is updated.
  operationId: updateCardById
  tags:
    - Cards
  security:
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/cards/CardUpdateRequest.yaml
        examples:
          freeze:
            summary: Freeze an active card
            value:
              state: FROZEN
          unfreeze:
            summary: Unfreeze a frozen card
            value:
              state: ACTIVE
          updateFundingSources:
            summary: Replace the card's bound funding sources
            value:
              fundingSources:
                - InternalAccount:019542f5-b3e7-1d02-0000-000000000002
                - InternalAccount:019542f5-b3e7-1d02-0000-000000000003
          setSpendingLimit:
            summary: Set the card's per-transaction spending limit
            value:
              maxSpendPerTransaction: 10000
          clearSpendingLimit:
            summary: Remove the card's per-transaction spending limit
            value:
              maxSpendPerTransaction: null
          freezeAndUpdateSources:
            summary: Freeze the card and replace its funding sources in one call
            value:
              state: FROZEN
              fundingSources:
                - InternalAccount:019542f5-b3e7-1d02-0000-000000000002
          close:
            summary: Permanently close the card
            value:
              state: CLOSED
  responses:
    '200':
      description: Card updated. Returns the updated card.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/cards/Card.yaml
    '400':
      description: >-
        Bad request. Returned with `FUNDING_SOURCE_INELIGIBLE` when a
        supplied funding source does not belong to the cardholder or is
        not denominated in the card's currency, and for general invalid
        parameters.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: >-
        Unauthorized. Returned when the platform credential is missing or
        invalid, or does not grant access to this card.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Card not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        Conflict. Returned with `INVALID_STATE_TRANSITION` when the
        requested `state` transition is not one of
        `ACTIVE ⇄ FROZEN` or `ACTIVE | FROZEN → CLOSED` (e.g. trying
        to un-freeze a `CLOSED` card); with `CARD_ALREADY_CLOSED` when
        `state: CLOSED` is requested for a card that is already
        `CLOSED`; and with `CARD_NOT_MUTABLE` when the card is
        `CLOSED`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
    '501':
      description: >-
        Not implemented in this environment. Cards are not enabled for
        every Grid deployment; environments without a configured card
        issuer return `501 NOT_IMPLEMENTED`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error501.yaml
