get:
  summary: Get a beneficial owner
  description: Retrieve details of a specific beneficial owner by ID.
  operationId: getBeneficialOwner
  tags:
    - KYC/KYB Verifications
  security:
    - BasicAuth: []
  parameters:
    - name: beneficialOwnerId
      in: path
      description: Beneficial owner ID
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/BeneficialOwner.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Beneficial owner not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
patch:
  summary: Update a beneficial owner
  description: Update details of a specific beneficial owner. Only provided fields are updated.
  operationId: updateBeneficialOwner
  tags:
    - KYC/KYB Verifications
  security:
    - BasicAuth: []
  parameters:
    - name: beneficialOwnerId
      in: path
      description: Beneficial owner ID
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/customers/BeneficialOwnerUpdateRequest.yaml
  responses:
    '200':
      description: Beneficial owner updated successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/BeneficialOwner.yaml
    '400':
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Beneficial owner not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
delete:
  summary: Delete a beneficial owner
  description: >-
    Remove a beneficial owner from a business customer. The owner's uploaded
    documents are deleted with them, and the customer's verification status
    is recomputed without this owner. The request is rejected while a
    verification review that includes this owner is in progress; wait for
    the review to finish and retry.
  operationId: deleteBeneficialOwner
  tags:
    - KYC/KYB Verifications
  security:
    - BasicAuth: []
  parameters:
    - name: beneficialOwnerId
      in: path
      description: Beneficial owner ID
      required: true
      schema:
        type: string
  responses:
    '204':
      description: Beneficial owner deleted successfully
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Beneficial owner not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        Conflict. A verification review that includes this beneficial owner
        is in progress. Retry after the review finishes.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
