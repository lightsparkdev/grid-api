post:
  summary: Create a transfer quote
  description: |
    Generate a quote for a transfer between any combination of accounts
    and UMA addresses. This endpoint handles same-currency and cross-currency
    transfers alike, and provides the necessary instructions to execute the transfer.

    **Transfer Types Supported:**
    - **Account to Account**: Transfer between internal/external accounts, with or without currency exchange.
    - **Account to UMA**: Transfer from an internal account to an UMA address.
    - **UMA to Account or UMA to UMA**: This transfer type will only be funded by payment instructions, not from an internal account.

    **Key Features:**
    - **Flexible Amount Locking**: Always specify whether you want to lock the sending amount or receiving amount
    - **Currency Exchange**: Handles all cross-currency transfers with real-time exchange rates
    - **Payment Instructions**: For UMA or customer ID sources, provides banking details needed for execution

    **Same-currency transfers:** Use this endpoint for same-currency transfers too.
    Set `immediatelyExecute: true` to create and execute in a single request. The
    older `/transfer-in` and `/transfer-out` endpoints are deprecated.

    Requires a token with the `TRANSACT` permission; `VIEW` alone is not
    sufficient. A quote is the instrument a later execute draws on, and
    `immediatelyExecute` moves funds within this same request.
  operationId: createQuote
  tags:
    - Cross-Currency Transfers
  security:
    - BasicAuth: []
  parameters:
    - name: Idempotency-Key
      in: header
      required: false
      description: >
        A unique identifier for the request. If the same key is sent multiple times,
        the server will return the same response as the first request.
      schema:
        type: string
        example: <uuid>
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/quotes/QuoteRequest.yaml
        examples:
          sameCurrencyAccountToAccount:
            summary: Same-Currency Account to Account Transfer (immediate execution)
            value:
              source:
                sourceType: ACCOUNT
                accountId: InternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
              destination:
                destinationType: ACCOUNT
                accountId: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                paymentRail: ACH
              lockedCurrencySide: SENDING
              lockedCurrencyAmount: 12550
              immediatelyExecute: true
              remittanceInformation: INV-12345
              description: 'Same-currency payout, no exchange required.'
          accountToAccount:
            summary: Account to Account Transfer
            value:
              source:
                sourceType: ACCOUNT
                accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
              destination:
                destinationType: ACCOUNT
                accountId: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
              lockedCurrencySide: SENDING
              lockedCurrencyAmount: 10000
              description: 'Transfer between accounts, either internal or external.'
          accountToUma:
            summary: Account to UMA Address Transfer
            value:
              lookupId: LookupRequest:019542f5-b3e7-1d02-0000-000000000009
              source:
                sourceType: ACCOUNT
                accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
              destination:
                destinationType: UMA_ADDRESS
                umaAddress: $receiver@uma.domain.com
                currency: EUR
              lockedCurrencySide: SENDING
              lockedCurrencyAmount: 1000
              description: 'Payment for invoice #1234'
          realTimeFundingToSparkWallet:
            summary: Real-time funding to Spark Wallet as an on-ramp flow. Immediate execution.
            value:
              source:
                sourceType: REALTIME_FUNDING
                customerId: Customer:019542f5-b3e7-1d02-0000-000000000009
                currency: USD
              destination:
                destinationType: ACCOUNT
                accountId: ExternalAccount:b23dcbd6-dced-4ec4-b756-3c3a9ea3d456
              lockedCurrencySide: RECEIVING
              lockedCurrencyAmount: 10000
              immediatelyExecute: true
              description: 'Bitcoin reward payout!'
  responses:
    '201':
      description: |
        Transfer quote created successfully. The response includes exchange rates,
        fees, and transfer details. For transfers involving UMA addresses, payment
        instructions are also included for execution through banking systems.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/quotes/Quote.yaml
          example:
            id: Quote:019542f5-b3e7-1d02-0000-000000000006
            status: PENDING
            createdAt: '2025-10-03T12:00:00Z'
            expiresAt: '2025-10-03T12:05:00Z'
            source:
              sourceType: ACCOUNT
              accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
            destination:
              destinationType: ACCOUNT
              accountId: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
            sendingCurrency:
              code: USD
              name: United States Dollar
              symbol: $
              decimals: 2
            receivingCurrency:
              code: EUR
              name: Euro
              symbol: €
              decimals: 2
            totalSendingAmount: 10000
            totalReceivingAmount: 9200
            exchangeRate: 0.92
            feesIncluded: 10
            platformFeesIncluded: 0
            transactionId: Transaction:019542f5-b3e7-1d02-0000-000000000005
    '202':
      description: >
        Quote created but awaiting Strong Customer Authentication. Returned only
        for customers whose provider requires SCA (e.g. EU) on a realtime-funding
        source: the quote has status `PENDING_AUTHORIZATION` and carries an
        `scaChallenge`, and `paymentInstructions` are **withheld** until the
        challenge is authorized via `POST /quotes/{quoteId}/authorize`. Once
        authorized, the quote's `paymentInstructions` are populated.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/quotes/Quote.yaml
    '400':
      description: Bad request - Missing or invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: >-
        Forbidden. The token lacks the `TRANSACT` permission, or the customer has
        not accepted the End User Terms.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '412':
      description: Counterparty doesn't support UMA version
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error412.yaml
    '424':
      description: Counterparty issue
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error424.yaml
    '429':
      description: >-
        Too many requests. Returned with `DAILY_VOLUME_LIMIT_EXCEEDED` when
        `immediatelyExecute` is set and the requested amount would exceed the
        configured daily volume limit for the trade corridor.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error429.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
    '501':
      description: Not implemented
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error501.yaml
