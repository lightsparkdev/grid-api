get:
  summary: Get quote by idempotency key
  description: >
    Retrieve the quote that a `POST /quotes` request created, by the
    `Idempotency-Key` that request carried. Use it when the response to
    `POST /quotes` was lost: the quote, and its `transactionId` once it has
    executed, come back exactly as `GET /quotes/{quoteId}` returns them.


    Idempotency keys do not expire. A key finds its quote for as long as the
    quote exists, whatever the quote's status.


    A `404` means no transaction exists under the key yet. A `POST /quotes`
    still in flight can create one afterwards, so to send the payment again,
    resend `POST /quotes` with the same `Idempotency-Key` and the same body:
    Grid creates the quote once, whichever request arrives first. If that
    retry returns `400` asking for a new `Idempotency-Key`, the first request
    stopped before creating a transaction, and a new key is safe to use.


    Only keys sent to `POST /quotes` are looked up. Keys sent to
    `POST /transfer-in` and `POST /transfer-out` are not.
  operationId: getQuoteByIdempotencyKey
  tags:
    - Cross-Currency Transfers
  security:
    - BasicAuth: []
  parameters:
    - name: key
      in: query
      description: >-
        The `Idempotency-Key` header value sent with `POST /quotes`. Leading
        and trailing whitespace is ignored, as it is on `POST /quotes`.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
        example: 3f1c2b9e-7d4a-4f0e-9b1a-2c6d8e5f7a10
  responses:
    '200':
      description: The quote created under this idempotency key
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/quotes/Quote.yaml
    '400':
      description: Bad request. Returned when `key` is missing or blank.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: >-
        No transaction was created under this idempotency key
        (`QUOTE_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
