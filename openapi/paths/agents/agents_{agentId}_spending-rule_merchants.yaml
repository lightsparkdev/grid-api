parameters:
  - name: agentId
    in: path
    description: System-generated unique agent identifier
    required: true
    schema:
      type: string
get:
  summary: List the owner's answers about merchants
  description: >-
    The answers the agent's owner gave about whether the agent may buy from a
    merchant, kept for the agent's rule, most recently changed first. An
    answer is given by approving or rejecting a `SPENDING_RULE_QUESTION`
    agent action. Merchant fields are untrusted text the merchant controls;
    escape them before display.
  operationId: listAgentSpendingRuleMerchantAnswers
  x-hidden: true
  tags:
    - Agent Management
  security:
    - BasicAuth: []
  parameters:
    - name: status
      in: query
      description: >-
        Only answers in this status. Without it, every answer that is not
        `REMOVED`.
      required: false
      schema:
        $ref: ../../components/schemas/spending_rules/SpendingRuleMerchantAnswerStatus.yaml
    - name: limit
      in: query
      description: Maximum number of results to return (default 20, max 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: cursor
      in: query
      description: Cursor for pagination (returned from previous request)
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/spending_rules/SpendingRuleMerchantAnswerListResponse.yaml
    '400':
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: >-
        Forbidden - Agents API is not enabled for the platform, or spending
        rules are not (`SPENDING_RULES_DISABLED`)
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '404':
      description: Agent not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
