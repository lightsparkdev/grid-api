post:
  summary: Create a transfer quote
  description: >
    Generate a quote for a cross-currency transfer on behalf of the authenticated
    agent's customer. Accounts referenced in the request must belong to the agent's
    customer. Requires the CREATE_QUOTES permission in the agent's policy.

    The destination is another embedded wallet or one of the customer's Spark
    addresses saved with `POST /agents/me/external-accounts` (`ACCOUNT`), an
    address on another chain (`CHAIN_ADDRESS`), or a BOLT11 Lightning invoice
    (`LIGHTNING_INVOICE`). Grid answers
    `DESTINATION_NOT_ALLOWED` for a Spark address that was refused, or is held
    for review, on any of the customer's records of it, under either prefix and
    including removed ones. A `CHAIN_ADDRESS` quote sends `USDB`. Grid
    pays the chain itself at a locked rate, so the amount the recipient
    receives is fixed when the quote is created and equals the quote's
    `minimumReceivingAmount`. A `LIGHTNING_INVOICE` quote sends `USDB` and
    pays exactly the invoice's amount, which it locks on the receiving side in
    satoshis, through the platform's Lightning invoice quote (`POST /quotes`).
    Grid pays the invoice once the send executes and refunds the `USDB` if the
    payment fails.

    If the agent's defaultExecutionMode is APPROVAL_REQUIRED, or the quote amount
    exceeds the agent's approvalThresholds, the resulting transaction will require
    explicit approval before funds move.
  operationId: agentCreateQuote
  tags:
    - Agent Operations
  security:
    - AgentAuth: []
  parameters:
    - name: Idempotency-Key
      in: header
      required: false
      description: >
        A unique identifier for the request. If the same key is sent multiple times,
        the server will return the same response as the first request.
      schema:
        type: string
        maxLength: 255
        example: <uuid>
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/AgentQuoteRequest.yaml
  responses:
    '201':
      description: Transfer quote created successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentQuote.yaml
    '400':
      description: Bad request - Missing or invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: >-
        Forbidden - Agents API is not enabled for the platform, the agent policy does
        not permit this operation, the agent may not pay the destination
        (`DESTINATION_NOT_ALLOWED`), or the platform does not pay Lightning
        invoices for agents (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '409':
      description: >-
        Conflict - Another quote for the `LIGHTNING_INVOICE` can still be
        executed, or was executed (`INVOICE_ALREADY_USED`).
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '412':
      description: Counterparty doesn't support UMA version
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error412.yaml
    '424':
      description: Counterparty issue
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error424.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
    '502':
      description: Counterparty returned an error or an invalid response
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error502.yaml
    '503':
      description: >-
        Service unavailable - Grid could not screen a `CHAIN_ADDRESS`
        destination or price the conversion right now. Retry later.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error503.yaml
    '504':
      description: Counterparty could not be reached or timed out
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error504.yaml
