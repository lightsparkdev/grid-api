post:
  summary: Redeem device code
  description: >
    Redeem a device code to obtain agent credentials. This endpoint is called by the
    agent software during installation. On success, returns a Bearer access token
    that the agent uses for all subsequent API calls. The token is returned only once
    and must be stored securely.

    This endpoint does not require platform authentication — the device code itself
    serves as proof of authorization. A code can be redeemed only once and only
    before its `expiresAt`.

    Redemption is rate limited. A caller over the limit receives `429` with
    `RATE_LIMITED` and a `Retry-After` header, and should wait that long before
    retrying. If the limit cannot be checked, the call is also rejected with `429`.
  operationId: redeemAgentDeviceCode
  tags:
    - Agent Management
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/agents/AgentDeviceCodeRequest.yaml
  responses:
    '200':
      description: Device code redeemed successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentDeviceCodeRedeemResponse.yaml
    '400':
      description: Bad request (e.g., code already redeemed or expired)
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '403':
      description: Forbidden - Agents API is not enabled for the platform
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '404':
      description: Device code not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '429':
      description: Too many requests. Returned with `RATE_LIMITED`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error429.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
