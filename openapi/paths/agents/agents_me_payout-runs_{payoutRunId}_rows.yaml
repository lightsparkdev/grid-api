parameters:
  - name: payoutRunId
    in: path
    required: true
    description: System-generated unique payout run identifier
    schema:
      type: string
    example: PayoutRun:019542f5-b3e7-1d02-0000-000000000001
get:
  summary: List the rows of a payout run
  description: The rows of a run the authenticated agent created, in the order they were submitted.
  operationId: agentListPayoutRunRows
  tags:
    - Agent Operations
  security:
    - AgentAuth: []
  parameters:
    - name: state
      in: query
      description: Only rows in this state
      required: false
      schema:
        $ref: ../../components/schemas/payout_runs/PayoutRunRowState.yaml
    - name: limit
      in: query
      description: Maximum number of results to return (default 50, max 200)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    - name: cursor
      in: query
      description: Cursor for pagination (returned from previous request)
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/payout_runs/PayoutRunRowListResponse.yaml
    '400':
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: Forbidden - Agent payout runs are not enabled for the platform
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '404':
      description: Not found - No payout run with this id was created by this agent
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
