parameters:
  - name: agentId
    in: path
    description: System-generated unique agent identifier
    required: true
    schema:
      type: string
  - name: actionId
    in: path
    description: Unique identifier of the agent action to approve
    required: true
    schema:
      type: string
post:
  summary: Approve an agent action
  description: >
    Approve a pending agent action, allowing Grid to proceed with execution. The action
    must have status `PENDING_APPROVAL`. Once approved, Grid executes the underlying
    operation (quote execution or transfer) and the action transitions to `APPROVED`.

    For `EXECUTE_QUOTE` actions, note that the underlying quote may have expired between
    submission and approval — in that case the action will transition to `FAILED` instead.

    An `EXECUTE_QUOTE` action with `priceTolerance` is quoted again on approval, and
    approval runs every check against the new quote and its amount. When the new
    price is no worse for the customer than `priceTolerance` allows, Grid executes
    the new quote and the action transitions to `APPROVED` with it as `quote`. When
    it is worse by more, nothing is sent: the response is `200` with status still
    `PENDING_APPROVAL`, the new `quote`, and `previousQuote` set to the quote the
    customer was shown, so they can be asked again; approving again repeats the
    check against the new quote. A send Grid can no longer quote fails with the
    matching `failureReason`, and one past its `expiresAt` with `APPROVAL_EXPIRED`.

    For `ISSUE_PURCHASE_CARD` actions, approval issues the purchase card and the action
    carries its `cardId`. The card's limit is checked against the agent's policy again
    first; an action past its `expiresAt` fails with `APPROVAL_EXPIRED`, one the policy now
    denies with `POLICY_DENIED`, a paused or deleted agent with `AGENT_INACTIVE`, and one
    the card issuer refuses with `EXECUTION_FAILED`.

    This endpoint is called by the platform's backend using platform credentials,
    not by the agent itself.
  operationId: approveAgentAction
  tags:
    - Agent Management
  security:
    - BasicAuth: []
  responses:
    '200':
      description: >-
        Action approved, or, for an action whose new quote moved past
        `priceTolerance`, still `PENDING_APPROVAL` with `previousQuote` set.
        Returns the updated AgentAction.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/agents/AgentAction.yaml
    '400':
      description: Bad request - Action cannot be approved
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: Forbidden - Agents API is not enabled for the platform
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '404':
      description: Agent or action not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: Conflict - Action is not pending approval or has already been processed
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
