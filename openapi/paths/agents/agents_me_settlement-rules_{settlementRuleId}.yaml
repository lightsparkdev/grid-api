parameters:
  - name: settlementRuleId
    in: path
    required: true
    description: System-generated unique settlement rule identifier
    schema:
      type: string
    example: SettlementRule:019542f5-b3e7-1d02-0000-000000000001
get:
  summary: Get a settlement rule
  description: Retrieve a settlement rule the authenticated agent created. A rule another agent or the platform created is not found. Requires the MANAGE_SETTLEMENT_RULES or VIEW_TRANSACTIONS permission.
  operationId: agentGetSettlementRule
  tags:
    - Agent Operations
  security:
    - AgentAuth: []
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/settlement_rules/SettlementRule.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: Forbidden - Settlement rules are not enabled for the platform, or the agent lacks both permissions
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '404':
      description: Not found - The agent created no settlement rule with this id
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
delete:
  summary: Delete a settlement rule
  description: |
    The rule becomes `DELETED` and fires on no further payment. Its executions still held are skipped with `CANCELLED`. A rule still `PENDING_APPROVAL` is withdrawn: its `CREATE_SETTLEMENT_RULE` action fails with `DELETED_BY_AGENT`. Deleting a deleted rule returns it unchanged.

    Requires the MANAGE_SETTLEMENT_RULES permission.
  operationId: agentDeleteSettlementRule
  tags:
    - Agent Operations
  security:
    - AgentAuth: []
  responses:
    '200':
      description: The deleted rule
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/settlement_rules/SettlementRule.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: Forbidden - Settlement rules are not enabled for the platform, or the agent lacks MANAGE_SETTLEMENT_RULES
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '404':
      description: Not found - The agent created no settlement rule with this id
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
