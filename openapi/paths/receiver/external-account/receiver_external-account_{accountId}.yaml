get:
  summary: Look up an external account for payment
  description: >
    Lookup an external account by ID to determine supported currencies and
    exchange rates.

    This endpoint helps platforms determine what currencies they can send to a
    given external account, along with the current estimated exchange rates and
    minimum and maximum amounts that can be sent.

    When payouts to the account need supporting documents, which today means
    China B2B CNY payouts, the response also includes `paymentRequirements`.
    It lists the documents each purpose of payment requires. Upload them with
    `POST /payment-documents` before you create the quote.
  operationId: lookupExternalAccount
  tags:
    - Cross-Currency Transfers
  security:
    - BasicAuth: []
  parameters:
    - name: accountId
      in: path
      description: System-generated ID of the external account
      required: true
      schema:
        type: string
        example: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
    - name: senderUmaAddress
      in: query
      description: UMA address of the sender (optional if customerId is provided)
      required: false
      schema:
        type: string
    - name: customerId
      in: query
      description: System ID of the sender (optional if senderUmaAddress is provided)
      required: false
      schema:
        type: string
    - name: sendingCurrency
      in: query
      description: >-
        Currency code the sender will send from (e.g., USD). Selects which of the
        sender's configured currencies the response is priced against: it is
        echoed back as the response's `sendingCurrency`, and the
        `minSendingAmount`/`maxSendingAmount` bounds are denominated in its
        smallest unit. Defaults to the sender's default currency.
      required: false
      schema:
        type: string
      example: USD
  responses:
    '200':
      description: Successful lookup
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/receiver/ReceiverExternalAccountLookupResponse.yaml
          examples:
            standard:
              summary: Account with no supporting-document requirements
              value:
                accountId: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                lookupId: Lookup:019542f5-b3e7-1d02-0000-000000000009
                sendingCurrency:
                  code: USD
                  name: United States Dollar
                  symbol: $
                  decimals: 2
                supportedCurrencies:
                  - currency:
                      code: MXN
                      name: Mexican Peso
                      symbol: $
                      decimals: 2
                    estimatedExchangeRate: 18.5
                    min: 2000
                    max: 185000000
                    minSendingAmount: 109
                    maxSendingAmount: 10000000
            chinaB2BCny:
              summary: China B2B CNY account that requires supporting documents
              value:
                accountId: ExternalAccount:c34dcbd6-dced-4ec4-b756-3c3a9ea3d789
                lookupId: Lookup:019542f5-b3e7-1d02-0000-000000000009
                sendingCurrency:
                  code: USD
                  name: United States Dollar
                  symbol: $
                  decimals: 2
                supportedCurrencies:
                  - currency:
                      code: CNY
                      name: Chinese Yuan
                      symbol: ¥
                      decimals: 2
                    estimatedExchangeRate: 7.1
                    min: 100
                    max: 50000000
                paymentRequirements:
                  maxDocuments: 3
                  maxDocumentSizeBytes: 8000000
                  acceptedContentTypes:
                    - application/pdf
                    - image/jpeg
                    - image/png
                  purposes:
                    - purposeOfPayment: EXPORTED_GOODS_PREPAYMENT
                      requiredDocuments:
                        - requirementId: PURCHASE_ORDER
                          acceptedDocumentTypes:
                            - PURCHASE_ORDER
                      serviceCategoryRequired: false
                    - purposeOfPayment: EXPORTED_GOODS_POSTPAYMENT
                      requiredDocuments:
                        - requirementId: LOGISTICS_BILL
                          acceptedDocumentTypes:
                            - LOGISTICS_BILL
                        - requirementId: CUSTOMS_DECLARATION
                          acceptedDocumentTypes:
                            - CUSTOMS_DECLARATION
                        - requirementId: COMMERCIAL_AGREEMENT
                          acceptedDocumentTypes:
                            - PURCHASE_ORDER
                            - INVOICE
                            - CONTRACT
                      serviceCategoryRequired: false
                    - purposeOfPayment: SERVICE_CHARGES
                      requiredDocuments:
                        - requirementId: CONTRACT
                          acceptedDocumentTypes:
                            - CONTRACT
                        - requirementId: INVOICE
                          acceptedDocumentTypes:
                            - INVOICE
                        - requirementId: SUPPORTING_PROOF
                          acceptedDocumentTypes:
                            - PURCHASE_ORDER
                            - DELIVERY_SLIP
                      serviceCategoryRequired: true
                    - purposeOfPayment: OFFICE_EXPENSES
                      requiredDocuments:
                        - requirementId: CONTRACT
                          acceptedDocumentTypes:
                            - CONTRACT
                        - requirementId: INVOICE
                          acceptedDocumentTypes:
                            - INVOICE
                      serviceCategoryRequired: false
                    - purposeOfPayment: DELIVERY_FEES
                      requiredDocuments:
                        - requirementId: BILL_OF_LADING
                          acceptedDocumentTypes:
                            - BILL_OF_LADING
                        - requirementId: CONTRACT_OR_INVOICE
                          acceptedDocumentTypes:
                            - CONTRACT
                            - INVOICE
                      serviceCategoryRequired: false
                    - purposeOfPayment: TRAVEL
                      requiredDocuments:
                        - requirementId: FLIGHT_TICKET
                          acceptedDocumentTypes:
                            - FLIGHT_TICKET
                        - requirementId: TRAVEL_DOCUMENT
                          acceptedDocumentTypes:
                            - TRAVEL_DOCUMENT
                        - requirementId: HOTEL_BOOKING_CONFIRMATION
                          acceptedDocumentTypes:
                            - HOTEL_BOOKING_CONFIRMATION
                      serviceCategoryRequired: false
                    - purposeOfPayment: HOTEL_ACCOMMODATION
                      requiredDocuments:
                        - requirementId: HOTEL_BOOKING_CONFIRMATION
                          acceptedDocumentTypes:
                            - HOTEL_BOOKING_CONFIRMATION
                      serviceCategoryRequired: false
    '400':
      description: Bad request - Missing or invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error401.yaml
    '404':
      description: External account not found
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error404.yaml
    '412':
      description: Counterparty doesn't support UMA version
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error412.yaml
    '424':
      description: Counterparty issue
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error424.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/errors/Error500.yaml
