parameters:
  - name: chatId
    in: path
    description: >-
      The chat to send another code on, as returned in `chatId` by
      `POST /care/chats/{chatId}/messages`.
    required: true
    schema:
      type: string
    example: CareChat:019542f5-b3e7-1d02-0000-000000000030
post:
  summary: Resend a care chat verification code
  description: |
    Send the cardholder another verification code.

    **This is the resend, not the first send.** The cardholder's first message
    already sent a code and said so in its own body; this is what the *Send
    another code* button calls when they say it never arrived. A partner never
    has to call it to start verification.

    With `resend` false — the default, and the same as sending no body — the
    call asks for a code and is content to be told one is already outstanding:
    the answer carries `alreadySent: true` and no new SMS goes out. That is a
    success. With `resend` true a second code is sent. Ask the cardholder
    before doing that: codes are sent from a pool of numbers, so the second
    arrives from a different sender than the first, leaving them holding two
    codes from two strangers and deciding which to read back.

    The destination is always the number already on file for the cardholder.
    There is no way to nominate one, because a code sent to a number the
    caller chose would prove nothing about the person holding the card.

    `202`, not `200`: the SMS is in flight, not delivered.

    A chat that is already verified is refused with `INVALID_INPUT` while its
    verification is recent — there is nothing left to prove. Once that
    verification has aged past the session lifetime the refusal lifts and a
    fresh code can be sent.
  operationId: resendCareChatVerification
  tags:
    - Embedded Care
  security:
    - BasicAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/care/CareChatVerificationRequest.yaml
        examples:
          askForACode:
            summary: Ask for a code, accepting the one already outstanding
            value:
              resend: false
          deliberateResend:
            summary: The cardholder says the first code never arrived
            value:
              resend: true
  responses:
    '202':
      description: >-
        The code is on its way, or one was already outstanding and none was
        sent — `alreadySent` says which.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/care/CareChatVerificationResponse.yaml
    '400':
      description: >-
        `INVALID_INPUT` when the chat is already verified, when the body
        carries an unknown field, or when verification is not available for
        this chat at all — the platform's care programme does not offer SMS
        verification, or the cardholder record behind the chat could not be
        read.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/care/CareError.yaml
    '401':
      description: '`UNAUTHORIZED` — the platform''s Grid credential is missing or wrong.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/care/CareError.yaml
    '403':
      description: '`FORBIDDEN` — embedded care is not enabled for this platform.'
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/care/CareError.yaml
    '404':
      description: >-
        `NOT_FOUND` — no such chat for this platform. A chat that belongs to
        another platform, one that never existed, and a malformed chat id are
        one answer.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/care/CareError.yaml
    '409':
      description: >-
        `CARE_CHAT_ENDED` when the chat has been closed, or `CONFLICT` when it
        has no cardholder bound to it.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/care/CareError.yaml
    '429':
      description: >-
        `CARE_BUDGET_EXCEEDED` when this chat has reached its limit, or
        `RATE_LIMITED` when the platform is calling this endpoint too often;
        back off for the interval in the `Retry-After` header.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/care/CareError.yaml
    '500':
      description: Internal service error.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/care/CareError.yaml
    '502':
      description: >-
        `CARE_VERIFICATION_UNAVAILABLE` — the SMS provider could not be
        reached. The factor is down, so retry rather than asking the
        cardholder for anything.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/care/CareError.yaml
    '503':
      description: >-
        `SERVICE_UNAVAILABLE` when embedded care is not available in this
        deployment, or the support agent is temporarily turned off.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/care/CareError.yaml
