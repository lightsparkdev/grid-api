get:
  summary: Get an ownership verification
  description: Retrieve details of a specific ownership verification by ID.
  operationId: getOwnershipVerification
  tags:
    - Ownership Verifications
  security:
    - BasicAuth: []
  parameters:
    - name: verificationId
      in: path
      description: Ownership verification ID
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ownership_verifications/OwnershipVerification.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Ownership verification not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
