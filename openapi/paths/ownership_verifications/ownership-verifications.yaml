post:
  summary: Create an ownership verification
  description: |
    Begin ownership verification for a `FIRST_PARTY` self-custody crypto
    wallet external account (customer or platform owned). Choose a `method`:

    - `WALLET_SIGNATURE` — the response includes a `messageToSign`; have the
      wallet sign it and submit the result to
      `POST /ownership-verifications/{verificationId}/confirm` to complete
      verification synchronously.
    - `LIVENESS` — the response includes a `verificationLink` (and a `token`
      for embedding); the user completes a hosted biometric flow and
      verification completes asynchronously. Status transitions are delivered
      via `OWNERSHIP_VERIFICATION.*` webhooks or by polling
      `GET /ownership-verifications/{verificationId}`.

    Ownership verification applies to accounts in
    `PENDING_OWNERSHIP_VERIFICATION` status; completing it moves the account
    to `ACTIVE`. For accounts where ownership verification is not applicable,
    this returns `409`.
  operationId: createOwnershipVerification
  tags:
    - Ownership Verifications
  security:
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ownership_verifications/OwnershipVerificationRequest.yaml
  responses:
    '201':
      description: >-
        Ownership verification created; the method-specific material is
        returned.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ownership_verifications/OwnershipVerification.yaml
    '400':
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: External account not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: Ownership verification is not applicable to this external account.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
get:
  summary: List ownership verifications
  description: >
    Retrieve a list of ownership verifications with optional filtering by
    external account ID and status.
  operationId: listOwnershipVerifications
  tags:
    - Ownership Verifications
  security:
    - BasicAuth: []
  parameters:
    - name: externalAccountId
      in: query
      description: Filter by external account ID
      required: false
      schema:
        type: string
    - name: status
      in: query
      description: Filter by verification status
      required: false
      schema:
        $ref: ../../components/schemas/ownership_verifications/OwnershipVerificationState.yaml
    - name: limit
      in: query
      description: Maximum number of results to return (default 20, max 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: cursor
      in: query
      description: Cursor for pagination (returned from previous request)
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ownership_verifications/OwnershipVerificationListResponse.yaml
    '400':
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
