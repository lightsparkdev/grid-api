post:
  summary: Confirm an ownership verification
  description: |
    Complete a `WALLET_SIGNATURE` ownership verification by submitting the
    signature the wallet produced for the `messageToSign` returned by
    `POST /ownership-verifications`. The message must be signed exactly as
    returned, and the signature must be submitted before the session's
    `expiresAt`; after expiry, start a new verification.

    This endpoint is only valid for `WALLET_SIGNATURE` verifications in
    `PENDING` status. For other verifications, this returns `409`. `LIVENESS`
    verifications complete asynchronously — their status is delivered via
    `OWNERSHIP_VERIFICATION.*` webhooks or by polling
    `GET /ownership-verifications/{verificationId}`.
  operationId: confirmOwnershipVerification
  tags:
    - Ownership Verifications
  security:
    - BasicAuth: []
  parameters:
    - name: verificationId
      in: path
      description: Ownership verification ID
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/ownership_verifications/OwnershipVerificationConfirmRequest.yaml
  responses:
    '200':
      description: >-
        Signature submitted; the updated ownership verification is returned.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/ownership_verifications/OwnershipVerification.yaml
    '400':
      description: Invalid or expired signature
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Ownership verification not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        The verification is not a `WALLET_SIGNATURE` verification in `PENDING`
        status.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
