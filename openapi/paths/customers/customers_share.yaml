post:
  summary: Add an individual customer from a reusable KYC share token
  description: >-
    Create an individual customer whose verification profile is built from a
    partner's shared data, including their identity document, so it does not
    need to be uploaded again. Fields sent in this request take priority over
    the shared data. Check the customer's verification status to address any
    KYC gaps and then submit the customer for verification using
    `POST /verifications`.
  operationId: createCustomerFromShareToken
  tags:
    - Customers
  security:
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/customers/CustomerShareCreateRequest.yaml
        examples:
          sharedIndividualCustomer:
            summary: Create an individual customer from a share token
            value:
              customerType: INDIVIDUAL
              platformCustomerId: ind-9f84e0c2
              region: US
              currencies:
                - USD
              email: jane.smith@example.com
              phoneNumber: '+14155551234'
              shareToken:
                provider: SUMSUB
                token: _act-sbx-jwt-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  responses:
    '201':
      description: Customer created successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/IndividualCustomer.yaml
    '400':
      description: >-
        Bad request. `INVALID_INPUT` when the provider rejects the share token
        or the platform does not run Grid's individual KYC.
        `ACCOUNTHOLDER_AGREEMENT_NOT_ACCEPTED` when the platform requires an
        accountholder agreement and `agreementConsents` does not include it.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '403':
      description: >-
        Forbidden. `END_USER_TERMS_NOT_ACCEPTED` when the platform requires the
        End User Terms and the request does not accept them.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error403.yaml
    '405':
      description: >-
        Method not allowed. Returned (as JSON, not HTML) when the request
        uses an HTTP method that is not supported on this path.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error405.yaml
    '409':
      description: >-
        Conflict. `UMA_ADDRESS_EXISTS` when the requested UMA address is
        already taken; `CONFLICT` when `platformCustomerId` collides with
        an existing active customer on the same platform.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
