get:
  summary: Get the current Grid End User Terms
  description: >-
    Deprecated; use `GET /customers/agreements`, which lists every agreement Grid
    supports rather than the End User Terms alone. This operation keeps its
    original single-document response, so existing integrations continue to work
    unchanged.
  operationId: getEndUserTerms
  deprecated: true
  tags:
    - Customers
  security:
    - BasicAuth: []
  responses:
    '200':
      description: Current End User Terms retrieved successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/EndUserTerms.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
