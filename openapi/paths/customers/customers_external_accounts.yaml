get:
  summary: List Customer external accounts
  description: |
    Retrieve a list of external accounts with optional filtering parameters. Returns all
    external accounts that match the specified filters. If no filters are provided, returns all external accounts
    (paginated).

    External accounts are bank accounts, cryptocurrency wallets, or other payment destinations that customers can use to receive funds from the platform.
  operationId: listCustomerExternalAccounts
  tags:
    - External Accounts
  security:
    - BasicAuth: []
  parameters:
    - name: currency
      in: query
      description: Filter by currency code
      required: false
      schema:
        type: string
    - name: customerId
      in: query
      description: Filter by external accounts associated with a specific customer
      required: false
      schema:
        type: string
    - name: limit
      in: query
      description: Maximum number of results to return (default 20, max 100)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: cursor
      in: query
      description: Cursor for pagination (returned from previous request)
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/external_accounts/ExternalAccountListResponse.yaml
    '400':
      description: Bad request - Invalid parameters
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml

post:
  summary: Add a new external account
  description: |
    Register a new external bank account or wallet for a customer.

    Set `accountInfo.accountType` to the currency code followed by `_ACCOUNT`
    (`EUR_ACCOUNT`, `USD_ACCOUNT`, `MXN_ACCOUNT`, ...) or to a wallet type
    (`SPARK_WALLET`, `LIGHTNING`, ...). Values such as `IBAN`, `SEPA`, or
    `CLABE` are rejected with `400 INVALID_INPUT`.

    Most bank account types require a `beneficiary` object. Its required fields
    depend on the currency and on `beneficiaryType`. For example, a EUR account
    needs `beneficiaryType`, `fullName`, and `countryOfResidence`, and an
    `address` (when given) needs `line1`, `postalCode`, and `country`.
    See [Required Fields by Corridor](/payouts-and-b2b/depositing-funds/required-fields)
    for every currency, and the [External Accounts](/payouts-and-b2b/depositing-funds/external-accounts)
    guide for a full request per region.
  operationId: createCustomerExternalAccount
  tags:
    - External Accounts
  security:
    - BasicAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/external_accounts/ExternalAccountCreateRequest.yaml
        examples:
          usBankAccount:
            summary: Create external US bank account
            value:
              customerId: Customer:019542f5-b3e7-1d02-0000-000000000001
              currency: USD
              platformAccountId: ext_acc_123456
              accountInfo:
                accountType: USD_ACCOUNT
                accountNumber: "12345678901"
                routingNumber: "123456789"
                bankAccountType: CHECKING
                bankName: Chase Bank
                beneficiary:
                  beneficiaryType: INDIVIDUAL
                  fullName: John Doe
                  birthDate: "1990-01-15"
                  nationality: US
                  address:
                    line1: 123 Main Street
                    city: San Francisco
                    state: CA
                    postalCode: "94105"
                    country: US
          eurBankAccount:
            summary: Create external EUR bank account (SEPA)
            value:
              customerId: Customer:019542f5-b3e7-1d02-0000-000000000001
              currency: EUR
              platformAccountId: ext_acc_eur_123456
              accountInfo:
                accountType: EUR_ACCOUNT
                iban: DE89370400440532013000
                bankName: Deutsche Bank
                beneficiary:
                  beneficiaryType: INDIVIDUAL
                  fullName: Hans Schmidt
                  countryOfResidence: DE
                  address:
                    line1: Hauptstraße 789
                    city: Berlin
                    postalCode: "10115"
                    country: DE
          sparkWallet:
            summary: Create external Spark wallet
            value:
              customerId: Customer:019542f5-b3e7-1d02-0000-000000000001
              currency: BTC
              accountInfo:
                accountType: SPARK_WALLET
                address: "spark1pgssyuuuhnrrdjswal5c3s3rafw9w3y5dd4cjy3duxlf7hjzkp0rqx6dj6mrhu"
  responses:
    '201':
      description: External account created successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/external_accounts/ExternalAccount.yaml
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '409':
      description: Conflict - External account already exists
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
