parameters:
  - name: customerId
    in: path
    description: System-generated unique customer identifier
    required: true
    schema:
      type: string
get:
  summary: Get customer by ID
  description: Retrieve a customer by their system-generated ID
  operationId: getCustomerById
  tags:
    - Customers
  security:
    - BasicAuth: []
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerOneOf.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Customer not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
patch:
  summary: Update customer by ID
  description: >
    Update a customer's metadata by their system-generated ID.


    Most customer updates complete synchronously and return `200` with the
    updated customer.


    Changing `email` for a customer whose Embedded Wallet signs in with an
    `EMAIL_OTP` credential, or `phoneNumber` for one that signs in with an
    `SMS_OTP` credential, changes how the customer signs in. The customer must
    first prove they control the new contact:


    1. Register the new contact with `POST /auth/credentials`, passing `email`
    or `phoneNumber`. Grid sends a one-time code to it and returns the
    replacement credential.


    2. Verify that code with `POST /auth/credentials/{id}/verify`. Grid answers
    `204`. A replacement that is not verified within 24 hours expires.


    3. Call `PATCH /customers/{customerId}` with only `customerType` and the
    new contact. Grid returns `202` with `payloadToSign`, `requestId`, and
    `expiresAt`. Send this soon after verifying: if the verification would
    lapse before the challenge does, Grid returns
    `AUTH_CREDENTIAL_VERIFICATION_EXPIRED` instead, and the customer must
    verify again.


    4. Use the session API keypair of an active session on the same Embedded
    Wallet to build an API-key stamp over `payloadToSign`. Retry the same
    request with that full stamp as the `Grid-Wallet-Signature` header and
    the `requestId` echoed back as the `Request-Id` header. The signed retry
    returns `200` with the updated customer, and the replacement becomes the
    wallet's sign-in credential in place of the old one. If the change is
    still being applied, the retry returns `200` with a
    `WalletOperationProcessing` body; re-send the identical signed request
    until it returns the customer.


    A change to a sign-in contact without a verified replacement returns
    `400` with `AUTH_CREDENTIAL_VERIFICATION_REQUIRED`. Customers without an
    Embedded Wallet credential of that type change `email` or `phoneNumber`
    with a plain update.


    Update `email` and `phoneNumber` in separate PATCH calls. A request that
    includes both fields is rejected.
  operationId: updateCustomerById
  tags:
    - Customers
  security:
    - BasicAuth: []
  parameters:
    - name: Grid-Wallet-Signature
      in: header
      required: false
      description: >-
        Full API-key stamp built over the prior `payloadToSign` with the
        session API keypair of an active session on the Embedded Wallet whose
        sign-in contact is changing. Required on the signed retry of a
        sign-in contact change; ignored on the initial call and on customer
        updates that complete synchronously.
      schema:
        type: string
      example: eyJwdWJsaWNLZXkiOiIwMmExYjIuLi4iLCJzY2hlbWUiOiJTSUdOQVRVUkVfU0NIRU1FX1RLX0FQSV9QMjU2Iiwic2lnbmF0dXJlIjoiMzA0NTAyMjEwMC4uLiJ9
    - name: Request-Id
      in: header
      required: false
      description: >-
        The `requestId` returned in a prior `202` response, echoed back on the
        signed retry so the server can correlate it with the issued challenge.
        Required on the signed retry of a sign-in contact change; must be
        paired with `Grid-Wallet-Signature`.
      schema:
        type: string
      example: Request:019542f5-b3e7-1d02-0000-000000000010
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/customers/CustomerUpdateRequestOneOf.yaml
        examples:
          individualUpdate:
            summary: Update individual customer example
            value:
              customerType: INDIVIDUAL
              fullName: John Smith
              birthDate: '1985-06-15'
              currencies:
                - USD
                - EUR
                - USDC
              address:
                line1: 456 Market St
                city: Seattle
                state: WA
                postalCode: '98101'
                country: US
          businessUpdate:
            summary: Update business customer example
            value:
              customerType: BUSINESS
              currencies:
                - USD
                - USDC
              businessInfo:
                legalName: New Tech Solutions LLC
                registrationNumber: BRN-987654321
                taxId: EIN-123456789
              address:
                line1: 100 Technology Parkway
                city: Bellevue
                state: WA
                postalCode: '98004'
                country: US
          signInEmailChange:
            summary: Change a sign-in email to its verified replacement (both steps)
            value:
              customerType: INDIVIDUAL
              email: john.smith@example.com
          signInPhoneChange:
            summary: Change a sign-in phone number to its verified replacement (both steps)
            value:
              customerType: INDIVIDUAL
              phoneNumber: '+14155559876'
          combinedContactUpdateRejected:
            summary: Combined email and phone update request (rejected)
            value:
              customerType: INDIVIDUAL
              email: john.smith@example.com
              phoneNumber: '+14155559876'
  responses:
    '200':
      description: >-
        Customer updated successfully. For a sign-in contact change, this is
        returned only on the signed retry: the updated customer once the
        change has landed, or a `WalletOperationProcessing` body with
        `status: "PROCESSING"` while it is still being applied. Re-send the
        identical signed request until it returns the customer.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerUpdateResponse.yaml
          examples:
            processing:
              summary: Sign-in contact change still being applied
              value:
                status: PROCESSING
                message: >-
                  This contact change is still being processed. Retry the same
                  request in a moment.
    '202':
      description: >-
        Challenge issued for a sign-in contact change to a verified
        replacement. The response contains `payloadToSign` plus a `requestId`.
        Build an API-key stamp over `payloadToSign` with the session API
        keypair of an active session on the same Embedded Wallet, then retry
        the same request with `Grid-Wallet-Signature` and `Request-Id` before
        `expiresAt`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/SignedRequestChallenge.yaml
          examples:
            signInEmailChange:
              summary: Sign-in email change challenge
              value:
                payloadToSign: '{"organizationId":"org_2m9F...","parameters":{"userEmail":"john.smith@example.com","userId":"user_2m9F...","verificationToken":"eyJhbGciOiJFUzI1NiIs..."},"timestampMs":"1775681700000","type":"ACTIVITY_TYPE_UPDATE_USER_EMAIL"}'
                requestId: Request:019542f5-b3e7-1d02-0000-000000000010
                expiresAt: '2026-04-08T15:35:00Z'
            signInPhoneChange:
              summary: Sign-in phone number change challenge
              value:
                payloadToSign: '{"organizationId":"org_2m9F...","parameters":{"userId":"user_2m9F...","userPhoneNumber":"+14155559876","verificationToken":"eyJhbGciOiJFUzI1NiIs..."},"timestampMs":"1775681700000","type":"ACTIVITY_TYPE_UPDATE_USER_PHONE_NUMBER"}'
                requestId: Request:019542f5-b3e7-1d02-0000-000000000011
                expiresAt: '2026-04-08T15:35:00Z'
    '400':
      description: >-
        Bad request. A sign-in contact change returns
        `AUTH_CREDENTIAL_VERIFICATION_REQUIRED` when the new contact has no
        verified replacement, `AUTH_CREDENTIAL_VERIFICATION_EXPIRED` when its
        verification would lapse before the signed retry, and `INVALID_INPUT`
        when the request also changes other customer fields.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: >-
        Unauthorized. Also returned on the signed retry of a sign-in contact
        change when the provided `Grid-Wallet-Signature` is missing or
        malformed, or when the `Request-Id` does not match an unexpired
        challenge issued for this change.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Customer not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        Conflict. Returned with `UMA_ADDRESS_EXISTS` when the requested UMA
        address is taken, or with `OPERATION_IN_PROGRESS` on the signed retry
        of a sign-in contact change while another operation on that sign-in
        contact is still in progress. Retry once it finishes.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '429':
      description: Too many requests. Returned with `RATE_LIMITED`.
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying the request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error429.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
delete:
  summary: Delete customer by ID
  description: Delete a customer by their system-generated ID
  operationId: deleteCustomerById
  tags:
    - Customers
  security:
    - BasicAuth: []
  responses:
    '200':
      description: Customer deleted successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerOneOf.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Customer not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '410':
      description: Customer deleted already
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error410.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
