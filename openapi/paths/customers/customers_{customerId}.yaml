parameters:
  - name: customerId
    in: path
    description: System-generated unique customer identifier
    required: true
    schema:
      type: string
get:
  summary: Get customer by ID
  description: Retrieve a customer by their system-generated ID
  operationId: getCustomerById
  tags:
    - Customers
  security:
    - BasicAuth: []
  responses:
    '200':
      description: Successful operation
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerOneOf.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Customer not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
patch:
  summary: Update customer by ID
  description: >
    Update a customer's metadata by their system-generated ID.


    Most customer updates complete synchronously and return `200` with the
    updated customer. A customer without tied Embedded Wallet OTP
    credentials updates `email` and `phoneNumber` the same way, in a single
    call.


    If the request changes `email` for a customer that has tied Embedded
    Wallet `EMAIL_OTP` credentials, or changes `phoneNumber` for a customer
    that has tied `SMS_OTP` credentials, the new contact changes how the
    customer signs in. Grid applies it only after the customer has proven
    they control the new contact, and only with a signature from the
    customer's wallet session.


    Update `email` and `phoneNumber` in separate PATCH calls. A request that
    includes both fields is rejected.


    For an Embedded Wallet email or phone number change:


    1. Register the new contact with `POST /auth/credentials`, sending
    `email` on an `EMAIL_OTP` request or `phoneNumber` on an `SMS_OTP`
    request. Grid returns a `PENDING` credential and sends a one-time
    password to the new contact.


    2. Verify it with `POST /auth/credentials/{id}/verify`. The credential
    becomes `VERIFIED`. The verification expires 15 minutes later.


    3. Call `PATCH /customers/{customerId}` with the update body and no
    signature headers. Grid uses the newest `VERIFIED` credential whose
    contact equals the new value and returns `202` with `payloadToSign`,
    `requestId`, and `expiresAt`. If there is no such credential, the call
    fails with `400` `AUTH_CREDENTIAL_VERIFICATION_REQUIRED`. If its
    verification has expired, it fails with `400`
    `AUTH_CREDENTIAL_VERIFICATION_EXPIRED`.


    4. Use the session API keypair of an `ACTIVE` authentication credential
    on the customer's Embedded Wallet to build an API-key stamp over
    `payloadToSign`, then retry the same request with that full stamp
    as the `Grid-Wallet-Signature` header and the `requestId` echoed back as
    the `Request-Id` header. The retry body must carry the same update
    fields submitted in step 3. The signed retry returns `200` with the
    updated customer. It can instead return `200` with
    `status: "PROCESSING"` while the change is still settling at the wallet
    provider. When the change finishes, Grid sends a
    `WALLET_OPERATION.COMPLETED` or `WALLET_OPERATION.FAILED` webhook with
    `operationType: customer.contact_update` and the same `requestId`. You
    can also re-send the byte-identical signed request until it returns the
    customer.


    When the change completes, the `VERIFIED` credential becomes `ACTIVE`
    and replaces the customer's previous `ACTIVE` credential of that type.
    All of the customer's Embedded Wallet internal accounts share one
    wallet, so the change applies to every one of them. The customer
    contact field changes in the same step. Sessions issued from the
    replaced credential keep working until they expire. The customer's
    records with the card issuer and banking partner are updated
    asynchronously after the change.
  operationId: updateCustomerById
  tags:
    - Customers
  security:
    - BasicAuth: []
  parameters:
    - name: Grid-Wallet-Signature
      in: header
      required: false
      description: >-
        Full API-key stamp built over the prior `payloadToSign` with the
        session API keypair of an `ACTIVE` authentication credential on the
        customer's Embedded Wallet. Required on the signed retry
        for Embedded Wallet email or phone number changes; ignored on the
        initial call and on customer updates that complete synchronously.
      schema:
        type: string
      example: eyJwdWJsaWNLZXkiOiIwMmExYjIuLi4iLCJzY2hlbWUiOiJTSUdOQVRVUkVfU0NIRU1FX1RLX0FQSV9QMjU2Iiwic2lnbmF0dXJlIjoiMzA0NTAyMjEwMC4uLiJ9
    - name: Request-Id
      in: header
      required: false
      description: >-
        The `requestId` returned in a prior `202` response, echoed back on the
        signed retry so the server can correlate it with the issued challenge.
        Required on the signed retry for Embedded Wallet email or phone number
        changes; must be paired with `Grid-Wallet-Signature`.
      schema:
        type: string
      example: Request:019542f5-b3e7-1d02-0000-000000000010
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/customers/CustomerUpdateRequestOneOf.yaml
        examples:
          individualUpdate:
            summary: Update individual customer example
            value:
              customerType: INDIVIDUAL
              fullName: John Smith
              birthDate: '1985-06-15'
              currencies:
                - USD
                - EUR
                - USDC
              address:
                line1: 456 Market St
                city: Seattle
                state: WA
                postalCode: '98101'
                country: US
          businessUpdate:
            summary: Update business customer example
            value:
              customerType: BUSINESS
              currencies:
                - USD
                - USDC
              businessInfo:
                legalName: New Tech Solutions LLC
                registrationNumber: BRN-987654321
                taxId: EIN-123456789
              address:
                line1: 100 Technology Parkway
                city: Bellevue
                state: WA
                postalCode: '98004'
                country: US
          embeddedWalletEmailUpdate:
            summary: Embedded Wallet email change after the new address is verified (both steps)
            value:
              customerType: INDIVIDUAL
              email: john.smith@example.com
          embeddedWalletPhoneUpdate:
            summary: Embedded Wallet phone number change after the new number is verified (both steps)
            value:
              customerType: INDIVIDUAL
              phoneNumber: '+14155559876'
          combinedContactUpdateRejected:
            summary: Combined email and phone update request (rejected)
            value:
              customerType: INDIVIDUAL
              email: john.smith@example.com
              phoneNumber: '+14155559876'
  responses:
    '200':
      description: >-
        Customer updated successfully. For Embedded Wallet email or phone
        number changes, this is returned only on the signed retry. The body is
        the updated customer once the change has been applied. While the
        change is still in flight at the wallet provider, the body is instead
        a `WalletOperationProcessing` with `status: "PROCESSING"`. The
        backend completes the change on its own and then sends a
        `WALLET_OPERATION.COMPLETED` or `WALLET_OPERATION.FAILED` webhook
        with `operationType: customer.contact_update`. You can also re-send
        the byte-identical signed request until it returns the customer.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerUpdateResponse.yaml
    '202':
      description: >-
        Challenge issued for an Embedded Wallet email or phone number change.
        Returned only when a `VERIFIED` credential exists for the new contact.
        The response contains `payloadToSign` plus a `requestId`. Build an
        API-key stamp over `payloadToSign` with the session API keypair from an
        `ACTIVE` authentication credential on the customer's Embedded Wallet,
        then retry the same request with
        `Grid-Wallet-Signature` and `Request-Id`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/SignedRequestChallenge.yaml
          examples:
            embeddedWalletEmailUpdate:
              summary: Embedded Wallet customer email change challenge
              value:
                payloadToSign: '{"organizationId":"org_2m9F...","parameters":{"userEmail":"john.smith@example.com","userId":"user_2m9F...","verificationToken":"eyJhbGciOiJFUzI1NiIsImtpZCI6..."},"timestampMs":"1775681700000","type":"ACTIVITY_TYPE_UPDATE_USER_EMAIL"}'
                requestId: Request:019542f5-b3e7-1d02-0000-000000000010
                expiresAt: '2026-04-08T15:35:00Z'
            embeddedWalletPhoneUpdate:
              summary: Embedded Wallet customer phone number change challenge
              value:
                payloadToSign: '{"organizationId":"org_2m9F...","parameters":{"userId":"user_2m9F...","userPhoneNumber":"+14155559876","verificationToken":"eyJhbGciOiJFUzI1NiIsImtpZCI6..."},"timestampMs":"1775681700000","type":"ACTIVITY_TYPE_UPDATE_USER_PHONE_NUMBER"}'
                requestId: Request:019542f5-b3e7-1d02-0000-000000000011
                expiresAt: '2026-04-08T15:35:00Z'
    '400':
      description: >-
        Bad request. For an Embedded Wallet email or phone number change,
        returned with `AUTH_CREDENTIAL_VERIFICATION_REQUIRED` when no
        `VERIFIED` credential exists for the new contact, or
        `AUTH_CREDENTIAL_VERIFICATION_EXPIRED` when the newest one has
        expired.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: >-
        Unauthorized. Also returned for Embedded Wallet email or phone number
        change retries when the provided `Grid-Wallet-Signature` is missing,
        malformed, or does not match the pending customer update challenge,
        when the `Request-Id` does not match an unexpired pending challenge, or
        when the retry body does not match the update fields bound into
        `payloadToSign` on the initial call.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Customer not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        Conflict. Returned with `EMAIL_OTP_CREDENTIAL_SET_CHANGED` or
        `SMS_OTP_CREDENTIAL_SET_CHANGED` when the tied Embedded Wallet OTP
        credential set changed between the initial `202` challenge and the
        signed retry, or with `CONTACT_UPDATE_IN_PROGRESS` when another update
        to this email or phone number has not finished yet; retry it later.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '424':
      description: >-
        Failed dependency. Returned when Grid cannot update the customer's
        Embedded Wallet OTP credential. The customer contact field is not
        changed.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error424.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
delete:
  summary: Delete customer by ID
  description: Delete a customer by their system-generated ID
  operationId: deleteCustomerById
  tags:
    - Customers
  security:
    - BasicAuth: []
  responses:
    '200':
      description: Customer deleted successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/customers/CustomerOneOf.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Customer not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '410':
      description: Customer deleted already
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error410.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
