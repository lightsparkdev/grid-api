post:
  summary: Add an administrator credential
  description: >
    Add a credential for an additional administrator of a `BUSINESS`
    customer's Embedded Wallet. The new administrator gets their own `EMAIL_OTP` or
    `PASSKEY` credential, tagged with `adminReference`, and signs for the
    wallet with it as the owner does. The wallet stays non-custodial: Grid
    never adds an administrator on its own, and every step is authorised by a
    signature from an existing verified credential on the account (the
    owner's, or another administrator's).


    This is the only way an administrator adds a credential. An
    administrator's session cannot sign `POST /auth/credentials`, which Grid
    refuses with `403 FORBIDDEN`, so every credential belonging to an
    administrator carries their `adminReference` and removing them revokes
    it. An administrator added with another administrator's signature has
    their own `adminReference` and is removed separately.


    It takes two signed steps. The first call returns `202` with a
    `payloadToSign` that creates the administrator's wallet user; the signed
    retry returns another `202` whose payload grants that user the authority
    to sign for the wallet; the second signed retry returns `201` with the
    new `AuthMethod`. The administrator then signs in with
    `POST /auth/credentials/{id}/challenge` and
    `POST /auth/credentials/{id}/verify`.
  operationId: createAdminCredential
  tags:
    - Embedded Wallet Auth
  security:
    - BasicAuth: []
  parameters:
    - name: Grid-Wallet-Signature
      in: header
      required: false
      description: >-
        Full API-key stamp built over the prior `payloadToSign` with the
        session API keypair of an existing verified credential on the same
        internal account. Required on each signed retry.
      schema:
        type: string
      example: eyJwdWJsaWNLZXkiOiIwMmExYjIuLi4iLCJzY2hlbWUiOiJTSUdOQVRVUkVfU0NIRU1FX1RLX0FQSV9QMjU2Iiwic2lnbmF0dXJlIjoiMzA0NTAyMjEwMC4uLiJ9
    - name: Request-Id
      in: header
      required: false
      description: >-
        The `requestId` of the `202` being answered, echoed back exactly on the
        signed retry. Must be paired with `Grid-Wallet-Signature`.
      schema:
        type: string
      example: Request:7c4a8d09-ca37-4e3e-9e0d-8c2b3e9a1f21
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/AdminCredentialCreateRequestOneOf.yaml
  responses:
    '201':
      description: The administrator's credential was added.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/AuthMethodResponse.yaml
    '202':
      description: >-
        A signature is needed: stamp `payloadToSign` with the session key of
        an existing verified credential on the account and retry with
        `Grid-Wallet-Signature` and `Request-Id`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/AuthSignedRequestChallenge.yaml
    '400':
      description: Bad request, including a customer that is not a business, an email already on the account, or a passkey key algorithm other than ES256 (-7) or RS256 (-257)
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized, including a signature that does not verify
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Internal account not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
