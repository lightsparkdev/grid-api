post:
  summary: Create a delegated signing key
  description: >
    Keys for an Embedded Wallet internal account, and access keys for a
    `TEMPO_WALLET` external account your platform runs, are created through
    this endpoint. Grid creates `DYNAMIC` provider wallet keys itself, when the
    cardholder has delegated the wallet at the provider and a card is funded by
    that wallet.


    Delegate Spark token-transaction signing authority for a card funding
    source or agent backed by an Embedded Wallet internal account to a
    Grid-custodied P-256 API key. Grid uses the requested owner and internal
    account to identify the wallet, generates the keypair
    server-side, creates an isolated signer identity holding the public key,
    then policies granting that identity signing and self-revocation authority.
    The private key is custodied by Grid and never returned. Both activities
    must be authorized by the wallet owner, so creation is a three-leg
    signed-retry flow:


    1. Call `POST /auth/delegated-keys` with no signature headers. Grid
    generates the delegated keypair and the response is `202` with a
    `payloadToSign`, `requestId`, and `expiresAt`.


    2. Use the session API keypair of a verified credential on the requested
    Embedded Wallet internal account to build an API-key stamp over
    `payloadToSign`, then retry the same request with that full stamp as the
    `Grid-Wallet-Signature` header and the `requestId` echoed back as the
    `Request-Id` header. The response is a second `202` with a new
    `payloadToSign`, `requestId`, and `expiresAt`.


    3. Stamp the new `payloadToSign` with the same session keypair and retry
    once more with the new `Request-Id`. The signed retry returns `201`
    with the created `DelegatedKey` in `ACTIVE` status. For card keys, a
    provisioned `PENDING_AUTH` card using this funding source becomes `ACTIVE`
    automatically. Cards still provisioning remain `PROCESSING`; frozen and
    closed cards retain their status.


    The same request body must be sent on all three legs. A flow abandoned
    after the second leg leaves the key in `PENDING` status: the signer
    identity exists but holds no policies, so it cannot sign or revoke itself.
    Abandoned `PENDING` card keys do not block creating another delegated key.
    For an agent, a `PENDING` key blocks a new one until it is revoked with
    `DELETE /auth/delegated-keys/{id}`; revoking a `PENDING` key only discards
    Grid's key material.
    After activation, Grid uses the custodied key to authorize signing for the
    card's Embedded Wallet funding account or for policy-approved agent actions
    in place of a session keypair; the platform never handles the key material.


    Each card funding source may have at most one `ACTIVE` delegated key, and
    each agent and Embedded Wallet pair at most one unrevoked (`PENDING` or
    `ACTIVE`) delegated key; revoke the existing key before creating a new one. A delegated key authorizes raw-payload signing for the
    wallet and cannot be scoped to amounts or recipients by the public API.
    Revoke it with `DELETE /auth/delegated-keys/{id}` when no longer needed.


    **Access keys for a wallet your platform runs.** For a card funded by a
    `TEMPO_WALLET` external account whose `providerWallet` is `PLATFORM`, send
    `cardId`, `externalAccountId`, `nickname` and `restrictions` instead of
    `internalAccountId`. Grid generates a Tempo access key and keeps its private
    key. The wallet's root account authorizes it, and the network then holds
    the key to `restrictions`:


    1. Call with no `Request-Id`. The response is `202` with the key's `keyId`,
    the `requestedRestrictions`, the `keyAuthorization` fields the root signs,
    and `payloadToSign`, the hash of that authorization.


    2. Sign `payloadToSign` with the wallet's root account, with no message
    prefix. Retry the same request with the signature in
    `keyAuthorizationSignature` and the `requestId` in `Request-Id`. Grid
    checks that the signature comes from the external account's address, then
    returns `201` with the key `ACTIVE`. The key reaches the network with the
    card's first transfer, which carries the authorization.


    If the root authorizes `keyId` on chain itself instead, retry without
    `keyAuthorizationSignature`. Grid reads the key on chain and accepts it
    when its limits and expiry match `requestedRestrictions`.


    The network enforces each spending limit, including over each period,
    and the key's expiry. The wallet's root can revoke the key on chain at any
    time. Grid then marks it `REVOKED`, and the card becomes `PENDING_AUTH`
    with `statusReason: "DELEGATION_REQUIRED"`. Each card funding source may
    have at most one `ACTIVE` access key.
  operationId: createDelegatedKey
  tags:
    - Embedded Wallet Auth
  security:
    - BasicAuth: []
  parameters:
    - name: Grid-Wallet-Signature
      in: header
      required: false
      description: >-
        Full API-key stamp built over the prior `payloadToSign` with the
        session API keypair of a verified credential on the same internal
        account. Required on the signed retries; ignored on the initial
        call.
      schema:
        type: string
      example: eyJwdWJsaWNLZXkiOiIwMmExYjIuLi4iLCJzY2hlbWUiOiJTSUdOQVRVUkVfU0NIRU1FX1RLX0FQSV9QMjU2Iiwic2lnbmF0dXJlIjoiMzA0NTAyMjEwMC4uLiJ9
    - name: Request-Id
      in: header
      required: false
      description: >-
        The `requestId` returned in the prior `202` response, echoed back
        exactly on the signed retry so the server can correlate it with the
        issued challenge. Required on the signed retries; must be paired
        with `Grid-Wallet-Signature`, or for an access key with
        `keyAuthorizationSignature` or the root's own on-chain authorization.
      schema:
        type: string
      example: Request:7c4a8d09-ca37-4e3e-9e0d-8c2b3e9a1f21
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/DelegatedKeyCreateRequest.yaml
        examples:
          create:
            summary: Delegate signing to a Grid-custodied key
            value:
              cardId: Card:019542f5-b3e7-1d02-0000-000000000010
              internalAccountId: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
              nickname: Card payments key
          accessKey:
            summary: Create an access key on a wallet your platform runs (both legs)
            value:
              cardId: Card:019542f5-b3e7-1d02-0000-000000000010
              externalAccountId: ExternalAccount:019542f5-b3e7-1d02-0000-000000000031
              nickname: Card payments key
              restrictions:
                spendingLimits:
                  - currency: OUSD
                    amount: 50000000
                    periodSeconds: 2592000
                expiresAt: '2027-11-19T00:00:00Z'
  responses:
    '201':
      description: >-
        Delegated key created and policy granted. The key is `ACTIVE` and
        Grid may use it to stamp card-payment quote executions or
        policy-approved actions for the selected agent.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/DelegatedKey.yaml
          examples:
            delegatedKey:
              summary: Active delegated key
              value:
                id: DelegatedKey:019542f5-b3e7-1d02-0000-000000000021
                cardId: Card:019542f5-b3e7-1d02-0000-000000000010
                fundingSourceId: CardFundingSource:019542f5-b3e7-1d02-0000-000000000011
                accountId: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
                publicKey: 02a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
                nickname: Card payments key
                status: ACTIVE
                createdAt: '2026-04-08T15:30:01Z'
                updatedAt: '2026-04-08T15:30:42Z'
            accessKey:
              summary: Active access key on a wallet your platform runs
              value:
                id: DelegatedKey:019542f5-b3e7-1d02-0000-000000000022
                cardId: Card:019542f5-b3e7-1d02-0000-000000000010
                fundingSourceId: CardFundingSource:019542f5-b3e7-1d02-0000-000000000012
                accountId: ExternalAccount:019542f5-b3e7-1d02-0000-000000000031
                keyId: '0xfbE89dD5f773c84ea858EF1d4622d2D58E69e9c9'
                restrictions:
                  spendingLimits:
                    - currency: OUSD
                      amount: 50000000
                      periodSeconds: 2592000
                  expiresAt: '2027-11-19T00:00:00Z'
                nickname: Card payments key
                status: ACTIVE
                createdAt: '2026-11-19T15:30:01Z'
                updatedAt: '2026-11-19T15:31:12Z'
    '202':
      description: >-
        Challenge issued for the next leg. For a key on an Embedded Wallet
        internal account, stamp `payloadToSign` and retry the same request with
        `Grid-Wallet-Signature` and `Request-Id`. For an access key, have the
        wallet's root account sign `payloadToSign` and retry with
        `keyAuthorizationSignature` and `Request-Id`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/DelegatedKeyCreateChallenge.yaml
    '400':
      description: >-
        Bad request. Returned when both `cardId` and `agentId` are provided, or
        when neither owner id is provided. Returned with `INVALID_INPUT` when
        both or neither of `internalAccountId` and `externalAccountId` are
        provided, when `externalAccountId` is sent with `agentId` or without
        `restrictions`, when the external account is not a `TEMPO_WALLET` whose
        `providerWallet` is `PLATFORM`, or when `restrictions` names a currency
        twice or one the network does not carry.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: >-
        Unauthorized. Returned when the provided `Grid-Wallet-Signature` is
        missing on a retry, malformed, or does not match the pending
        challenge, or when the `Request-Id` does not match an unexpired
        pending challenge. For an access key, also returned when
        `keyAuthorizationSignature` is malformed or does not come from the
        external account's address, or when the root's on-chain authorization
        of `keyId` is missing or does not match `requestedRestrictions`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Card, agent, card funding source, Embedded Wallet account, or external account not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: >-
        An `ACTIVE` delegated key or access key already exists for this card
        funding source, or an `ACTIVE` or `PENDING` key already exists for this agent and
        Embedded Wallet pair. Revoke it with `DELETE /auth/delegated-keys/{id}`
        before creating a new one.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
get:
  summary: List delegated signing keys
  description: >-
    List delegated signing keys for an Embedded Wallet internal account, a
    crypto external account that carries `providerWallet`, a card funding
    source, or a combination of these, including `PENDING` keys (user created
    but policy leg never completed) and `REVOKED` keys. At least one of
    `accountId` or `fundingSourceId` must be supplied.
  operationId: listDelegatedKeys
  tags:
    - Embedded Wallet Auth
  security:
    - BasicAuth: []
  parameters:
    - name: accountId
      in: query
      required: false
      description: The id of the internal or external account whose delegated keys to list.
      schema:
        type: string
      example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
    - name: fundingSourceId
      in: query
      required: false
      description: The id of the card funding source whose delegated keys to list.
      schema:
        type: string
      example: CardFundingSource:019542f5-b3e7-1d02-0000-000000000011
  responses:
    '200':
      description: >-
        Delegated keys matching the supplied filters. Returns an empty
        `data` array when no matching delegated keys are visible to the
        caller.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/DelegatedKeyListResponse.yaml
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
