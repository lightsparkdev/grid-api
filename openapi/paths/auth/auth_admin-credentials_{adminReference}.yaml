parameters:
  - name: adminReference
    in: path
    description: The administrator reference the credentials were added with.
    required: true
    schema:
      type: string
delete:
  summary: Revoke an administrator's credentials
  description: >
    Revoke every credential carrying `adminReference` on the account,
    removing the administrator's wallet users. Authorised like the add: the
    first call returns `202` with a `payloadToSign` for an existing verified
    credential to stamp, and the signed retry returns `204`. Refused with
    `400` `INVALID_INPUT` when it would leave the account with no active
    credential.
  operationId: revokeAdminCredentials
  tags:
    - Embedded Wallet Auth
  security:
    - BasicAuth: []
  parameters:
    - name: accountId
      in: query
      required: true
      description: The internal account whose administrator is revoked.
      schema:
        type: string
    - name: Grid-Wallet-Signature
      in: header
      required: false
      description: >-
        Full API-key stamp built over the prior `payloadToSign` with the
        session API keypair of an existing verified credential on the same
        internal account. Required on each signed retry.
      schema:
        type: string
      example: eyJwdWJsaWNLZXkiOiIwMmExYjIuLi4iLCJzY2hlbWUiOiJTSUdOQVRVUkVfU0NIRU1FX1RLX0FQSV9QMjU2Iiwic2lnbmF0dXJlIjoiMzA0NTAyMjEwMC4uLiJ9
    - name: Request-Id
      in: header
      required: false
      description: >-
        The `requestId` of the `202` being answered, echoed back exactly on the
        signed retry. Must be paired with `Grid-Wallet-Signature`.
      schema:
        type: string
      example: Request:7c4a8d09-ca37-4e3e-9e0d-8c2b3e9a1f21
  responses:
    '204':
      description: The administrator's credentials were revoked.
    '202':
      description: >-
        A signature is needed: stamp `payloadToSign` with the session key of
        an existing verified credential on the account and retry with
        `Grid-Wallet-Signature` and `Request-Id`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/AuthSignedRequestChallenge.yaml
    '401':
      description: Unauthorized, including a signature that does not verify
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Internal account or administrator not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '400':
      description: Revoking would leave the account with no active credential
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
