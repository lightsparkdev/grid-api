delete:
  summary: Revoke an authentication credential
  description: >
    Revoke an authentication credential on an Embedded Wallet internal
    account.


    Revocation is a two-step flow because it must be authorized by a
    session on a *different* credential on the same internal account:


    1. Call `DELETE /auth/credentials/{id}` with no headers. The response
    is `202` with a `payloadToSign`, `requestId`, and `expiresAt`.


    2. Use the session API keypair of an existing verified credential
    on the same internal account — other than the one being revoked —
    to build an API-key stamp over `payloadToSign`, then retry the
    same `DELETE` request with that full stamp as the
    `Grid-Wallet-Signature` header and the `requestId` echoed back as
    the `Request-Id` header. The signed retry returns `204`.


    The account must retain at least one authentication credential; an
    account with only a single credential cannot use this endpoint to
    revoke it.


    An administrator's credential (one with `adminReference`) is revoked with
    `DELETE /auth/admin-credentials/{adminReference}` instead, and is refused
    here with `INVALID_INPUT`.
  operationId: revokeAuthCredential
  tags:
    - Embedded Wallet Auth
  security:
    - BasicAuth: []
  parameters:
    - name: id
      in: path
      description: >-
        The id of the authentication credential to revoke (the `id`
        field of the `AuthMethod` returned from
        `POST /auth/credentials`).
      required: true
      schema:
        type: string
    - name: Grid-Wallet-Signature
      in: header
      required: false
      description: >-
        Full API-key stamp built over the prior `payloadToSign` with
        the session API keypair of an existing verified authentication
        credential on the same internal account (other than the one
        being revoked). Required on the signed retry; ignored on the
        initial call.
      schema:
        type: string
      example: eyJwdWJsaWNLZXkiOiIwMmExYjIuLi4iLCJzY2hlbWUiOiJTSUdOQVRVUkVfU0NIRU1FX1RLX0FQSV9QMjU2Iiwic2lnbmF0dXJlIjoiMzA0NTAyMjEwMC4uLiJ9
    - name: Request-Id
      in: header
      required: false
      description: >-
        The `requestId` returned in a prior `202` response, echoed back
        exactly on the signed retry so the server can correlate it with the
        issued challenge. Required on the signed retry; must be paired
        with `Grid-Wallet-Signature`.
      schema:
        type: string
      example: Request:7c4a8d09-ca37-4e3e-9e0d-8c2b3e9a1f21
  responses:
    '200':
      description: >-
        The revocation's underlying wallet-provider activity is still
        in flight — a `WalletOperationProcessing` body with `status:
        "PROCESSING"`. The client re-sends the same signed `DELETE`
        until it settles; the backend also reconciles the revocation to
        terminal on its own.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/common/WalletOperationProcessing.yaml
    '202':
      description: >-
        Challenge issued. The response contains `payloadToSign` plus a
        `requestId`. Build an API-key stamp over `payloadToSign` with
        the session API keypair of an existing verified credential on
        the same internal account (other than the one being revoked),
        then echo `requestId` on the retry.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/AuthSignedRequestChallenge.yaml
    '204':
      description: Authentication credential revoked successfully.
    '400':
      description: >-
        Bad request. Also returned when the target internal account has
        only a single authentication credential, which cannot be
        revoked via this endpoint.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: >-
        Unauthorized. Returned when the provided `Grid-Wallet-Signature`
        is missing, malformed, or does not match a pending revocation
        challenge for this credential, or when the `Request-Id` does
        not match an unexpired pending challenge.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: Authentication credential not found
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '409':
      description: Conflict. Returned with `OPERATION_IN_PROGRESS`.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error409.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
patch:
  summary: Rename an authentication credential
  description: >
    Set a credential's `nickname`, the label shown on `AuthMethod` responses
    and in credential listings. This works the same for the account owner's
    credentials and for an administrator's (one with `adminReference`).


    This endpoint is authenticated by the platform credential alone and
    returns `200` directly. It does not use the 202 → signed-retry pattern.
    That pattern proves the account holder approved a change to who can sign
    for the wallet. A nickname changes no one's authority: it is a label Grid
    keeps for display.


    Renaming changes only the label. The credential signs in as before, one-time
    codes go to the same email or phone, and the same wallet signs. The name
    a device or password manager shows for a passkey is not changed.
  operationId: updateAuthCredential
  tags:
    - Embedded Wallet Auth
  security:
    - BasicAuth: []
  parameters:
    - name: id
      in: path
      description: >-
        The id of the authentication credential to rename (the `id` field of
        an `AuthMethod`).
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/auth/AuthCredentialUpdateRequest.yaml
        examples:
          rename:
            summary: Rename a credential
            value:
              nickname: Work phone
  responses:
    '200':
      description: The renamed credential.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/auth/AuthMethod.yaml
          examples:
            renamed:
              summary: SMS OTP credential renamed
              value:
                id: AuthMethod:019542f5-b3e7-1d02-0000-000000000001
                accountId: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
                type: SMS_OTP
                nickname: Work phone
                createdAt: '2026-04-08T15:30:01Z'
                updatedAt: '2026-04-10T09:12:44Z'
    '400':
      description: >-
        Bad request. Returned with `INVALID_INPUT` when `nickname` is missing,
        empty after trimming, longer than 100 characters, or contains `<`,
        `>`, or a control character.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error401.yaml
    '404':
      description: >-
        Authentication credential not found, including a credential that has
        been revoked.
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error404.yaml
    '500':
      description: Internal service error
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/errors/Error500.yaml
