type: object
required:
  - customerId
  - amount
properties:
  customerId:
    type: string
    description: The customer whose payments the rule splits.
    example: Customer:019542f5-b3e7-1d02-0000-000000000001
  amount:
    type: integer
    format: int64
    minimum: 1
    maximum: 9000000000000000
    description: A payment to split, in the smallest unit of the rule's currency.
    example: 1000000
  settlementRuleId:
    type: string
    description: A rule of the customer to preview. Set this or `draft`.
    example: SettlementRule:019542f5-b3e7-1d02-0000-000000000001
  draft:
    $ref: ./SettlementRuleDraft.yaml
