type: object
required:
  - transactionId
  - amount
  - currency
  - completedAt
properties:
  transactionId:
    type: string
    description: The incoming transaction.
    example: Transaction:019542f5-b3e7-1d02-0000-000000000004
  amount:
    type: integer
    format: int64
    description: The payment, in the smallest unit of `currency`.
    example: 1000000
  currency:
    type: string
    example: USD
  counterpartyName:
    type: string
    description: The sender name Grid recorded, which `counterpartyName` patterns compare against. Absent when Grid recorded none.
    example: GLOSSIER INC
  completedAt:
    type: string
    format: date-time
    example: '2026-11-06T18:00:00Z'
