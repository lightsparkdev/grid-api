type: string
enum:
  - RULE_PAUSED
  - INCOMING_PAYMENT_RETURNED
  - AMOUNT_BELOW_RULE
  - LIMIT_EXCEEDED
  - CANCELLED
  - CREATOR_REVOKED
  - AGENT_PAUSED
description: |
  Why an execution paid nothing.

  | Reason | Description |
  |--------|-------------|
  | `RULE_PAUSED` | The rule was paused before the execution fired. |
  | `INCOMING_PAYMENT_RETURNED` | The payment was returned before the execution fired. |
  | `AMOUNT_BELOW_RULE` | The payment was smaller than the fixed and percentage shares together. |
  | `LIMIT_EXCEEDED` | Paying it would have gone over one of the rule's `limits`. |
  | `CANCELLED` | The execution was cancelled, or the rule deleted, while it was held. |
  | `CREATOR_REVOKED` | The API token or agent that created the rule can no longer send payments. The rule is paused. |
  | `AGENT_PAUSED` | The agent that created the rule is paused. The rule stays active, and pays the next payment once the agent is resumed. |
