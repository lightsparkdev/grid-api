type: object
required:
  - customerId
  - name
  - currency
  - match
  - splits
properties:
  customerId:
    type: string
    description: The customer whose incoming payments the rule splits.
    example: Customer:019542f5-b3e7-1d02-0000-000000000001
  name:
    type: string
    minLength: 1
    maxLength: 255
    description: What the platform calls the rule. It is the description of each payment the rule sends.
    example: Glossier deal
  currency:
    type: string
    description: ISO 4217 code of the payments the rule splits. A payment in another currency never matches.
    example: USD
  priority:
    type: integer
    format: int32
    minimum: 0
    maximum: 2147483647
    description: Rules are tried in ascending priority. Unique among the customer's rules that are not `DELETED`. Omit it to try the rule after the customer's others, at one more than their highest priority, or 1 when the customer has none.
    example: 1
  match:
    type: array
    minItems: 1
    maxItems: 20
    description: A payment matches when any selector matches it. `[{}]` matches every payment in the rule's currency.
    items:
      $ref: ./SettlementRuleSelector.yaml
  splits:
    type: array
    minItems: 1
    description: The shares, in the order they are paid. At most 20.
    items:
      $ref: ./SettlementRuleSplitInput.yaml
  holdSeconds:
    type: integer
    minimum: 0
    maximum: 86400
    default: 0
    description: How long after a payment completes the rule waits to pay it, for payments on rails other than ACH.
    example: 0
  achHoldSeconds:
    type: integer
    minimum: 0
    maximum: 86400
    default: 86400
    description: How long after an ACH payment completes the rule waits to pay it. An ACH payment can be returned after it completes; a return that arrives while the execution is held skips it.
    example: 86400
  limits:
    $ref: ./SettlementRuleLimits.yaml
