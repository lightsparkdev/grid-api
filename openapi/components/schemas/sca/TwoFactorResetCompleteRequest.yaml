type: object
description: >-
  Completes a 2FA reset. The body is required and carries the IP address the end
  user is completing the reset from; `mobile` is only needed when resetting the
  `SMS_OTP` factor to a new phone number.
required:
  - endUserIpAddress
properties:
  endUserIpAddress:
    type: string
    description: >-
      The IP address of the end user's device completing this reset, recorded
      against the reset by the SCA provider. Supply the customer's address, not
      your server's — it feeds the provider's risk assessment of the recovery.
    example: 203.0.113.42
  mobile:
    type: object
    description: >-
      For an `SMS_OTP` reset, the new mobile number to enroll as the customer
      completes the reset. Required for an `SMS_OTP` reset; ignored for `TOTP` /
      `PASSKEY` resets.
    required:
      - countryCode
      - number
    properties:
      countryCode:
        type: string
        description: The country dialing code, including the leading `+`.
        example: '+1'
      number:
        type: string
        description: The national subscriber number, without the country code.
        example: '4155550123'
