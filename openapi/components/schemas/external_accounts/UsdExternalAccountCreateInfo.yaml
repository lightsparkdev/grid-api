title: USD Account
allOf:
- $ref: ./BaseExternalAccountInfo.yaml
- $ref: ../common/UsdAccountInfoBase.yaml
- type: object
  required:
  - bankAccountType
  - beneficiary
  properties:
    # Inlined, not a shared $ref: the required-property lint rule only counts a
    # property defined in this branch, and a component would rename the SDK enum.
    bankAccountType:
      type: string
      description: >-
        Whether the account is a checking or a savings account. Grid uses this to
        set the ACH transaction code, so a value that does not match the account
        causes the receiving bank to return a notification of change.
      enum:
      - CHECKING
      - SAVINGS
      example: CHECKING
    beneficiary:
      oneOf:
      - title: Individual Beneficiary
        $ref: ../common/UsdBeneficiary.yaml
      - title: Business Beneficiary
        $ref: ../common/UsdBusinessBeneficiary.yaml
      discriminator:
        propertyName: beneficiaryType
        mapping:
          INDIVIDUAL: ../common/UsdBeneficiary.yaml
          BUSINESS: ../common/UsdBusinessBeneficiary.yaml
