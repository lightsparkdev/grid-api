type: object
required:
  - currency
  - accountInfo
properties:
  currency:
    type: string
    description: The ISO 4217 currency code
    example: USD
  platformAccountId:
    type: string
    maxLength: 255
    description: >-
      Your platform's identifier for the account in your system. Must be unique.
      A wallet can be registered under several different `platformAccountId` values.
    example: ext_acc_123456
  ownershipType:
    $ref: ./OwnershipType.yaml
  accountInfo:
    $ref: ./ExternalAccountCreateInfoOneOf.yaml
