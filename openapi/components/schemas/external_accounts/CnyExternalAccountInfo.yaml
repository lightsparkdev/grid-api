title: CNY Account
description: A payout to a CNY bank account with a `BUSINESS` beneficiary needs supporting
  documents for its `purposeOfPayment`. Upload them with `POST /payment-documents`
  and pass their IDs in `documentIds` on `POST /quotes`. [Supporting documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents)
  lists the documents each purpose needs.
allOf:
- $ref: ./BaseExternalAccountInfo.yaml
- $ref: ../common/CnyAccountInfo.yaml
- type: object
  required:
  - beneficiary
  properties:
    beneficiary:
      oneOf:
      - title: Individual Beneficiary
        $ref: ../common/CnyBeneficiary.yaml
      - title: Business Beneficiary
        $ref: ../common/CnyBusinessBeneficiary.yaml
      discriminator:
        propertyName: beneficiaryType
        mapping:
          INDIVIDUAL: ../common/CnyBeneficiary.yaml
          BUSINESS: ../common/CnyBusinessBeneficiary.yaml
