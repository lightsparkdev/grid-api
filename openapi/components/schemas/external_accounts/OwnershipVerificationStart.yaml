type: object
description: >-
  The material needed to complete an ownership verification. Which fields are
  populated depends on the requested `method`: `messageToSign` for
  `WALLET_SIGNATURE`; `verificationLink` and `token` for `LIVENESS`.
required:
  - expiresAt
properties:
  messageToSign:
    type: string
    description: >-
      `WALLET_SIGNATURE` only. The exact message the wallet must sign,
      character-for-character.
    example: 'I verify that I control this wallet. Nonce: 019542f5-b3e7-1d02'
  verificationLink:
    type: string
    format: uri
    description: >-
      `LIVENESS` only. Hosted verification URL to present to the user.
    example: https://verify.example.com/session/019542f5-b3e7-1d02
  token:
    type: string
    description: >-
      `LIVENESS` only. Access token for embedding the verification flow in the
      platform's own UI, as an alternative to `verificationLink`.
  expiresAt:
    type: string
    format: date-time
    description: >-
      When this verification session expires. Prompt the user promptly; after
      expiry, a new verification must be started.
    example: '2025-08-15T15:32:00Z'
