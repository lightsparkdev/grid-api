type: object
required:
- accountType
- accountNumber
- swiftCode
properties:
  accountType:
    type: string
    enum:
    - HKD_ACCOUNT
  bankName:
    type: string
    description: Name of the beneficiary's bank. When omitted, resolved from swiftCode
      via the payout partner bank directory at account creation. Not checked against
      `GET /discoveries`.
    minLength: 1
    maxLength: 255
    example: HSBC Hong Kong
  accountNumber:
    type: string
    description: Hong Kong bank account number
    minLength: 1
    maxLength: 34
    example: '123456789012'
  swiftCode:
    type: string
    description: The SWIFT/BIC code of the bank
    example: HSBCHKHHHKH
    minLength: 8
    maxLength: 11
    pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
example:
  accountType: HKD_ACCOUNT
  bankName: HSBC Hong Kong
  accountNumber: '123456789012'
  swiftCode: HSBCHKHHHKH
