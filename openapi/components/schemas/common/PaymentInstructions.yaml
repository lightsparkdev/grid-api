type: object
required:
- accountOrWalletInfo
properties:
  instructionsNotes:
    type: string
    description: Additional human-readable instructions for making the payment
    example: Please ensure the reference code is included in the payment memo/description
      field
  isPlatformAccount:
    type: boolean
    description: Indicates whether the account is a platform account or a customer
      account.
    example: true
  accountOrWalletInfo:
    description: >-
      Where to send the funds. Quotes can carry any of these types. Internal
      accounts return only `USD_ACCOUNT`, `EUR_ACCOUNT`, `SWIFT_ACCOUNT`, and
      the network wallet types; MXN, BRL, COP, Lightning, and Bitcoin L1
      instructions appear only on real-time funded quotes.
    oneOf:
    - $ref: ../common/PaymentUsdAccountInfo.yaml
    - $ref: ../common/PaymentEurAccountInfo.yaml
    - $ref: ../common/PaymentSwiftAccountInfo.yaml
    - $ref: ../common/PaymentMxnAccountInfo.yaml
    - $ref: ../common/PaymentBrlAccountInfo.yaml
    - $ref: ../common/PaymentCopAccountInfo.yaml
    - $ref: ../common/PaymentSparkWalletInfo.yaml
    - $ref: ../common/PaymentLightningInvoiceInfo.yaml
    - $ref: ../common/PaymentBitcoinDepositAddressInfo.yaml
    - $ref: ../common/PaymentSolanaWalletInfo.yaml
    - $ref: ../common/PaymentEthereumWalletInfo.yaml
    - $ref: ../common/PaymentBaseWalletInfo.yaml
    - $ref: ../common/PaymentPolygonWalletInfo.yaml
    - $ref: ../common/PaymentArbitrumWalletInfo.yaml
    - $ref: ../common/PaymentTronWalletInfo.yaml
    - $ref: ../common/PaymentPlasmaWalletInfo.yaml
    - $ref: ../common/PaymentEmbeddedWalletInfo.yaml
    discriminator:
      propertyName: accountType
      mapping:
        USD_ACCOUNT: ../common/PaymentUsdAccountInfo.yaml
        EUR_ACCOUNT: ../common/PaymentEurAccountInfo.yaml
        SWIFT_ACCOUNT: ../common/PaymentSwiftAccountInfo.yaml
        MXN_ACCOUNT: ../common/PaymentMxnAccountInfo.yaml
        BRL_ACCOUNT: ../common/PaymentBrlAccountInfo.yaml
        COP_ACCOUNT: ../common/PaymentCopAccountInfo.yaml
        SPARK_WALLET: ../common/PaymentSparkWalletInfo.yaml
        LIGHTNING: ../common/PaymentLightningInvoiceInfo.yaml
        BITCOIN_L1: ../common/PaymentBitcoinDepositAddressInfo.yaml
        SOLANA_WALLET: ../common/PaymentSolanaWalletInfo.yaml
        ETHEREUM_WALLET: ../common/PaymentEthereumWalletInfo.yaml
        BASE_WALLET: ../common/PaymentBaseWalletInfo.yaml
        POLYGON_WALLET: ../common/PaymentPolygonWalletInfo.yaml
        ARBITRUM_WALLET: ../common/PaymentArbitrumWalletInfo.yaml
        TRON_WALLET: ../common/PaymentTronWalletInfo.yaml
        PLASMA_WALLET: ../common/PaymentPlasmaWalletInfo.yaml
        EMBEDDED_WALLET: ../common/PaymentEmbeddedWalletInfo.yaml
