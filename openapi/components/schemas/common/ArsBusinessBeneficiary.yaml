title: Business Beneficiary
type: object
required:
- beneficiaryType
- legalName
- taxId
properties:
  beneficiaryType:
    type: string
    enum:
    - BUSINESS
  legalName:
    type: string
    maxLength: 250
    description: The legal name of the business
  email:
    type: string
    maxLength: 320
    description: The email of the beneficiary
  phoneNumber:
    type: string
    maxLength: 50
    description: The phone number of the beneficiary
  registrationNumber:
    type: string
    maxLength: 100
    description: The company registration number of the business
  taxId:
    type: string
    maxLength: 100
    description: The business's CUIT, written XY-12345678-Z or as 11 digits
    example: 30-50001091-2
    pattern: ^[0-9]{2}-?[0-9]{8}-?[0-9]$
  countryOfResidence:
    type: string
    description: ISO 3166-1 alpha-2 country code, such as GB for the UK
  address:
    $ref: ./Address.yaml
