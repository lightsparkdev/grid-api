title: Business Beneficiary
type: object
description: Wires to this account may require `address.city`, at most 35
  characters, depending on the bank that sends them for your platform. When
  they do, creating the account with an address that has no `city`, or a longer
  one, fails with `INVALID_INPUT`.
required:
- beneficiaryType
- legalName
properties:
  beneficiaryType:
    type: string
    enum:
    - BUSINESS
  legalName:
    type: string
    maxLength: 250
    description: The legal name of the business
  email:
    type: string
    maxLength: 320
    description: The email of the beneficiary
  phoneNumber:
    type: string
    maxLength: 50
    description: The phone number of the beneficiary
  registrationNumber:
    type: string
    maxLength: 100
    description: The company registration number of the business
  taxId:
    type: string
    maxLength: 100
    description: The tax identification number of the business
  countryOfResidence:
    type: string
    description: The country of residence of the beneficiary
  address:
    $ref: ./Address.yaml
