allOf:
- $ref: ./UsdAccountInfoBase.yaml
- type: object
  required:
  - paymentRails
  properties:
    paymentRails:
      type: array
      items:
        type: string
        enum:
        - ACH
        - WIRE
        - RTP
        - FEDNOW
    bankAccountType:
      type: string
      description: Whether the account is a checking or a savings account. Grid uses
        this to set the ACH transaction code, so a value that does not match the account
        causes the receiving bank to return a notification of change. Omitted on
        accounts created before the field was required.
      enum:
      - CHECKING
      - SAVINGS
      example: CHECKING
