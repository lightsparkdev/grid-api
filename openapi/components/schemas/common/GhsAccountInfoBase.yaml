type: object
required:
- accountType
- bankName
description: 'Required fields depend on the selected paymentRails:

  - BANK_TRANSFER: accountNumber, bankName

  - MOBILE_MONEY: bankName, phoneNumber'
properties:
  accountType:
    type: string
    enum:
    - GHS_ACCOUNT
  accountNumber:
    type: string
    description: The account number of the bank
    minLength: 1
    maxLength: 34
  bankName:
    type: string
    description: The name of the bank. Must be one of the `bankName` values `GET /discoveries`
      returns for this country and currency. Send it exactly as returned; any other
      name is rejected.
    minLength: 1
    maxLength: 255
    example: Gcb Bank Ltd
  phoneNumber:
    type: string
    description: The phone number in international format
    example: '+1234567890'
    minLength: 7
    maxLength: 15
    pattern: ^\+[0-9]{6,14}$
example:
  accountType: GHS_ACCOUNT
  accountNumber: '1234567890'
  bankName: Gcb Bank Ltd
  phoneNumber: '+1234567890'
