type: object
required:
- accountType
- iban
- bankName
properties:
  accountType:
    type: string
    enum:
    - ILS_ACCOUNT
  iban:
    type: string
    description: Israeli IBAN (23 characters, starting with IL)
    example: IL620108000000099999999
    minLength: 23
    maxLength: 23
    pattern: ^IL[0-9]{21}$
  bankName:
    type: string
    description: The name of the bank. Must be one of the `bankName` values `GET /discoveries`
      returns for this country and currency. Send it exactly as returned; any other
      name is rejected.
    minLength: 1
    maxLength: 255
    example: Bank Leumi Le-Israel B.M
example:
  accountType: ILS_ACCOUNT
  iban: IL620108000000099999999
  bankName: Bank Leumi Le-Israel B.M
