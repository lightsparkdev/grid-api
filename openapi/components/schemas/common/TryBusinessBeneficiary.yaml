title: Business Beneficiary
type: object
required:
- beneficiaryType
- countryOfResidence
- legalName
properties:
  beneficiaryType:
    type: string
    enum:
    - BUSINESS
  legalName:
    type: string
    maxLength: 250
    description: The legal name of the business
  email:
    type: string
    maxLength: 320
    description: The email of the beneficiary
  phoneNumber:
    type: string
    maxLength: 50
    description: The phone number of the beneficiary
  registrationNumber:
    type: string
    maxLength: 100
    description: The company registration number of the business
  taxId:
    type: string
    maxLength: 100
    description: The tax identification number of the business
  countryOfResidence:
    type: string
    description: The country of residence of the beneficiary
  address:
    $ref: ./Address.yaml
