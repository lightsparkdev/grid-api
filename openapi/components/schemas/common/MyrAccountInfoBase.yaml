type: object
required:
- accountType
- bankName
- accountNumber
- swiftCode
properties:
  accountType:
    type: string
    enum:
    - MYR_ACCOUNT
  bankName:
    type: string
    description: The name of the bank. Must be one of the `bankName` values `GET /discoveries`
      returns for this country and currency. Send it exactly as returned; any other
      name is rejected.
    minLength: 1
    maxLength: 255
    example: Maybank
  accountNumber:
    type: string
    description: Malaysian bank account number
    minLength: 1
    maxLength: 34
    example: '1234567890'
  swiftCode:
    type: string
    description: The SWIFT/BIC code of the bank
    example: MABORUMMYYY
    minLength: 8
    maxLength: 11
    pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
example:
  accountType: MYR_ACCOUNT
  bankName: Maybank
  accountNumber: '1234567890'
  swiftCode: MABORUMMYYY
