title: Individual Beneficiary
type: object
description: Wires to this account may require `address.city`, at most 35 characters,
  depending on the bank that sends them for your platform. When they do, creating
  the account with an address that has no `city`, or a longer one, fails with `INVALID_INPUT`.
required:
- beneficiaryType
- fullName
properties:
  beneficiaryType:
    type: string
    enum:
    - INDIVIDUAL
  fullName:
    type: string
    maxLength: 250
    description: The full name of the beneficiary
  birthDate:
    type: string
    description: The birth date of the beneficiary
  nationality:
    type: string
    description: ISO 3166-1 alpha-2 country code, such as GB for the UK
  email:
    type: string
    maxLength: 320
    description: The email of the beneficiary
  phoneNumber:
    type: string
    maxLength: 50
    description: The phone number of the beneficiary
  countryOfResidence:
    type: string
    description: ISO 3166-1 alpha-2 country code, such as GB for the UK
  address:
    $ref: ./Address.yaml
