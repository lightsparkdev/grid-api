title: USD Bank Account
allOf:
  - $ref: ./BasePaymentAccountInfo.yaml
  - $ref: ./UsdAccountInfo.yaml
  - type: object
    required:
      - reference
    properties:
      reference:
        type: string
        description: >-
          Unique reference code that must be included with the payment to properly
          credit it
        example: UMA-Q12345-REF
      bankAddress:
        type: string
        description: >-
          The postal address of the financial institution holding the account, on
          a single line. Optional on every rail, and recommended for wires, where
          some originating banks require the beneficiary institution's address
          before they will send.
        example: 885 Teaneck Road, Teaneck, NJ 07666
        minLength: 1
        maxLength: 255
      swiftCode:
        type: string
        description: >-
          The SWIFT/BIC code of the financial institution holding the account.
          Present when the account can receive international wires. Payers
          sending from outside the US use it with `accountNumber` in place of
          `routingNumber`.
        example: CHASUS33
        minLength: 8
        maxLength: 11
        pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
