title: USD Bank Account
allOf:
  - $ref: ./BasePaymentAccountInfo.yaml
  - $ref: ./UsdAccountInfo.yaml
  - type: object
    required:
      - reference
    properties:
      reference:
        type: string
        description: >-
          Reference code for the payment. On a quote's `paymentInstructions`,
          include it with the payment, in the memo or remittance information, so
          Grid can match the payment to the quote. On an internal account's
          `fundingPaymentInstructions`, the account number is unique to that
          account and deposits are credited by account number, so the payer
          doesn't need to include the reference.
        example: UMA-Q12345-REF
      bankAddress:
        type: string
        description: >-
          The postal address of the financial institution holding the account, on
          a single line. Optional on every rail, and recommended for wires, where
          some originating banks require the beneficiary institution's address
          before they will send.
        example: 885 Teaneck Road, Teaneck, NJ 07666
        minLength: 1
        maxLength: 255
