description: >-
  The payment rail used for the transfer. Payment rails represent the underlying
  payment network or system used to move funds between accounts.


  `ACH_SAME_DAY` requests same-business-day settlement for a USD payout and is priced
  separately. It is subject to the NACHA per-entry same-day limit, which the network
  applies to every originator: $1,000,000 per entry, rising to $10,000,000 on
  2027-09-17. A payout above that limit is rejected rather than slowed — check the
  amount before requesting this rail, or send it over `ACH`, which settles on the
  standard schedule and has no such limit.


  `ACH` will settle on the standard next-business-day schedule. Until a date we announce
  in advance, `ACH` continues to settle same-business-day on production platforms; it
  already settles next-business-day on sandbox platforms. To guarantee same-day
  settlement after that date, request `ACH_SAME_DAY`.


  `BANK_TRANSFER` pays the recipient's bank account. For a payout in a currency other
  than USD, omit the rail. Grid picks it from the account and the amount.
  `BANK_TRANSFER` is also accepted. In COP, DKK, EUR, INR and PHP, more than one bank
  rail can carry a payout, and Grid picks one for you. In INR, `BANK_TRANSFER` needs an
  account with `accountNumber` and `ifsc`. `UPI` is a separate rail and is not
  deprecated.


  For payouts in these currencies, these rail names are deprecated: `ACH_COLOMBIA` and
  `BRE_B` (COP), `SEPA` and `SEPA_INSTANT` (DKK and EUR), `NEFT` and `RTGS` (INR), and
  `INSTAPAY` and `PESONET` (PHP). Requests that send them still work. Payout responses
  will show `BANK_TRANSFER` in their place, so read each of them as `BANK_TRANSFER`.
example: ACH
