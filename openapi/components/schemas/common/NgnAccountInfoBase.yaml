type: object
required:
- accountType
- accountNumber
- bankName
properties:
  accountType:
    type: string
    enum:
    - NGN_ACCOUNT
  accountNumber:
    type: string
    description: Nigerian bank account number
    minLength: 10
    maxLength: 10
    example: '0123456789'
    pattern: ^[0-9]{10}$
  bankName:
    type: string
    description: The name of the bank. Must be one of the `bankName` values `GET /discoveries`
      returns for this country and currency. Send it exactly as returned; any other
      name is rejected.
    minLength: 1
    maxLength: 255
    example: Access Bank
example:
  accountType: NGN_ACCOUNT
  accountNumber: '0123456789'
  bankName: Access Bank
