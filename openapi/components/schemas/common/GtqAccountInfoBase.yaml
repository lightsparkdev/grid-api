type: object
required:
- accountType
- accountNumber
- bankAccountType
- bankName
properties:
  accountType:
    type: string
    enum:
    - GTQ_ACCOUNT
  accountNumber:
    type: string
    description: The account number of the bank
    minLength: 1
    maxLength: 34
  bankAccountType:
    type: string
    description: The bank account type
    enum:
    - CHECKING
    - SAVINGS
  bankName:
    type: string
    description: The name of the beneficiary's bank. Must be one of the `bankName`
      values `GET /discoveries` returns for this country and currency. Send it exactly
      as returned; any other name is rejected.
    minLength: 1
    maxLength: 255
    example: Banco Industrial
example:
  accountType: GTQ_ACCOUNT
  accountNumber: '1234567890'
  bankAccountType: CHECKING
  bankName: Banco Industrial
