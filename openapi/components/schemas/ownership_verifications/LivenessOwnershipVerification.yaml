title: Liveness Ownership Verification
type: object
description: >-
  An ownership verification completed by the user through a hosted biometric
  verification flow.
required:
  - id
  - externalAccountId
  - method
  - status
  - verificationLink
  - token
  - expiresAt
  - createdAt
properties:
  id:
    type: string
    description: Unique identifier for this ownership verification
    example: OwnershipVerification:019542f5-b3e7-1d02-0000-000000000002
  externalAccountId:
    type: string
    description: The ID of the external account whose ownership is being verified
    example: ExternalAccount:019542f5-b3e7-1d02-0000-000000000001
  method:
    type: string
    enum:
      - LIVENESS
    description: The verification method. Always `LIVENESS` for this shape.
    example: LIVENESS
  status:
    $ref: ./OwnershipVerificationState.yaml
  verificationLink:
    type: string
    format: uri
    description: Hosted verification URL to present to the user.
    example: https://verify.example.com/session/019542f5-b3e7-1d02
  token:
    type: string
    description: >-
      Access token for embedding the verification flow in the platform's own
      UI, as an alternative to `verificationLink`.
    example: eyJhbGciOiJIUzI1NiJ9.example
  expiresAt:
    type: string
    format: date-time
    description: >-
      When this verification session expires. Prompt the user promptly; after
      expiry, a new verification must be started.
    example: '2025-08-15T15:32:00Z'
  createdAt:
    type: string
    format: date-time
    description: When this verification was created
    example: '2025-08-15T15:02:00Z'
  updatedAt:
    type: string
    format: date-time
    description: When this verification was last updated
    example: '2025-08-15T15:02:00Z'
