type: string
enum:
  - PENDING
  - PENDING_REVIEW
  - VERIFIED
  - FAILED
description: |
  Current status of this ownership verification.

  | Status | Description |
  |--------|-------------|
  | `PENDING` | Awaiting the wallet signature or the user completing the verification flow |
  | `PENDING_REVIEW` | Submitted and under review |
  | `VERIFIED` | Ownership was verified. Terminal |
  | `FAILED` | This verification attempt failed. Terminal; start a new verification to retry |
example: PENDING
