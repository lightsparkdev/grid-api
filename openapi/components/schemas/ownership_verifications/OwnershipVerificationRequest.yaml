type: object
description: >-
  Creates an ownership verification for a self-custody crypto wallet external
  account.
required:
  - externalAccountId
  - method
properties:
  externalAccountId:
    type: string
    description: >-
      The ID of the external account (self-custody crypto wallet) whose
      ownership is being verified.
    example: ExternalAccount:019542f5-b3e7-1d02-0000-000000000001
  method:
    $ref: ./OwnershipVerificationMethod.yaml
    description: The verification method to use.
