title: Wallet Signature Ownership Verification
type: object
description: >-
  An ownership verification completed by signing a message with the wallet's
  key.
required:
  - id
  - externalAccountId
  - method
  - status
  - messageToSign
  - expiresAt
  - createdAt
properties:
  id:
    type: string
    description: Unique identifier for this ownership verification
    example: OwnershipVerification:019542f5-b3e7-1d02-0000-000000000001
  externalAccountId:
    type: string
    description: The ID of the external account whose ownership is being verified
    example: ExternalAccount:019542f5-b3e7-1d02-0000-000000000001
  method:
    type: string
    enum:
      - WALLET_SIGNATURE
    description: The verification method. Always `WALLET_SIGNATURE` for this shape.
    example: WALLET_SIGNATURE
  status:
    $ref: ./OwnershipVerificationState.yaml
  messageToSign:
    type: string
    description: The exact message the wallet must sign, character-for-character.
    example: 'I verify that I control this wallet. Nonce: 019542f5-b3e7-1d02'
  expiresAt:
    type: string
    format: date-time
    description: >-
      When this verification session expires. Prompt the user promptly; after
      expiry, a new verification must be started.
    example: '2025-08-15T15:32:00Z'
  createdAt:
    type: string
    format: date-time
    description: When this verification was created
    example: '2025-08-15T15:02:00Z'
  updatedAt:
    type: string
    format: date-time
    description: When this verification was last updated
    example: '2025-08-15T15:02:00Z'
