type: object
required:
  - file
  - documentType
  - country
properties:
  file:
    type: string
    format: binary
    description: |
      The document file. Grid accepts three formats, matched on the
      `Content-Type` of the multipart part rather than the file extension:
      `application/pdf`, `image/jpeg`, and `image/png`. Any other type,
      including `image/heic`, `image/webp`, and `image/tiff`, returns
      `400 INVALID_INPUT`. The file must be 10 MB or smaller.
  documentType:
    $ref: ./DocumentType.yaml
  side:
    type: string
    enum:
      - FRONT
      - BACK
    description: Which side of the document (for two-sided documents like driver's licenses)
    example: FRONT
  country:
    type: string
    description: Country that issued the document (ISO 3166-1 alpha-2)
    example: US
  documentNumber:
    type: string
    description: Document identification number (e.g., passport number)
    example: A12345678
  issuingAuthority:
    type: string
    description: Name of the government agency or organization that issued the document
    example: U.S. Department of State
