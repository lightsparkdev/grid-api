type: object
required:
  - umaAddress
  - platformCustomerId
  - customerType
properties:
  id:
    type: string
    description: System-generated unique identifier
    example: Customer:019542f5-b3e7-1d02-0000-000000000001
  platformCustomerId:
    type: string
    description: Platform-specific customer identifier
    example: 9f84e0c2a72c4fa
  customerType:
    $ref: ./CustomerType.yaml
  endUserTermsConsent:
    deprecated: true
    readOnly: true
    allOf:
      - $ref: ./EndUserTermsConsent.yaml
    description: >-
      Deprecated; read `agreementConsents` instead. Mirrors the customer's
      `LIGHTSPARK_END_USER_TERMS` acceptance when one is on file, and is
      omitted otherwise.
  agreementConsents:
    type: array
    readOnly: true
    description: >-
      The customer's recorded agreement acceptances, one entry per accepted
      type holding that type's most recent acceptance. Empty until an
      acceptance has been recorded.
    items:
      $ref: ./AgreementConsent.yaml
  region:
    type: string
    description: >-
      Country code (ISO 3166-1 alpha-2) representing the customer's regional identity
      and regulatory jurisdiction.
    example: US
  currencies:
    type: array
    items:
      type: string
    description: >-
      List of currency codes enabled for this customer.
    example:
      - USD
      - USDC
  email:
    type: string
    format: email
    description: >-
      Email address for the customer.
    example: john.doe@example.com
  phoneNumber:
    type: string
    pattern: '^\+[1-9]\d{1,14}$'
    description: >-
      Phone number for the customer in strict E.164 format.
    example: '+14155551234'
  umaAddress:
    type: string
    description: >-
       Full UMA address (always present in responses, even if system-generated). This is an optional identifier
       to route payments to the customer.
    example: $john.doe@uma.domain.com
  createdAt:
    type: string
    format: date-time
    description: Creation timestamp
    example: '2025-07-21T17:32:28Z'
  updatedAt:
    type: string
    format: date-time
    description: Last update timestamp
    example: '2025-07-21T17:32:28Z'
  isDeleted:
    type: boolean
    description: Whether the customer is marked as deleted
    example: false
  contactVerification:
    allOf:
      - $ref: ./ContactVerification.yaml
    description: >-
      Email and phone verification state. **Only present when the customer's
      payment provider requires it** (e.g. EU customers); omitted otherwise.
