allOf:
  - type: object
    required:
      - customerType
    properties:
      customerType:
        type: string
        enum:
          - INDIVIDUAL
      kycStatus:
        $ref: ./KycStatus.yaml
      fullName:
        type: string
        maxLength: 250
        description: Individual's full name
        example: John Michael Doe
      birthDate:
        type: string
        format: date
        description: Date of birth in ISO 8601 format (YYYY-MM-DD)
        example: '1990-01-15'
      nationality:
        type: string
        description: Country code (ISO 3166-1 alpha-2)
        example: US
      address:
        $ref: ../common/Address.yaml
      idType:
        $ref: ./IdentificationType.yaml
      identifier:
        type: string
        maxLength: 100
        writeOnly: true
        description: >-
          The individual's tax identification number: an SSN (format
          `###-##-####`) or ITIN, or a non-US tax ID (`idType` `NON_US_TAX_ID`)
          with its non-US `countryOfIssuance`. US residents must provide an SSN
          or ITIN. Write-only — never returned in customer responses.
        example: 123-45-6789
      countryOfIssuance:
        type: string
        description: >-
          Country that issued the identification (ISO 3166-1 alpha-2). For an
          SSN or ITIN this is optional, defaults to `US`, and is rejected if set
          to anything else. For a `NON_US_TAX_ID`, set it to the issuing non-US
          country; `US` is rejected.
        example: US
  - $ref: ./CustomerEdd.yaml
