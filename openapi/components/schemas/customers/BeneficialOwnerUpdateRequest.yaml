type: object
properties:
  roles:
    type: array
    minItems: 1
    items:
      $ref: ./BeneficialOwnerRole.yaml
    description: Roles of this person within the business
    example:
      - UBO
      - DIRECTOR
  title:
    type: string
    maxLength: 128
    description: Job title of this person within the business, such as Chief Executive Officer. Sent to the banking partner for a control person.
    example: Chief Executive Officer
  ownershipPercentage:
    type: integer
    description: Percentage of ownership in the business (0-100)
    minimum: 0
    maximum: 100
    example: 51
  personalInfo:
    $ref: ./BeneficialOwnerPersonalInfoUpdate.yaml
