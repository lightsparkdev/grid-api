type: object
required:
  - customerType
properties:
  platformCustomerId:
    type: string
    description: Platform-specific customer identifier. If not provided, one will be generated by the system.
    example: 9f84e0c2a72c4fa
  customerType:
    $ref: ./CustomerType.yaml
  region:
    type: string
    description: >-
      Country code (ISO 3166-1 alpha-2) for the customer's region. Optional — send
      it only when the same currency is offered in more than one of your regions,
      to pick the one that applies to this customer.
    example: US
  currencies:
    type: array
    items:
      type: string
    description: >-
      Currency codes the customer will use — ISO 4217 for fiat, tickers for crypto
      (e.g. "USDC"). Optional — send them if your platform supports more than one
      currency, so we know which ones this customer needs. Some combinations
      require separate customers.
    example:
      - USD
      - USDC
  email:
    type: string
    format: email
    maxLength: 255
    description: >-
      Email address for the customer. **Required in regions that verify the
      email address before identity verification** (e.g. the EU); optional
      otherwise.
    example: john.doe@example.com
  phoneNumber:
    type: string
    pattern: '^\+[1-9]\d{1,14}$'
    description: >-
      Phone number for the customer in strict E.164 format. **Required in
      regions that verify the phone number before identity verification**
      (e.g. the EU); optional otherwise.
    example: '+14155551234'
  umaAddress:
    type: string
    description: >-
      Optional UMA address identifier. If not provided during customer creation, one will be generated by the system.
      If provided during customer update, the UMA address will be updated to the provided value. This is an optional identifier to route payments to the customer.
      This is an optional identifier to route payments to the customer.
    example: $john.doe@uma.domain.com
  endUserTermsConsent:
    deprecated: true
    allOf:
      - $ref: ./EndUserTermsConsent.yaml
    description: >-
      Deprecated; send `agreementConsents` instead. Supplying this records
      acceptance of the Lightspark End User Terms, equivalent to a single
      `agreementConsents` entry of type `LIGHTSPARK_END_USER_TERMS`. Supplying
      both fields in one request is rejected.
  agreementConsents:
    type: array
    description: >-
      Evidence that the customer accepted Grid agreements, at most
      one entry per type. Include every agreement the platform requires for
      the customer's accounts: the Lightspark End User Terms on unregulated
      platforms, and the Lead accountholder agreement for the customer type
      when the platform requires it. Creating a new customer without them
      fails with `END_USER_TERMS_NOT_ACCEPTED` or
      `ACCOUNTHOLDER_AGREEMENT_NOT_ACCEPTED`. Other agreements can be supplied
      here or in a later customer update.
    items:
      $ref: ./AgreementConsentRequest.yaml
