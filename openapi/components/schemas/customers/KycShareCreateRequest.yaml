type: object
description: Request body for importing an identity document from a reusable KYC share token.
required:
  - shareToken
properties:
  shareToken:
    type: string
    maxLength: 1024
    description: >-
      Single-use Sumsub share token generated by the partner that verified the customer. The
      partner must generate it for Lightspark's Sumsub client ID.
    example: _act-sbx-jwt-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
