type: object
deprecated: true
required:
  - version
  - url
description: >-
  Deprecated; read the agreement documents list instead, which reports every
  agreement Grid supports rather than the End User Terms alone.
properties:
  version:
    type: string
    description: Current version identifier of the Grid End User Terms.
    example: V1
  url:
    type: string
    format: uri
    description: URL where Grid hosts this version of the End User Terms.
    example: https://www.lightspark.com/legal/grid/enduserterms
