title: Sweep Rule Request
type: object
description: >-
  The routing rule attached to a rule-based account. Every payment that settles
  into the account is swept to the rule's destination, carrying the payment
  metadata configured here.
required:
  - destination
properties:
  destination:
    allOf:
      - $ref: ./SweepRuleDestinationRequest.yaml
    description: Where funds that settle into this account are swept.
  purposeOfPayment:
    allOf:
      - $ref: ../quotes/PurposeOfPayment.yaml
    description: >-
      The purpose of payment applied to each sweep. Required by some
      destination geographies.
    example: SELF
  description:
    type: string
    maxLength: 255
    description: >-
      Free-form description recorded on each sweep. Not delivered to the
      recipient; use `remittanceInformation` for that.
    example: Rent sweep
  remittanceInformation:
    type: string
    maxLength: 1024
    description: >-
      Free-form information that travels with each sweep to the recipient.
      The field this populates depends on the payment rail: for ACH it
      populates the Addenda record, for FedNow and RTP it populates the
      remittanceInformation field, and for wires it populates the OBI
      (Originator to Beneficiary Information) / beneficiary information. Only
      printable ASCII characters are accepted, because the underlying rails
      carry nothing else.
    example: Unit 4B March
  platformFeeOverride:
    allOf:
      - $ref: ../quotes/PlatformFeeOverride.yaml
    description: >-
      Fee terms applied to every sweep this rule drives. Omit it to use the
      platform's configured fees.
  refundAddresses:
    type: array
    maxItems: 16
    items:
      $ref: ./SweepRuleRefundAddress.yaml
    description: >-
      Optional, for `USDC` and `USDT` accounts only. Where a deposit is
      returned when its sweep cannot complete, one address per network. A
      deposit is returned in full, in the currency it arrived in, to the
      address for the network it arrived on. A deposit on a network with no
      address here, or any deposit when this is omitted, is returned to the
      customer's internal account for that currency. Grid rejects a network
      the account does not take deposits on, a network listed twice, or an
      address that is not valid on its network. To use one EVM address on
      several EVM networks, list it once for each.
