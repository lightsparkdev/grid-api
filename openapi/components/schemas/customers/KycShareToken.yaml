type: object
description: >-
  A single-use reusable KYC share token from a partner that already verified this person.
required:
  - provider
  - token
properties:
  provider:
    $ref: ./KycProvider.yaml
    description: The KYC provider that issued the share token.
  token:
    type: string
    maxLength: 1024
    description: The share token generated by the partner for Lightspark.
    example: _act-sbx-jwt-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
