title: Customer Update Request
description: >-
  Request body for `PATCH /customers/{customerId}`. When `email` changes for a
  customer with tied Embedded Wallet `EMAIL_OTP` credentials, or `phoneNumber`
  changes for a customer with tied `SMS_OTP` credentials, the new contact must
  first be registered and verified with `POST /auth/credentials` and
  `POST /auth/credentials/{id}/verify`. The update then runs through the
  endpoint's signed-retry flow. Update `email` and `phoneNumber` in separate
  PATCH calls.
type: object
required:
  - customerType
properties:
  customerType:
    $ref: ./CustomerType.yaml
  currencies:
    type: array
    items:
      type: string
    description: >-
      Updated list of currency codes the customer will use (ISO 4217 for fiat, e.g. "USD", "EUR";
      tickers for crypto, e.g. "BTC", "USDC"). Replaces the existing list. Some currency
      combinations may require separate customers — if so, the request will be rejected
      with details.
    example:
      - USD
      - EUR
      - USDC
  email:
    type: string
    format: email
    maxLength: 255
    description: >-
      Email address for the customer. For customers with tied Embedded Wallet
      `EMAIL_OTP` credentials, the new address must first be verified on a
      new `EMAIL_OTP` credential, and changing this value replaces the
      sign-in email.
    example: john.doe@example.com
  phoneNumber:
    type: string
    pattern: '^\+[1-9]\d{1,14}$'
    description: >-
      Phone number for the customer in strict E.164 format. For customers with
      tied Embedded Wallet `SMS_OTP` credentials, the new number must first be
      verified on a new `SMS_OTP` credential, and changing this value replaces
      the sign-in phone number. Send phone number and email updates as
      separate PATCH calls.
    example: '+14155551234'
  umaAddress:
    type: string
    description: >-
      Optional UMA address identifier. If provided, the customer's UMA address will be updated.
      This is an optional identifier to route payments to the customer.
    example: $john.doe@uma.domain.com
  endUserTermsConsent:
    deprecated: true
    allOf:
      - $ref: ./EndUserTermsConsent.yaml
    description: >-
      Deprecated; send `agreementConsents` instead. Supplying this records
      acceptance of the Lightspark End User Terms, equivalent to a single
      `agreementConsents` entry of type `LIGHTSPARK_END_USER_TERMS`. Supplying
      both fields in one request is rejected.
  agreementConsents:
    type: array
    description: >-
      Evidence that the customer accepted Grid agreements, at most
      one entry per type. Supplying this records additional acceptances; it
      never withdraws or replaces evidence already recorded for other types.
      Omitting the field leaves recorded consents unchanged.
    items:
      $ref: ./AgreementConsentRequest.yaml
