type: object
description: >-
  Limits on the purchases that fall in a bucket, or that match no bucket. At
  least one limit is set. They apply whatever the bucket's action, and
  whatever the owner answered about a merchant.
minProperties: 1
properties:
  perPurchase:
    type: integer
    format: int64
    minimum: 0
    maximum: 1000000000000000
    description: >-
      The most one purchase may be, in the smallest unit of the rule's
      `currency`.
    example: 2000
  total:
    $ref: ./SpendingRuleTotalLimit.yaml
  count:
    $ref: ./SpendingRuleCountLimit.yaml
