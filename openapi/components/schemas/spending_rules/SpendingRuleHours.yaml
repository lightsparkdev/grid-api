type: object
description: >-
  When in the week purchases may be made, in the rule's `timeZone`. Either a
  window of the day on some days, with `start` and `end`, or whole days, with
  `days` alone. An `end` before `start` runs past midnight into the next
  day. Whole days must leave out at least one day of the week, since all
  seven would allow every time.
properties:
  start:
    type: string
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,6})?)?$'
    description: >-
      Local time the window opens, as `HH:MM` or `HH:MM:SS`, with no UTC
      offset. Set together with `end`, and different from it, or leave both
      out for whole days. Grid returns it as `HH:MM:SS`, with any fractional
      seconds it was given.
    example: '09:00:00'
  end:
    type: string
    pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9](\.[0-9]{1,6})?)?$'
    description: >-
      Local time the window closes, as `HH:MM` or `HH:MM:SS`, with no UTC
      offset. Set together with `start`.
    example: '17:00:00'
  days:
    type: array
    minItems: 1
    maxItems: 7
    description: >-
      The days the window applies on, or the whole days purchases may be made
      on when `start` and `end` are left out. Defaults to every day. A day
      listed twice counts once. Grid returns the days sorted.
    items:
      $ref: ./SpendingRuleWeekday.yaml
    example:
      - MON
      - TUE
      - WED
      - THU
      - FRI
