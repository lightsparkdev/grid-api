type: object
description: |
  The owner's answer about whether the agent may buy from a merchant, kept for
  one bucket of the agent's rule, or for purchases that match no bucket. It
  decides only a purchase that needs the owner's approval because of that
  bucket, its `question` or the rule's `statement`: a no declines it, and a
  yes approves it only if every other part of the rule allows it. For a
  bucket that declines, a yes means the merchant is not in that bucket.

  The same merchant means the same merchant category and the same name, with
  case, apostrophes, punctuation, a payment processor's prefix and trailing
  words with no letter, such as a store number, ignored, and names compared
  on their first 155 characters. A yes can also apply to another name of the
  same category and the same first word that the model judges to be the same
  business (check `SAME_MERCHANT`); a no kept for such a name stops that. A
  no applies only to the name it was given for. An answer stops
  applying when its bucket's match, question or action, the rule's time zone
  or currency, or the statement changes. It is kept when the rule is removed
  and put in force again with the same bucket.
required:
  - id
  - status
  - merchantDescriptor
  - bucketKey
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: System-generated unique identifier of the answer.
    example: SpendingRuleMerchantAnswer:019542f5-b3e7-1d02-0000-000000000501
  status:
    $ref: ./SpendingRuleMerchantAnswerStatus.yaml
  merchantDescriptor:
    type: string
    description: >-
      The merchant's name as the card network reported it when the owner was
      asked. Untrusted text that the merchant controls: escape it before
      display.
    example: JOES PIZZA 1234
  merchantCategoryCode:
    type: string
    description: >-
      The merchant category code the answer is for. Absent when the merchant
      reported none, in which case the answer covers only purchases with no
      category code.
    example: '5814'
  merchantCity:
    type: string
    description: >-
      The merchant's city as the card network reported it when the owner was
      asked, when it did. Untrusted text: escape it before display.
    example: Brooklyn
  merchantCountry:
    type: string
    description: >-
      The merchant's country as the card network reported it when the owner
      was asked, when it did.
    example: USA
  bucketKey:
    type: string
    description: >-
      The `key` of the bucket the answer is for, or `(unmatched)` for
      purchases that match no bucket.
    example: pizza
  upToAmount:
    type: integer
    format: int64
    description: >-
      For an `APPROVED` answer, the most a purchase may be for the yes to
      apply, in the smallest unit of the rule's currency, given as
      `currency`. A purchase in another currency is not covered. Absent when
      the yes covers any amount.
    example: 2500
  currency:
    type: string
    description: >-
      ISO 4217 code of `upToAmount`: the rule's `currency`. Present with
      `upToAmount`.
    example: USD
  agentActionId:
    type: string
    description: >-
      The `SPENDING_RULE_QUESTION` agent action that asked the owner, when
      the answer came from one.
    example: AgentAction:019542f5-b3e7-1d02-0000-000000000099
  askedAt:
    type: string
    format: date-time
    description: When the owner was asked. Absent when the answer was not asked for.
    example: '2026-11-16T15:10:00Z'
  decidedAt:
    type: string
    format: date-time
    description: When the owner answered. Absent while `PENDING`.
    example: '2026-11-16T15:20:00Z'
  createdAt:
    type: string
    format: date-time
    description: When the answer was first kept.
    example: '2026-11-16T15:10:00Z'
  updatedAt:
    type: string
    format: date-time
    description: When the answer last changed.
    example: '2026-11-16T15:20:00Z'
