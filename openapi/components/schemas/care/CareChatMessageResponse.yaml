type: object
description: >-
  The result of one call to the message route. Which fields are present
  depends on what the call did: a turn adds `id`, `displayMessage`, `reply`
  and `replayed`; the call that opened the chat adds `reply` alone, carrying
  the agent's opening line; an outstanding verification adds
  `destinationMasked`, `alreadySent` and, where the service could be read,
  `codeLength`; and the turn in which the
  cardholder sent their verification code adds `sessionToken` and
  `expiresAt`. Render `displayMessage` if present, then `reply` if present.
required:
  - chatId
  - verificationStatus
  - verificationRequired
  - chatEnded
properties:
  chatId:
    type: string
    description: >-
      The chat this call ran on. When the request addressed a cardholder
      (`Customer:<uuid>` in the path) this is the chat that was found or
      opened for them. Use it for every later call on this conversation:
      later messages and closing the chat.
    example: CareChat:019542f5-b3e7-1d02-0000-000000000030
  verificationStatus:
    $ref: ./CareChatVerificationStatus.yaml
  chatEnded:
    type: boolean
    description: >-
      Whether the chat has ended as of this response, so no further message
      will be accepted. Present on every response, true or false, so a client
      reads a field rather than an absence. It is the chat's state, not
      whether this call ended it: on the turn where the agent ends the chat it
      is true and the closing line is in `reply`, and a replay of that turn
      after the chat ended is also true. When it is true, stop sending to this
      chat; to talk to the cardholder again, address them as
      `Customer:<uuid>`, which opens a new chat.
    example: false
  verificationRequired:
    type: boolean
    description: >-
      Whether the cardholder still has to prove they are present before the
      agent can reach their account. Present on every response, true or
      false, so a client reads a field rather than an absence. When true,
      `destinationMasked` and `alreadySent` are present, and the cardholder
      completes verification by sending the code as an ordinary message. A
      verification that is outstanding, or one taken away because a message
      arrived without a live session token, is never reported as a `401`: on
      this surface a `401` means the platform credential is wrong, or the
      session token presented is malformed.


      Read this field rather than `verificationStatus`. A chat whose
      verification has aged past the session lifetime reports
      `verificationStatus: VERIFIED` and `verificationRequired: true` at the
      same time, and that combination is the truthful one: the column records
      that a code was once answered, and this field records whether the agent
      can act on the account now.


      It describes the chat as of the moment the turn started, so the one turn
      in which the cardholder sent their code reports
      `verificationRequired: true` and carries `sessionToken` as well. Decide
      that you hold a session by the presence of `sessionToken`, never by this
      field going false.
    example: true
  id:
    type: string
    description: >-
      Id of the cardholder's recorded message. Present only when a turn ran,
      so absent on an opening or a resume.
    example: CareMessage:019542f5-b3e7-1d02-0000-000000000032
  displayMessage:
    type: string
    description: >-
      The redacted echo of what the cardholder typed, and **the string your
      app must render in the transcript**. Grid masks card numbers and other
      sensitive digit strings here, so rendering your own copy of the input
      instead puts a PAN the cardholder pasted back on their screen and into
      your logs. Present only when a turn ran.
    example: My card [redacted card number ending 1111] was declined
  reply:
    type: string
    description: >-
      What the agent said on this call, to render as the assistant's message.
      Present whenever the agent said something: its answer when a turn ran,
      or its opening line on the call that opened the chat. Absent on a
      resume. An opening needs no `Idempotency-Key`, consumes none and bills
      nothing, even though it carries a `reply`. When verification is
      outstanding the agent's own sentence asks for the code, and when a code
      the cardholder sent did not match, this is where they are told so.
    example: I can help with that. To look at your account I've texted you a code. What does it say?
  replayed:
    type: boolean
    description: >-
      Whether this answer came from the record of an earlier call under the
      same `Idempotency-Key` rather than from a turn run now. Present only
      when a turn ran. There is no route that reads a transcript, so a retry
      under the original key is the only way to recover a reply that was
      produced but never delivered. A replay never carries a `sessionToken`,
      even if the original response did; if that response was lost, the
      cardholder's next message without a token verifies them again.
    example: false
  destinationMasked:
    type: string
    description: >-
      The masked phone number the code was sent to, for a UI to show as "we
      texted ...". Present whenever `verificationRequired` is true. The
      destination is the number already on file for the cardholder and cannot
      be nominated by the caller.
    example: '***0001'
  alreadySent:
    type: boolean
    description: >-
      Whether a code was already outstanding, so this call sent no new SMS.
      Present whenever `verificationRequired` is true. It reads against the
      call you made: on an opening, true means some earlier call left a code
      outstanding; on a message, true means an earlier message already sent
      one. Say "we already texted you" rather than implying a fresh send.
    example: false
  codeLength:
    type: integer
    description: >-
      Number of digits in the code, read from the verification service's own
      configuration. Absent when it could not be read — leave the input
      unbounded in that case rather than guessing, since a guess that
      disagrees with the service makes every correct code look like a typo.
    example: 6
  sessionToken:
    type: string
    description: >-
      The session token for this chat, present only on the turn in which the
      cardholder verified themselves, and absent on every other turn.


      The cardholder completes verification by sending the SMS code as an
      ordinary message. The agent checks it with the SMS provider, and the
      chat comes out of that turn able to reach the account. This field is
      how the partner is handed the credential that turn earned, and it is the
      only place a session token is ever issued. A later message sent without
      it takes the verification away again and asks the cardholder for a new
      code.


      Send it as the `X-Ls-Care-Session` header from the next call onwards.
      It is returned once and never re-readable, there is no revocation, and
      it is bound to this platform, this chat and this cardholder. Never log
      it, never put it in a URL, and never store it past `expiresAt`.


      One session is issued per verification rather than per message, so an
      ordinary turn on a chat that is already verified carries no
      `sessionToken`. The one you are already holding is still the right one.


      A replay under the same `Idempotency-Key` returns the recorded reply
      but never a `sessionToken`, even if the original response carried one.
      If the response carrying the token was lost, send the cardholder's next
      message without a token: the verification is cancelled, a new code is
      sent, and the agent asks for it.
    example: eyJwbGF0Zm9ybV9pZCI6IjAxOTU0MmY1LWIzZTctMWQwMi0wMDAwLTAwMDAwMDAwMDAwMSJ9.aGVsbG8.c2lnbmF0dXJl
  expiresAt:
    type: string
    format: date-time
    description: >-
      ISO 8601 timestamp, in UTC, after which the `sessionToken` beside it no
      longer counts as a session: a message carrying it past this time is
      treated as carrying none, and the cardholder is asked to verify again. Present exactly when
      `sessionToken` is present. Read it rather than assuming a duration.
    example: '2026-09-12T14:25:00Z'
