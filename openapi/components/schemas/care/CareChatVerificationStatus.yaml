type: string
enum:
  - PENDING
  - SENT
  - VERIFIED
  - TRUSTED
  - FAILED
description: |
  Where the cardholder's proof of presence stands on this chat, as of the
  moment the call was received.

  **This status alone does not say whether the agent can reach the account.**
  A chat reaches it only while it is in `VERIFIED` or `TRUSTED` *and* the
  verification behind that status is newer than the session lifetime, fifteen
  minutes in the default deployment. Once it ages past that window the status
  still reads `VERIFIED`, the chat no longer reaches the account, the
  `X-Ls-Care-Session` header stops being required, and the next message sends
  a fresh code and has the agent ask for it. The field that answers "can the
  agent act now" is `verificationRequired` on the message response, so branch
  on that and treat this status as a record of what has happened rather than
  of what is permitted.

  This field reports the chat as it was when the turn started. The agent can
  verify a cardholder during a turn, so a chat that was verified by the turn
  you just made still reads `SENT` in that response and `VERIFIED` on the next
  call.

  | Status | Description |
  |--------|-------------|
  | `PENDING` | No code has been sent on this chat yet. This is where every new chat starts. |
  | `SENT` | A code has been sent to the cardholder and is outstanding. |
  | `VERIFIED` | The cardholder sent the code as a message and the agent confirmed it. Account-reaching tools are available for as long as that answer is newer than the session lifetime, and the session token was issued on the message response to that turn. |
  | `TRUSTED` | The cardholder is treated as present without an SMS code on this chat. Reserved for channels Grid can already attribute; a partner chat does not start here. Bounded by the same freshness window as `VERIFIED`. |
  | `FAILED` | The last code was answered incorrectly or expired. The cardholder can send the code again, or ask the agent for a new one. |
