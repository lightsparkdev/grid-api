type: object
description: >-
  One document to supply. A single file fills it. The values in
  `acceptedDocumentTypes` are alternatives for that one file, not a list of
  files.
required:
  - requirementId
  - acceptedDocumentTypes
properties:
  requirementId:
    $ref: ./PaymentDocumentRequirementId.yaml
    description: >-
      Identifies this requirement. When a quote request supplies no document
      for it, `400 DOCUMENTS_REQUIRED` lists this value in
      `details.missingRequirements`.
  acceptedDocumentTypes:
    type: array
    minItems: 1
    description: >-
      The document types that fill this requirement. Upload one file and
      declare any one of these types as its `documentType`.
    items:
      $ref: ./PaymentDocumentType.yaml
    example:
      - PURCHASE_ORDER
      - DELIVERY_SLIP
