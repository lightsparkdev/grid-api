type: object
description: The supporting documents that one purpose of payment requires.
required:
  - purposeOfPayment
  - requiredDocuments
  - serviceCategoryRequired
properties:
  purposeOfPayment:
    $ref: ../quotes/PurposeOfPayment.yaml
    description: >-
      The purpose of payment these requirements apply to, as sent in
      `purposeOfPayment` on `POST /quotes`.
  requiredDocuments:
    type: array
    minItems: 1
    description: >-
      The documents this purpose requires. Upload exactly one file for each
      entry, then pass all of their IDs in `documentIds` on `POST /quotes`.
      There are never more entries than `maxDocuments`.
    items:
      $ref: ./DocumentRequirement.yaml
  serviceCategoryRequired:
    type: boolean
    description: >-
      Whether a quote request with this purpose must also include
      `serviceCategory`.
    example: true
