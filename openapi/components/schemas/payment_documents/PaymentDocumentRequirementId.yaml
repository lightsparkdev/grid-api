type: string
description: >-
  Identifies one required document within a purpose's requirements. It is
  separate from `PaymentDocumentType`. The requirement ID names the document
  to supply, and the document type names what a file is. The two differ where
  a requirement accepts alternatives. For example, a file declared as either
  `PURCHASE_ORDER` or `DELIVERY_SLIP` fills the `SUPPORTING_PROOF`
  requirement.


  Grid may add values as requirements change. Treat an unrecognized value as a
  requirement you cannot display yet, not as an error.
enum:
  - PURCHASE_ORDER
  - LOGISTICS_BILL
  - CUSTOMS_DECLARATION
  - COMMERCIAL_AGREEMENT
  - CONTRACT
  - INVOICE
  - SUPPORTING_PROOF
  - BILL_OF_LADING
  - CONTRACT_OR_INVOICE
  - FLIGHT_TICKET
  - TRAVEL_DOCUMENT
  - HOTEL_BOOKING_CONFIRMATION
example: SUPPORTING_PROOF
