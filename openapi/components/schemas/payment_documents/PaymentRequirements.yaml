type: object
description: >-
  Supporting documents that payouts to this account require, by purpose of
  payment. Present only when payouts to the account need supporting
  documents, which applies to China B2B CNY payouts. Upload the documents
  for your `purposeOfPayment` with `POST /payment-documents`, then pass their
  IDs in `documentIds` on `POST /quotes`.
required:
  - maxDocuments
  - maxDocumentSizeBytes
  - acceptedContentTypes
  - purposes
properties:
  maxDocuments:
    type: integer
    description: >-
      The most documents a single quote accepts. It never exceeds the number
      of `documentIds` that `POST /quotes` accepts, which is 3 today.
    minimum: 1
    example: 3
  maxDocumentSizeBytes:
    type: integer
    description: The largest file `POST /payment-documents` accepts, in bytes
    minimum: 1
    example: 8000000
  acceptedContentTypes:
    type: array
    minItems: 1
    description: >-
      The file formats `POST /payment-documents` accepts. Grid detects the
      format from the file contents.
    items:
      type: string
      enum:
        - application/pdf
        - image/jpeg
        - image/png
    example:
      - application/pdf
      - image/jpeg
      - image/png
  purposes:
    type: array
    minItems: 1
    description: >-
      One entry for each purpose of payment that requires supporting documents
      on payouts to this account.
    items:
      $ref: ./PurposeDocumentRequirements.yaml
