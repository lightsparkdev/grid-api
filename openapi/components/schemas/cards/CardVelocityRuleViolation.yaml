title: Card Velocity Rule Violation
type: object
description: >-
  The velocity rule and evaluated usage recorded on a card transaction's first
  declined decision. This snapshot retains the values used for the decline even
  if the rule is later changed or deleted. It can describe a platform-managed or
  Lightspark-managed rule. It does not grant access to other rules or transactions.
required:
  - ruleId
  - name
  - owner
  - scope
  - metric
  - window
properties:
  ruleId:
    type: string
    description: Identifier of the rule at the time of the decline. The rule may since have been deleted.
    example: CardVelocityRule:019542f5-b3e7-1d02-0000-000000000004
  name:
    type: string
    description: The rule name at the time of the decline.
    example: Daily card spending cap
  owner:
    $ref: ./CardVelocityRuleOwner.yaml
    description: Who configured the rule.
    example: LIGHTSPARK
  scope:
    $ref: ./CardVelocityRuleScope.yaml
    description: The scope the rule applied at.
    example: GLOBAL
  targetId:
    type: string
    format: uuid
    description: UUID of the platform or card the rule targets. Absent for a global rule.
    example: 019542f5-b3e7-1d02-0000-000000000010
  program:
    $ref: ./CardVelocityRuleProgram.yaml
    description: The card program restriction, if any.
    example: RETAIL
  cardholderCountry:
    type: string
    description: Two-letter ISO 3166-1 alpha-2 cardholder address country restriction, if any.
    example: US
  metric:
    $ref: ./CardVelocityMetric.yaml
  window:
    $ref: ./CardVelocityWindow.yaml
  windowSeconds:
    type: integer
    description: Duration of a rolling window in seconds. Absent for other windows.
    example: 600
  maxCount:
    type: integer
    description: The configured count cap. Zero blocks applicable authorizations; absent means uncapped.
    example: 5
  maxAmount:
    type: integer
    format: int64
    description: The configured amount cap in minor currency units. Zero blocks applicable authorizations; absent means uncapped.
    example: 10000
  currency:
    type: string
    description: Currency code for the amount cap and evaluated amount. Absent on count-only rules.
    example: USD
  observedCount:
    type: integer
    description: >-
      The evaluated count including the declined request. ATTEMPTS counts stop at
      maxCount plus one because additional requests do not change the decision.
    example: 6
  observedAmount:
    type: integer
    format: int64
    description: The evaluated amount including the declined request, in minor currency units.
    example: 12000
