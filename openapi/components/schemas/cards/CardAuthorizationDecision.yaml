title: Card Authorization Decision
type: object
required:
  - decision
description: >-
  The body your `webhookEndpoint` returns with HTTP `200` for a
  `CARD_AUTHORIZATION.REQUEST`.
properties:
  decision:
    $ref: ./CardAuthorizationDecisionType.yaml
  declineReason:
    $ref: ./CardAuthorizationDeclineReason.yaml
    description: >-
      Why you declined. Used only when `decision` is `DECLINE`. When you
      omit it, Grid sends the card network a generic decline.
