type: object
required:
  - cardholderId
  - form
  - fundingSources
properties:
  cardholderId:
    type: string
    description: >-
      The id of the `Customer` to issue the card to. The customer must have
      KYC status `APPROVED`; otherwise the request is rejected with
      `CARDHOLDER_KYC_NOT_APPROVED`.
    example: Customer:019542f5-b3e7-1d02-0000-000000000001
  platformCardId:
    type: string
    description: >-
      Platform-specific card identifier. Always generated by the server; any
      value supplied in the request is ignored.
    example: card-emp-001
  threeDSecurePassword:
    type: string
    description: >-
      Optional static password used as the card's 3-D Secure factor. Only
      accepted for card programs whose issuer supports a static-password
      factor (EU cards today); supplying it for a program that does not is
      rejected with `INVALID_INPUT`. When omitted, one is generated on the
      cardholder's behalf. Grid does not retain the value: it is forwarded to
      the issuer and discarded, so it cannot be read back afterwards.
    example: AbCd1234EfGh5678
  form:
    $ref: ./CardForm.yaml
  fundingSources:
    type: array
    description: >-
      Internal account ids to bind as funding sources, in priority order.
      The first entry is tried first by Authorization Decisioning. Every
      card must be bound to at least one source, and every source must
      belong to the cardholder and be denominated in a card-eligible
      currency; otherwise the request is rejected with
      `FUNDING_SOURCE_INELIGIBLE`.
    minItems: 1
    items:
      type: string
    example:
      - InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  maxSpendPerTransaction:
    type: integer
    format: int64
    minimum: 1
    maximum: 9007199254740991
    description: >-
      Largest amount a single transaction may authorize, in the smallest unit
      of the card's currency. Omit for no card-level cap. When the platform
      config also sets `cardConfigs.maxSpendPerTransaction`, the lower value
      applies. Enforced only for card programs where Grid makes the
      authorization decision.
    example: 5000
  maxSpendPerDay:
    type: integer
    format: int64
    minimum: 1
    maximum: 9007199254740991
    description: >-
      Cumulative new spend allowed in one UTC day, which resets at 00:00 UTC,
      in the smallest unit of the card's currency. Omit for no card-level cap.
      When the platform config also sets `cardConfigs.maxSpendPerDay`, the lower
      value applies; refunds and reversals do not restore capacity. Enforced
      only for card programs where Grid makes the authorization decision.
    example: 25000
  maxTransactionsPerDay:
    type: integer
    format: int32
    minimum: 1
    maximum: 2147483647
    description: >-
      Optional card-specific cap on the number of transactions the card may
      authorize during one UTC calendar day. Omit this field for no
      card-specific daily transaction cap. When the platform config also
      supplies `cardConfigs.maxTransactionsPerDay`, Grid enforces the lower of
      the two values. The window resets at 00:00 UTC. Each approved
      authorization counts once; refunds, reversals, and authorization
      expiries do not restore capacity during the day. Supported only for
      card programs whose authorization decisions are made by Grid.
    example: 20
