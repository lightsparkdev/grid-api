type: object
required:
  - customerId
  - form
  - fundingSource
properties:
  customerId:
    type: string
    description: >-
      The id of the `Customer` to issue the card to. The customer must have
      KYC status `APPROVED`; otherwise the request is rejected with
      `CARDHOLDER_KYC_NOT_APPROVED`.
    example: Customer:019542f5-b3e7-1d02-0000-000000000001
  platformCardId:
    type: string
    description: >-
      Platform-specific card identifier. Always generated by the server; any
      value supplied in the request is ignored.
    example: card-emp-001
  threeDSecurePassword:
    type: string
    description: >-
      Static password used as the card's 3-D Secure factor. Required when the
      first funding-source internal account's
      `cardCapabilities.supports3dSecurePassword` is true; omitting it or
      supplying an empty or whitespace-only string is rejected with
      `INVALID_INPUT`. When the capability is false, supplying this field is
      rejected with `INVALID_INPUT` because cards in that program have no
      static-password factor. Grid does not retain the value: it is forwarded
      to the issuer and discarded, so it cannot be read back afterwards; a
      cardholder who forgets it must set a new one through `PATCH /cards/{id}`.
    example: AbCd1234EfGh5678
  form:
    $ref: ./CardForm.yaml
  fundingSource:
    type: string
    description: >-
      Internal account id that funds this card. The account must belong to the
      customer and be denominated in a card-eligible currency; otherwise the
      request is rejected with `FUNDING_SOURCE_INELIGIBLE`.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  maxSpendPerTransaction:
    type: integer
    format: int64
    minimum: 1
    maximum: 9007199254740991
    description: >-
      The most this card can spend on a single transaction, in the smallest
      unit of its currency (cents for USD). Omit the field to set no limit. If
      your platform config also sets `cardConfigs.maxSpendPerTransaction`, the
      lower of the two applies. A transaction for exactly whichever limit
      applies is allowed. You can only send this when the funding-source
      internal account's `cardCapabilities.supportsSpendLimits` is true.
    example: 5000
  maxSpendPerDay:
    type: integer
    format: int64
    minimum: 1
    maximum: 9007199254740991
    description: >-
      Optional card-specific cap on cumulative new spend during one UTC
      calendar day, in the smallest unit of the card currency derived from its
      funding source. Omit this field for no card-specific daily cap. When the
      platform config also supplies `cardConfigs.maxSpendPerDay`, Grid enforces
      the lower of the two values. The window resets at 00:00 UTC, and refunds,
      reversals, and authorization expiries do not restore capacity during the
      day. Accepted only when the funding-source internal account's
      `cardCapabilities.supportsSpendLimits` is true. Spend exactly equal to
      the effective limit is allowed.
    example: 25000
  maxTransactionsPerDay:
    type: integer
    format: int32
    minimum: 1
    maximum: 2147483647
    description: >-
      Optional card-specific cap on the number of transactions the card may
      authorize during one UTC calendar day. Omit this field for no
      card-specific daily transaction cap. When the platform config also
      supplies `cardConfigs.maxTransactionsPerDay`, Grid enforces the lower of
      the two values. The window resets at 00:00 UTC. Each approved
      authorization counts once; refunds, reversals, and authorization
      expiries do not restore capacity during the day. Accepted only when the
      funding-source internal account's
      `cardCapabilities.supportsTransactionCountLimit` is true.
    example: 20
