title: Card Authorization Response
type: object
required:
  - decision
description: >-
  The body your authorization endpoint returns with HTTP `200`.
properties:
  decision:
    $ref: ./CardAuthorizationDecision.yaml
  declineReason:
    $ref: ./CardAuthorizationDeclineReason.yaml
    description: >-
      Why you declined. Used only when `decision` is `DECLINE`. When you
      omit it, Grid sends the card network a generic decline.
