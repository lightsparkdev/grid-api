type: string
enum:
  - NOT_SET
  - OK
  - BLOCKED
example: OK
description: |
  State of the card's PIN. On the Card resource, this is the last known status
  and is present whenever PIN management is supported. An absent value means
  PIN management is unavailable for this card; it does not mean `NOT_SET`.
  Use `GET /cards/{id}` to retrieve `pinStatus`.

  | Status | Description |
  |--------|-------------|
  | `NOT_SET` | No PIN has been set on the card. PIN verification is not enabled. Set one with `POST /cards/{id}/set-pin` or the hosted form returned by `GET /cards/{id}/set-pin-url`. |
  | `OK` | A PIN is set and usable. |
  | `BLOCKED` | The PIN was entered incorrectly three consecutive times and is refused until cleared with `POST /cards/{id}/pin/unblock`, or replaced with `POST /cards/{id}/set-pin`. |
