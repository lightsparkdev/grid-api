title: Card Real-Time Authorization
type: object
description: >-
  Real-time authorization settings. While set, Grid sends a
  `CARD_AUTHORIZATION.REQUEST` to your `webhookEndpoint` for each card
  authorization that Grid's own checks approve, and your response decides
  whether it proceeds. Your endpoint must answer within 1.5 seconds.
properties:
  timeoutBehavior:
    $ref: ./CardAuthorizationTimeoutBehavior.yaml
    description: >-
      What Grid answers when your `webhookEndpoint` does not return a valid
      decision in time. Defaults to `DECLINE` when omitted from an update.
      Always returned when reading the config.
