title: Card Transaction
type: object
required:
  - type
  - id
  - status
  - direction
  - merchant
  - authorizedAmount
  - accountId
  - customerId
  - platformCustomerId
  - authorizedAt
  - createdAt
  - updatedAt
description: >-
  One row per cardholder-visible card transaction. A purchase row rolls its
  clearings up into `settledAmount`; a merchant return is its own dated
  `CREDIT` row linked back to the purchase via `originalTransactionId` rather
  than a rollup on the parent, so statements can list purchases and refunds
  as separate dated lines. Delivered whole as the `data` payload of every
  `CARD_TRANSACTION.*` webhook, and returned as the `CARD` variant of
  `Transaction` from `GET /transactions`.
properties:
  type:
    type: string
    enum:
      - CARD
    description: Discriminator identifying this transaction as a card transaction in the `Transaction` list.
  id:
    type: string
    description: System-generated unique card transaction identifier
    example: Transaction:019542f5-b3e7-1d02-0000-000000000100
  cardId:
    type: string
    description: The id of the `Card` this transaction was made on.
    example: Card:019542f5-b3e7-1d02-0000-000000000010
  customerId:
    type: string
    description: System ID of the customer (cardholder) this transaction belongs to.
    example: Customer:019542f5-b3e7-1d02-0000-000000000001
  platformCustomerId:
    type: string
    description: Platform-specific ID of the customer (cardholder) this transaction belongs to.
    example: 18d3e5f7b4a9c2
  issuerTransactionToken:
    type: string
    description: >-
      Opaque identifier for the transaction on the underlying issuer. Used to
      cross-reference Grid records against issuer dashboards and webhooks.
    example: lithic_txn_b81c2a4f
  status:
    $ref: ./CardTransactionStatus.yaml
  cardDeclinedReason:
    $ref: ./CardDeclinedReason.yaml
    description: Present only when `status` is `DECLINED`.
    example: INSUFFICIENT_FUNDS
  direction:
    $ref: ../transactions/TransactionDirection.yaml
    description: >-
      A purchase is a `DEBIT`. A merchant refund is a `CREDIT` with the
      credited value in `settledAmount`; when the refund returns against a
      known purchase, `originalTransactionId` identifies it.
    example: DEBIT
  originalTransactionId:
    type: string
    description: >-
      On a refund row (`direction: CREDIT`), the id of the purchase this
      return credits back against. Absent on purchases and on standalone
      credits with no matching purchase.
    example: Transaction:019542f5-b3e7-1d02-0000-000000000099
  description:
    type: string
    description: >-
      The merchant descriptor, repeated from `merchant.descriptor` so a
      transaction list reads without expanding each card row. Unlike
      `description` on other transaction types, this is set by Grid from the
      card network's descriptor, not supplied by the platform.
    example: BLUE BOTTLE COFFEE SF
  merchant:
    $ref: ./CardMerchant.yaml
  authorizedAmount:
    $ref: ../common/CurrencyAmount.yaml
  settledAmount:
    $ref: ../common/CurrencyAmount.yaml
  refundedAmount:
    $ref: ../common/CurrencyAmount.yaml
  fees:
    type: array
    description: >-
      Fees charged on this transaction, one entry per type and collector.
      Empty when the transaction carries no fees. Older transactions may omit
      the field, which means no fees. A `DEBIT_CARD_FOREIGN_TRANSACTION` fee
      applies when the merchant's country differs from the country the card
      was issued in. Grid's fee has `collector: GRID`. Your platform's markup
      on it, when you configure one, is a separate entry with
      `collector: PLATFORM`. Grid reserves both against the funding source at
      authorization, but the entries appear only once the transaction clears
      and `settledAmount` is present, so an `AUTHORIZED` row has none. Each
      amount is its own rate applied to the cleared amount.
      `authorizedAmount` never includes a fee. On a `CREDIT` row, each fee is
      its rate applied to that credit's amount and is what was returned to
      the cardholder. A full return refunds the full fee, and a partial
      return refunds it proportionally. Every foreign return refunds the
      markup, whether or not the purchase it returns is known. Grid fronts
      that refund and bills it to your platform in arrears on its monthly
      Grid invoice.
      The `CARD_TRANSACTION.SETTLED` delivery can precede the fee entries;
      read the transaction to get its fees.
    items:
      $ref: ./CardTransactionFee.yaml
  accountId:
    type: string
    description: >-
      Internal account id that funded this transaction (the funding source
      selected by Authorization Decisioning at auth time).
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  authorizedAt:
    type: string
    format: date-time
    description: When the authorization was approved or declined.
    example: '2026-05-08T14:30:00Z'
  createdAt:
    type: string
    format: date-time
    description: Creation timestamp (same as `authorizedAt` for card transactions).
    example: '2026-05-08T14:30:00Z'
  updatedAt:
    type: string
    format: date-time
    description: Last update timestamp.
    example: '2026-05-08T15:42:11Z'
