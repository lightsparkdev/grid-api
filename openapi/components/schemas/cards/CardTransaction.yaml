title: Card Transaction
type: object
required:
  - type
  - id
  - status
  - direction
  - merchant
  - authorizedAmount
  - accountId
  - customerId
  - platformCustomerId
  - authorizedAt
  - createdAt
  - updatedAt
description: >-
  One row per cardholder-visible card transaction. A purchase row rolls its
  clearings up into `settledAmount`; a merchant return is its own dated
  `CREDIT` row linked back to the purchase via `originalTransactionId` rather
  than a rollup on the parent, so statements can list purchases and refunds
  as separate dated lines. Delivered as the payload of the generic transaction
  webhook stream (extends the Transaction model with a card
  destination type) on every transition.
properties:
  type:
    type: string
    enum:
      - CARD
    description: Discriminator identifying this transaction as a card transaction in the `Transaction` list.
  id:
    type: string
    description: System-generated unique card transaction identifier
    readOnly: true
    example: Transaction:019542f5-b3e7-1d02-0000-000000000100
  cardId:
    type: string
    description: The id of the `Card` this transaction was made on.
    example: Card:019542f5-b3e7-1d02-0000-000000000010
  customerId:
    type: string
    description: System ID of the customer (cardholder) this transaction belongs to.
    example: Customer:019542f5-b3e7-1d02-0000-000000000001
  platformCustomerId:
    type: string
    description: Platform-specific ID of the customer (cardholder) this transaction belongs to.
    example: 18d3e5f7b4a9c2
  issuerTransactionToken:
    type: string
    description: >-
      Opaque identifier for the transaction on the underlying issuer. Used to
      cross-reference Grid records against issuer dashboards and webhooks.
    example: lithic_txn_b81c2a4f
    readOnly: true
  status:
    $ref: ./CardTransactionStatus.yaml
  direction:
    $ref: ../transactions/TransactionDirection.yaml
    description: >-
      A purchase is a `DEBIT`. A merchant refund is a `CREDIT` with the
      credited value in `settledAmount`; when the refund returns against a
      known purchase, `originalTransactionId` identifies it.
    example: DEBIT
  originalTransactionId:
    type: string
    description: >-
      On a refund row (`direction: CREDIT`), the id of the purchase this
      return credits back against. Absent on purchases and on standalone
      credits with no matching purchase.
    readOnly: true
    example: Transaction:019542f5-b3e7-1d02-0000-000000000099
  merchant:
    $ref: ./CardMerchant.yaml
  authorizedAmount:
    $ref: ../common/CurrencyAmount.yaml
  settledAmount:
    $ref: ../common/CurrencyAmount.yaml
  refundedAmount:
    $ref: ../common/CurrencyAmount.yaml
  accountId:
    type: string
    description: >-
      Internal account id that funded this transaction (the funding source
      selected by Authorization Decisioning at auth time).
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  authorizedAt:
    type: string
    format: date-time
    description: When the auth was approved.
    example: '2026-05-08T14:30:00Z'
  createdAt:
    type: string
    format: date-time
    description: Creation timestamp (same as `authorizedAt` for card transactions).
    readOnly: true
    example: '2026-05-08T14:30:00Z'
  updatedAt:
    type: string
    format: date-time
    description: Last update timestamp.
    readOnly: true
    example: '2026-05-08T15:42:11Z'
