type: object
required:
  - cardTransactionId
  - disposition
description: >-
  Sandbox-only request body for `POST
  /sandbox/cards/{id}/simulate/dispute_close`. Closes the transaction's open
  dispute with a disposition, as the card issuer does when the network
  process ends.
properties:
  cardTransactionId:
    type: string
    description: >-
      The id of the disputed `CardTransaction`; it must have an open dispute.
    example: Transaction:019542f5-b3e7-1d02-0000-000000000100
  disposition:
    type: string
    enum:
      - WON
      - PARTIALLY_WON
      - LOST
      - WITHDRAWN
      - DENIED
    description: The outcome the dispute closes with.
    example: WON
  recoveredAmount:
    type: integer
    format: int64
    description: >-
      For `PARTIALLY_WON` only, how much of the disputed amount the network
      gave back, in the smallest unit of the transaction's currency. Must be
      strictly between 0 and the disputed amount; defaults to half.
    exclusiveMinimum: 0
    example: 400
