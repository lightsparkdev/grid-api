type: object
required:
  - cardTransactionId
description: >-
  Sandbox-only request body for `POST
  /sandbox/cards/{id}/simulate/dispute_open`. Opens a dispute against a
  settled `CardTransaction`, as the card issuer does when a cardholder files
  a claim.
properties:
  cardTransactionId:
    type: string
    description: >-
      The id of the settled `CardTransaction` to dispute. Must have at least
      one settled clearing and no dispute already open.
    example: Transaction:019542f5-b3e7-1d02-0000-000000000100
  amount:
    type: integer
    format: int64
    description: >-
      The disputed amount in the smallest unit of the transaction's currency.
      Defaults to the settled amount; must not exceed it.
    exclusiveMinimum: 0
    example: 1500
  reason:
    type: string
    description: Free-text reason recorded on the opening event.
    example: Merchandise not received
