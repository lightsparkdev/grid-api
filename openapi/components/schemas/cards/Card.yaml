type: object
required:
  - id
  - customerId
  - state
  - form
  - fundingSource
  - maxSpendPerTransaction
  - maxSpendPerDay
  - maxTransactionsPerDay
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: System-generated unique card identifier
    example: Card:019542f5-b3e7-1d02-0000-000000000010
  customerId:
    type: string
    description: The id of the `Customer` who holds this card.
    example: Customer:019542f5-b3e7-1d02-0000-000000000001
  platformCardId:
    type: string
    description: >-
      Platform-specific card identifier generated by the server.
    example: card-emp-001
  state:
    $ref: ./CardState.yaml
  stateReason:
    $ref: ./CardStateReason.yaml
    description: >-
      Reason associated with the current `state`. Present when the card is
      `CLOSED` or when provisioning was rejected; absent otherwise.
  brand:
    $ref: ./CardBrand.yaml
  form:
    $ref: ./CardForm.yaml
  last4:
    type: string
    description: Last four digits of the card PAN.
    example: '4242'
  expMonth:
    type: integer
    minimum: 1
    maximum: 12
    description: Card expiration month (1–12).
    example: 12
  expYear:
    type: integer
    description: Card expiration year (four digits).
    example: 2029
  fundingSource:
    type: string
    description: Internal account id that funds this card.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  maxSpendPerTransaction:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      Largest amount one transaction may authorize, in the smallest unit of
      the card's currency. Null means no card-level cap. When the platform
      config also sets `cardConfigs.maxSpendPerTransaction`, the lower value
      applies. Enforced only for card programs where Grid makes the
      authorization decision.
    example: 5000
  maxSpendPerDay:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      Cumulative new spend allowed in one UTC day, which resets at 00:00 UTC,
      in the smallest unit of the card's currency. Null means no card-level
      cap. When the platform config also sets `cardConfigs.maxSpendPerDay`, the
      lower value applies; refunds and reversals do not restore capacity.
      Enforced only for card programs where Grid makes the authorization
      decision.
    example: 25000
  maxTransactionsPerDay:
    anyOf:
      - type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
      - type: 'null'
    description: >-
      Card-specific cap on the number of transactions the card may authorize
      during one UTC calendar day. The window resets at 00:00 UTC. Null means
      the card has no card-specific daily transaction cap. When the platform
      config also supplies `cardConfigs.maxTransactionsPerDay`, Grid enforces
      the lower of the two values without replacing this configured value.
      Each approved authorization counts once for the day it was authorized;
      refunds, reversals, and authorization expiries do not restore capacity
      during the day. A transaction that brings the day's count exactly to the
      effective limit is allowed.
    example: 20
  currency:
    type: string
    description: >-
      Currency the card transacts in (ISO 4217 for fiat, tickers for crypto).
      Derived from the funding source at issue time.
    example: USD
  processorRef:
    type: string
    description: >-
      Opaque processor-side reference for the card (e.g. the Lithic card token).
      Useful for cross-referencing in the processor's dashboards; not used for
      any Grid request routing.
    example: card_b81c2a4f
  issuerRef:
    type: string
    description: >-
      Opaque identifier for the card on the issuer of record (e.g. the Lead Bank
      account/card identifier). Useful for cross-referencing in issuer
      dashboards; not used for any Grid request routing.
    example: lead_card_7a1b9c3d
  createdAt:
    type: string
    format: date-time
    description: Creation timestamp
    example: '2026-05-08T14:10:00Z'
  updatedAt:
    type: string
    format: date-time
    description: Last update timestamp
    example: '2026-05-08T14:11:00Z'
