type: object
required:
  - id
  - customerId
  - status
  - form
  - fundingSource
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: System-generated unique card identifier
    example: Card:019542f5-b3e7-1d02-0000-000000000010
  customerId:
    type: string
    description: The id of the `Customer` who holds this card.
    example: Customer:019542f5-b3e7-1d02-0000-000000000001
  platformCardId:
    type: string
    description: >-
      Platform-specific card identifier generated by the server.
    example: card-emp-001
  status:
    $ref: ./CardStatus.yaml
  statusReason:
    $ref: ./CardStatusReason.yaml
    description: >-
      Reason associated with the current `status`. Present when the card is
      `PENDING_AUTH`, `CLOSED`, or when provisioning was rejected; absent otherwise.
  brand:
    $ref: ./CardBrand.yaml
  form:
    $ref: ./CardForm.yaml
  pinStatus:
    $ref: ./CardPinStatus.yaml
  pinUnblockAvailableAt:
    type: string
    format: date-time
    readOnly: true
    description: >-
      Earliest time another PIN unblock attempt is allowed. Absent until the
      unblock allowance is used. Changing the PIN does not reset this time.
    example: '2026-10-15T15:00:00Z'
  last4:
    type: string
    description: Last four digits of the card PAN.
    example: '4242'
  expMonth:
    type: integer
    minimum: 1
    maximum: 12
    description: Card expiration month (1–12).
    example: 12
  expYear:
    type: integer
    description: Card expiration year (four digits).
    example: 2029
  fundingSource:
    type: string
    description: Internal account id that funds this card.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  cardCapabilities:
    $ref: ./CardCapabilities.yaml
    description: >-
      Actions supported for this card by the issuer selected at issuance.
      Present for cards whose program has been resolved; absent otherwise.
      These capabilities are fixed at issuance for the card's lifetime.
  maxNetworkRiskScore:
    anyOf:
      - type: integer
        minimum: 0
        maximum: 999
      - type: 'null'
    description: >-
      Maximum normalized network risk score allowed for real-time card
      authorizations. Scores range from 0 (lowest risk) to 999 (highest risk).
      Visa scores are normalized by multiplying the raw 0–99 score by 10.
      Scores equal to the ceiling are allowed. Authorizations without a
      score are also allowed. The lowest configured card or platform ceiling
      applies.
      Null means no card-specific ceiling. Platform controls still apply.
    example: 700
  allowedMccs:
    type: array
    minItems: 1
    description: >-
      Merchant category codes the card may spend at. Absent when the card may
      spend at any category not blocked.
    items:
      type: string
      pattern: ^[0-9]{4}$
    example:
      - '5411'
  blockedMccs:
    type: array
    description: >-
      Merchant category codes the card declines, with
      `cardDeclinedReason: BLOCKED`. Absent when the card blocks no category of
      its own. A card issued for an agent also declines Grid's default agent
      categories unless `defaultMccBlocksLifted` is true.
    items:
      type: string
      pattern: ^[0-9]{4}$
    example:
      - '7995'
  agentId:
    type: string
    description: The agent the card was issued for, when there is one.
    example: Agent:019542f5-b3e7-1d02-0000-000000000042
  defaultMccBlocksLifted:
    type: boolean
    description: >-
      Whether the platform lifted Grid's default agent merchant-category blocks
      on this card. Present only for a card issued for an agent.
    example: false
  currency:
    type: string
    description: >-
      Currency the card transacts in, fixed at issuance by its card program.
      USDB-funded cards transact in USD, with funding converted at
      1 USDB = 1 USD. Spending limits use the smallest unit of the card's
      currency (USD cents for USDB-funded cards). Changing the funding source
      does not change the card's currency or spending-limit units.
    example: USD
  processorRef:
    type: string
    description: >-
      Opaque processor-side reference for the card (e.g. the Lithic card token).
      Useful for cross-referencing in the processor's dashboards; not used for
      any Grid request routing.
    example: card_b81c2a4f
  issuerRef:
    type: string
    description: >-
      Opaque identifier for the card on the issuer of record (e.g. the Lead Bank
      account/card identifier). Useful for cross-referencing in issuer
      dashboards; not used for any Grid request routing.
    example: lead_card_7a1b9c3d
  createdAt:
    type: string
    format: date-time
    description: Creation timestamp
    example: '2026-05-08T14:10:00Z'
  updatedAt:
    type: string
    format: date-time
    description: Last update timestamp
    example: '2026-05-08T14:11:00Z'
