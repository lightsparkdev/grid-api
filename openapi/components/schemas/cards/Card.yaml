type: object
required:
  - id
  - customerId
  - status
  - form
  - fundingSource
  - maxSpendPerTransaction
  - maxSpendPerDay
  - maxTransactionsPerDay
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: System-generated unique card identifier
    example: Card:019542f5-b3e7-1d02-0000-000000000010
  customerId:
    type: string
    description: The id of the `Customer` who holds this card.
    example: Customer:019542f5-b3e7-1d02-0000-000000000001
  platformCardId:
    type: string
    description: >-
      Platform-specific card identifier generated by the server.
    example: card-emp-001
  status:
    $ref: ./CardStatus.yaml
  statusReason:
    $ref: ./CardStatusReason.yaml
    description: >-
      Reason associated with the current `status`. Present when the card is
      `CLOSED` or when provisioning was rejected; absent otherwise.
  brand:
    $ref: ./CardBrand.yaml
  form:
    $ref: ./CardForm.yaml
  last4:
    type: string
    description: Last four digits of the card PAN.
    example: '4242'
  expMonth:
    type: integer
    minimum: 1
    maximum: 12
    description: Card expiration month (1–12).
    example: 12
  expYear:
    type: integer
    description: Card expiration year (four digits).
    example: 2029
  fundingSource:
    type: string
    description: Internal account id that funds this card.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  cardCapabilities:
    $ref: ./CardCapabilities.yaml
    description: >-
      Actions supported for this card by the issuer selected at issuance.
      Present for cards whose program has been resolved; absent otherwise.
      These capabilities are fixed at issuance for the card's lifetime.
  maxSpendPerTransaction:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      The most this card can spend on a single transaction, in the smallest
      unit of its `currency` (cents for USD). `null` means the card sets no
      limit of its own. If your platform config also sets
      `cardConfigs.maxSpendPerTransaction` (the platform level
      maxSpendPerTransaction), the lower of the two applies and this value
      stays as you set it.
    example: 5000
  maxSpendPerDay:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      Card-specific cap on cumulative new spend during one UTC calendar day,
      in the smallest unit of the card's `currency`. The window resets at
      00:00 UTC. Null means the card has no card-specific daily cap. When the
      platform config also supplies `cardConfigs.maxSpendPerDay`, Grid enforces
      the lower of the two values without replacing this configured value.
      Refunds, reversals, and authorization expiries do not restore capacity
      during the day. Spend exactly equal to the effective limit is allowed.
    example: 25000
  maxTransactionsPerDay:
    anyOf:
      - type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
      - type: 'null'
    description: >-
      Card-specific cap on the number of transactions the card may authorize
      during one UTC calendar day. The window resets at 00:00 UTC. Null means
      the card has no card-specific daily transaction cap. When the platform
      config also supplies `cardConfigs.maxTransactionsPerDay`, Grid enforces
      the lower of the two values without replacing this configured value.
      Each approved authorization counts once for the day it was authorized;
      refunds, reversals, and authorization expiries do not restore capacity
      during the day. A transaction that brings the day's count exactly to the
      effective limit is allowed.
    example: 20
  currency:
    type: string
    description: >-
      Currency the card transacts in (ISO 4217 for fiat, tickers for crypto).
      Derived from the funding source at issue time.
    example: USD
  processorRef:
    type: string
    description: >-
      Opaque processor-side reference for the card (e.g. the Lithic card token).
      Useful for cross-referencing in the processor's dashboards; not used for
      any Grid request routing.
    example: card_b81c2a4f
  issuerRef:
    type: string
    description: >-
      Opaque identifier for the card on the issuer of record (e.g. the Lead Bank
      account/card identifier). Useful for cross-referencing in issuer
      dashboards; not used for any Grid request routing.
    example: lead_card_7a1b9c3d
  createdAt:
    type: string
    format: date-time
    description: Creation timestamp
    example: '2026-05-08T14:10:00Z'
  updatedAt:
    type: string
    format: date-time
    description: Last update timestamp
    example: '2026-05-08T14:11:00Z'
