type: string
enum:
  - AUTHORIZED
  - DECLINED
  - PARTIALLY_SETTLED
  - SETTLED
  - EXCEPTION
description: |
  Lifecycle status of a card transaction. The status tracks the authorization
  outcome and settlement. A return is reported through `direction` and
  `refundedAmount`, not through a status of its own.

  | Status | Description |
  |--------|-------------|
  | `AUTHORIZED` | The auth has been approved and a hold placed on the funding source; no clearing has arrived yet. |
  | `DECLINED` | The authorization was declined; see `cardDeclinedReason`. Nothing was pulled from the funding source. Terminal. |
  | `PARTIALLY_SETTLED` | At least one clearing has arrived and posted, but more clearings are still expected (split shipments, tips, multi-leg trips). |
  | `SETTLED` | All clearings for the auth have posted and the transaction is closed against the funding source. A `RETURN` received afterwards keeps the transaction `SETTLED` and reports the returned value in `refundedAmount`. |
  | `EXCEPTION` | The transaction settled to the card network, but the pull from the funding source failed. For example, the balance may no longer cover a post-hoc clearing. This is a high-urgency state that needs operator reconciliation. |
