type: object
description: >-
  Update request for `PATCH /cards/{id}`. At least one of `state`,
  `fundingSources`, `maxSpendPerTransaction`, `maxSpendPerDay`, or
  `maxTransactionsPerDay` must be supplied. `state`
  transitions are limited to `ACTIVE ⇄ FROZEN` and
  `ACTIVE | FROZEN → CLOSED`; any other transition returns
  `409 INVALID_STATE_TRANSITION`. `CLOSED` is terminal and irreversible and
  cannot be combined with `fundingSources`, `maxSpendPerTransaction`,
  `maxSpendPerDay`, or `maxTransactionsPerDay`.
  `fundingSources`, when supplied, fully replaces the card's bound
  funding sources — the array order determines the priority Authorization
  Decisioning tries them in.
properties:
  state:
    type: string
    enum:
      - ACTIVE
      - FROZEN
      - CLOSED
    description: >-
      Target state for the card. Permitted transitions are
      `ACTIVE ⇄ FROZEN` and `ACTIVE | FROZEN → CLOSED`. `CLOSED` is
      terminal and irreversible; once closed, the card stays in the
      system for audit and reconciliation but cannot transact again.
    example: FROZEN
  fundingSources:
    type: array
    description: >-
      New ordered list of internal account ids to bind as funding sources.
      Fully replaces the previous binding. Each id must belong to the
      cardholder and be denominated in the card's currency. The list must
      contain at least one source — to stop a card from spending without
      removing all sources, transition it to `FROZEN` instead. Cannot be
      supplied alongside `state: CLOSED`.
    minItems: 1
    items:
      type: string
    example:
      - InternalAccount:019542f5-b3e7-1d02-0000-000000000002
      - InternalAccount:019542f5-b3e7-1d02-0000-000000000003
  maxSpendPerTransaction:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      A new limit on what this card can spend on a single transaction, in the
      smallest unit of its currency (cents for USD). Send a positive integer
      to set the limit, `null` to remove it, or omit the field to leave it
      unchanged. If your platform config also sets
      `cardConfigs.maxSpendPerTransaction`, the lower of the two applies. A
      transaction for exactly whichever limit applies is allowed. You can only
      send this when the card's
      `cardCapabilities.supportsSpendLimits` is true, and not together with
      `state: CLOSED`.
    example: 10000
  maxSpendPerDay:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      Replacement card-specific UTC-calendar-day cap, in the smallest unit of
      the card's currency. Omit this field to leave the current cap unchanged,
      supply null to clear it, or supply a positive integer to set it. When the
      platform config also supplies `cardConfigs.maxSpendPerDay`, Grid enforces
      the lower of the two values. Refunds, reversals, and authorization
      expiries do not restore capacity during the day. Accepted only when the
      card's `cardCapabilities.supportsSpendLimits` is true. Cannot be supplied
      alongside `state: CLOSED`.
    example: 25000
  maxTransactionsPerDay:
    anyOf:
      - type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
      - type: 'null'
    description: >-
      Replacement card-specific cap on the number of transactions the card may
      authorize during one UTC calendar day. Omit this field to leave the
      current cap unchanged, supply null to clear it, or supply a positive
      integer to set it. When the platform config also supplies
      `cardConfigs.maxTransactionsPerDay`, Grid enforces the lower of the two
      values. Refunds, reversals, and authorization expiries do not restore
      capacity during the day. Accepted only when the card's
      `cardCapabilities.supportsTransactionCountLimit` is true. Cannot be
      supplied alongside `state: CLOSED`.
    example: 20
