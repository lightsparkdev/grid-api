type: object
description: >-
  Update request for `PATCH /cards/{id}`. At least one of `state`,
  `fundingSource`, `maxSpendPerTransaction`, `maxSpendPerDay`, or
  `maxTransactionsPerDay` must be supplied. `state`
  transitions are limited to `ACTIVE ⇄ FROZEN` and
  `ACTIVE | FROZEN → CLOSED`; any other transition returns
  `409 INVALID_STATE_TRANSITION`. `CLOSED` is terminal and irreversible and
  cannot be combined with `fundingSource`, `maxSpendPerTransaction`,
  `maxSpendPerDay`, or `maxTransactionsPerDay`.
properties:
  state:
    type: string
    enum:
      - ACTIVE
      - FROZEN
      - CLOSED
    description: >-
      Target state for the card. Permitted transitions are
      `ACTIVE ⇄ FROZEN` and `ACTIVE | FROZEN → CLOSED`. `CLOSED` is
      terminal and irreversible; once closed, the card stays in the
      system for audit and reconciliation but cannot transact again.
    example: FROZEN
  fundingSource:
    type: string
    description: >-
      Replaces the card's funding source. Must belong to the customer and be
      denominated in the card's currency. Cannot be supplied alongside
      `state: CLOSED`. To stop a card from spending, set `state: FROZEN`
      instead.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  maxSpendPerTransaction:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      Replacement cap for one transaction, in the smallest unit of the card's
      currency. Omit to keep the current cap; send null to clear it. When the
      platform config also sets `cardConfigs.maxSpendPerTransaction`, the lower
      value applies. Cannot be supplied alongside `state: CLOSED`.
    example: 10000
  maxSpendPerDay:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      Replacement cap for cumulative new spend in one UTC day, in the smallest
      unit of the card's currency. Omit to keep the current cap; send null to
      clear it. When the platform config also sets `cardConfigs.maxSpendPerDay`,
      the lower value applies. Cannot be supplied alongside `state: CLOSED`.
    example: 25000
