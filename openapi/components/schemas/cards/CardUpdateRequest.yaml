type: object
description: >-
  Update request for `PATCH /cards/{id}`. At least one of `status`,
  `fundingSource`, `maxSpendPerTransaction`, `maxSpendPerDay`,
  `maxTransactionsPerDay`, or `threeDSecurePassword` must be supplied. Supplying `status` also requires
  `substatus` and `reason`, so every card state change carries why it
  happened. `status`
  transitions are limited to `ACTIVE ⇄ FROZEN` and
  `ACTIVE | FROZEN → CLOSED`; any other transition returns
  `409 INVALID_STATE_TRANSITION`. `CLOSED` is terminal and irreversible and
  cannot be combined with `fundingSource`, `maxSpendPerTransaction`,
  `maxSpendPerDay`, or `maxTransactionsPerDay`.
properties:
  status:
    type: string
    enum:
      - ACTIVE
      - FROZEN
      - CLOSED
    description: >-
      Target status for the card. Permitted transitions are
      `ACTIVE ⇄ FROZEN` and `ACTIVE | FROZEN → CLOSED`. `CLOSED` is
      terminal and irreversible; once closed, the card stays in the
      system for audit and reconciliation but cannot transact again.
    example: FROZEN
  substatus:
    type: string
    enum:
      - LOST
      - COMPROMISED
      - DAMAGED
      - END_USER_REQUEST
      - ISSUER_REQUEST
      - NOT_ACTIVE
      - SUSPICIOUS_ACTIVITY
      - INTERNAL_REVIEW
      - EXPIRED
      - UNDELIVERABLE
      - OTHER
    description: >-
      Why the card is moving, in the card issuer's vocabulary. Required
      whenever `status` is supplied, and forwarded to the issuer. Pick
      `OTHER` when none of the named values fit and say why in `reason`.
    example: SUSPICIOUS_ACTIVITY
  reason:
    type: string
    minLength: 1
    description: >-
      A short sentence naming why the card is moving. Required whenever
      `status` is supplied, and recorded against the card so a later reader
      can tell why it changed.
    example: Cardholder reported the card stolen.
  fundingSource:
    type: string
    description: >-
      Replaces the card's funding source. Must belong to the customer and be
      denominated in a currency supported by the card's program, including
      USDB for USD cards. Changing the funding source does not change the
      card's currency or spending-limit units. Cannot be supplied alongside
      `status: CLOSED`. To stop a card from spending, set `status: FROZEN` instead.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  maxSpendPerTransaction:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      A new limit on the largest amount this card can authorize on a single
      transaction, in the smallest unit of its currency (cents for USD). An
      authorization for exactly the limit is allowed. A later clearing can
      still settle above it — a restaurant tip, for example — so this caps the
      authorization, not the final settled amount. Send a positive integer to
      set the limit, `null` to remove it, or omit the field to leave it
      unchanged. If your platform config also sets
      `cardConfigs.maxSpendPerTransaction`, the lower of the two applies. You
      can only send this when the card's
      `cardCapabilities.supportsSpendLimits` is true, and not together with
      `status: CLOSED`.
    example: 10000
  maxSpendPerDay:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      Replacement card-specific UTC-calendar-day cap, in the smallest unit of
      the card's currency. Omit this field to leave the current cap unchanged,
      supply null to clear it, or supply a positive integer to set it. When the
      platform config also supplies `cardConfigs.maxSpendPerDay`, Grid enforces
      the lower of the two values. Refunds, reversals, and authorization
      expiries do not restore capacity during the day. Accepted only when the
      card's `cardCapabilities.supportsSpendLimits` is true. Cannot be supplied
      alongside `status: CLOSED`.
    example: 25000
  maxTransactionsPerDay:
    anyOf:
      - type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
      - type: 'null'
    description: >-
      Replacement card-specific cap on the number of transactions the card may
      authorize during one UTC calendar day. Omit this field to leave the
      current cap unchanged, supply null to clear it, or supply a positive
      integer to set it. When the platform config also supplies
      `cardConfigs.maxTransactionsPerDay`, Grid enforces the lower of the two
      values. Refunds, reversals, and authorization expiries do not restore
      capacity during the day. Accepted only when the card's
      `cardCapabilities.supportsTransactionCountLimit` is true. Cannot be
      supplied alongside `status: CLOSED`.
    example: 20
  threeDSecurePassword:
    type: string
    description: >-
      Sets a new static 3-D Secure password on the card. Send it on its own,
      and only when the card's `cardCapabilities.supports3dSecurePassword` is
      true.
    example: AbCd1234EfGh5678
