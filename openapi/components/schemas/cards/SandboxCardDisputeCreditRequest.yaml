type: object
required:
  - cardTransactionId
  - amount
description: >-
  Sandbox-only request body for the provisional-credit simulators: `POST
  /sandbox/cards/{id}/simulate/dispute_provisional_credit` and `POST
  /sandbox/cards/{id}/simulate/dispute_provisional_credit_reversal`.
properties:
  cardTransactionId:
    type: string
    description: >-
      The id of the disputed `CardTransaction`; it must have an open dispute.
    example: Transaction:019542f5-b3e7-1d02-0000-000000000100
  amount:
    type: integer
    format: int64
    description: >-
      The amount to credit, or to take back, in the smallest unit of the
      transaction's currency. Must not exceed the disputed amount.
    exclusiveMinimum: 0
    example: 1500
