type: object
required:
  - name
  - metric
  - window
properties:
  cardId:
    anyOf:
      - type: string
      - type: 'null'
    description: >-
      Card to restrict. Omit or send null to apply the rule separately to every
      eligible card on your platform, including cards issued later. A
      platform rule does not pool usage across cards.
    example: Card:019542f5-b3e7-1d02-0000-000000000003
  name:
    type: string
    minLength: 1
    maxLength: 255
    description: A descriptive label for this rule. Whitespace-only names are rejected.
    example: Weekly card spending cap
  metric:
    $ref: ./CardVelocityMetric.yaml
  window:
    $ref: ./CardVelocityWindow.yaml
  windowSeconds:
    anyOf:
      - type: integer
        minimum: 1
        maximum: 2678400
      - type: 'null'
    description: >-
      Required for ROLLING and absent or null for other windows. The maximum
      rolling window is 31 days.
    example: 600
  maxCount:
    anyOf:
      - type: integer
        minimum: 0
        maximum: 100000
      - type: 'null'
    description: >-
      Maximum count within the window. Required for ATTEMPTS. Cannot be set
      for AUTHORIZATION. Omit or send null to unset this rule's count cap.
      A matching broader-scope cap is inherited if no count cap remains at
      this scope.
    example: 5
  maxAmount:
    anyOf:
      - type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      Maximum amount in the smallest unit of currency. Supported for APPROVED
      only and requires currency. The amount is holds less releases for
      transactions opened within the window. Releases restore capacity;
      clearing against a hold does not. Omit or send null to unset this rule's
      amount cap. A matching broader-scope cap is inherited if no amount cap
      remains at this scope. At least one of maxCount or maxAmount must be set. A zero cap
      blocks applicable new authorizations, including zero-amount checks.
    example: 50000
  currency:
    anyOf:
      - type: string
        pattern: '^[A-Z]{3}$'
      - type: 'null'
    description: >-
      Currency code for maxAmount. Set both together or leave both absent or
      null. An amount cap applies only to cards in this currency; count caps
      apply regardless of currency.
    example: USD
