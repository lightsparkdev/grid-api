type: object
description: Actions supported by the card program associated with this resource.
required:
  - supportsSpendLimits
  - supportsSpendLimitsAtIssuance
  - supportsTransactionCountLimit
  - supports3dSecurePassword
  - supportsPanReveal
  - supportsDigitalWalletTokenization
properties:
  supportsSpendLimits:
    type: boolean
    description: >-
      Whether a card in this program can have `maxSpendPerTransaction` and
      `maxSpendPerDay` at all. On card programs where the card issuer makes
      authorization decisions, these limits can only be set after issuance
      through `PATCH /cards/{id}`. Check `supportsSpendLimitsAtIssuance` to
      determine whether you can supply them when issuing a card.
    example: true
  supportsSpendLimitsAtIssuance:
    type: boolean
    description: >-
      Whether `maxSpendPerTransaction` and `maxSpendPerDay` may be supplied on
      `POST /cards`. This is true for card programs where Grid makes the
      authorization decision and false for card programs where the card issuer
      makes authorization decisions.
    example: true
  supportsTransactionCountLimit:
    type: boolean
    description: >-
      Whether cards in this program accept `maxTransactionsPerDay`.
    example: true
  supports3dSecurePassword:
    type: boolean
    description: >-
      Whether cards in this program accept a caller-supplied
      `threeDSecurePassword`.
    example: false
  supportsPanReveal:
    type: boolean
    description: >-
      Whether cards in this program can be revealed through
      `POST /cards/{id}/reveal`.
    example: true
  supportsDigitalWalletTokenization:
    type: boolean
    description: >-
      Whether cards in this program can be added to Apple Pay, Google Pay,
      or Samsung Pay from your app through `POST /cards/{id}/tokenize`.
      Manual entry into a wallet works regardless of this flag.
    example: true
