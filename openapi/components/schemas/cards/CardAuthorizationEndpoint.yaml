title: Card Authorization Endpoint
type: object
required:
  - url
description: >-
  The endpoint Grid calls to ask your platform for a real-time decision on
  each card authorization that Grid's own checks approve. It must answer
  within 1.5 seconds.
properties:
  url:
    type: string
    format: uri
    maxLength: 255
    pattern: ^https://
    description: >-
      HTTPS URL that receives `CARD_AUTHORIZATION.REQUEST` requests. It must
      resolve to a public host. It can differ from the `webhookEndpoint` in
      your platform config.
    example: https://api.mycompany.com/grid/card-authorizations
  timeoutBehavior:
    $ref: ./CardAuthorizationTimeoutBehavior.yaml
    description: >-
      What Grid answers when your endpoint does not return a valid decision
      in time. Defaults to `DECLINE` when omitted from an update. Always
      returned when reading the config.
