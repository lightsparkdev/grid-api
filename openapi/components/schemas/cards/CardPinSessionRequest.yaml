type: object
required:
  - targetOrigin
properties:
  targetOrigin:
    type: string
    format: uri
    pattern: '^https://(?:[^\s/?#@:\[\]\\]+|\[[0-9A-Fa-f:.]+\])(?::[0-9]{1,5})?$'
    description: >-
      Canonical HTTPS origin of the page that will host the PIN-entry
      iframe. The iframe is restricted to this origin, so it must match
      the embedding page's origin exactly —
      scheme, host, and optional port; no path, trailing slash, query,
      fragment, or credentials.
    example: https://app.example.com
