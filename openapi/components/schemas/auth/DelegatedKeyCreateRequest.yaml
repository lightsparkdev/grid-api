title: Delegated Key Create Request
type: object
description: >-
  Creates a delegated signing key for a card funding source or an agent.
  Exactly one of `cardId` or `agentId` is required, and exactly one of
  `internalAccountId` or `externalAccountId`. Requests that provide both
  fields of a pair, or neither, return a 400 response.
required:
  - nickname
properties:
  cardId:
    type: string
    description: >-
      The id of the card whose Embedded Wallet funding account will use this
      delegated signing key. Omit when creating a key for an agent.
    example: Card:019542f5-b3e7-1d02-0000-000000000010
  agentId:
    type: string
    description: >-
      The id of the agent that will use this delegated signing key. The agent
      must belong to the customer that owns the Embedded Wallet internal
      account. Omit when creating a key for a card.
    example: Agent:019542f5-b3e7-1d02-0000-000000000042
  internalAccountId:
    type: string
    description: >-
      The id of the Embedded Wallet internal account this key may sign for. For
      a card key, Grid uses the `(cardId, internalAccountId)` pair to find the
      active card funding-source binding. For an agent key, the account must
      belong to the agent's customer. Omit when creating an access key on an
      external account.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  externalAccountId:
    type: string
    description: >-
      The id of a `TEMPO_WALLET` external account whose `providerWallet` is
      `PLATFORM`. Grid creates a Tempo access key that funds the card from
      that wallet. Card keys only; requires `restrictions`.
    example: ExternalAccount:019542f5-b3e7-1d02-0000-000000000031
  restrictions:
    allOf:
      - $ref: ./AccessKeyRestrictions.yaml
    description: >-
      What the access key may spend, and until when. Required with
      `externalAccountId`; rejected otherwise.
  keyAuthorizationSignature:
    type: string
    description: >-
      The wallet root account's signature over the `payloadToSign` of the
      prior `202`, as hex in the network's signature encoding for the root's
      key type (65-byte `r || s || v` for a secp256k1 root). Send it on the
      retry for an access key, with `Request-Id`. Omit it if the root already
      authorized `keyId` on chain itself; Grid then reads the key on chain.
    example: '0x72422cb2a1d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5cf0ca0e4e6572a1d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c5a1d01'
  nickname:
    type: string
    minLength: 1
    maxLength: 256
    description: Human-readable label for the delegated key.
    example: Payments key
