title: EVM Wallet Admin Credential Create Request
allOf:
  - $ref: ./AuthCredentialCreateRequest.yaml
  - $ref: ./AdminCredentialCreateRequestFields.yaml
  - type: object
    required:
      - type
      - publicKey
    properties:
      type:
        type: string
        enum:
          - EVM_WALLET
        description: Discriminator value identifying this as an EVM wallet credential.
      publicKey:
        type: string
        pattern: '^0x(0[23][0-9a-fA-F]{64}|04[0-9a-fA-F]{128})$'
        description: >-
          The secp256k1 public key of the administrator's wallet, `0x`-prefixed
          hex in any letter case: compressed (33 bytes, starting `02` or `03`)
          or uncompressed (65 bytes, starting `04`). It must be the key of a
          wallet with a single private key, not a smart-contract account.
          Grid derives the wallet's address from it and shows the address back
          as the credential's `nickname`. The wallet signs nothing to be added.
        example: '0x024e3b81af9c2234cad09d679ce6035ed1392347ce64ce405f5dcd36228a25de6e'
