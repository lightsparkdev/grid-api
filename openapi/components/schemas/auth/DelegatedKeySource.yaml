type: string
enum:
  - GRID_GENERATED
  - PROVIDER_DELEGATED
description: >-
  Where a delegated key's signing material comes from.


  - `GRID_GENERATED`: A P-256 keypair generated and custodied by Grid for an
  Embedded Wallet internal account.

  - `PROVIDER_DELEGATED`: A delegated share of the cardholder's provider wallet,
  delivered to Grid by the provider when the cardholder delegates the wallet.
example: GRID_GENERATED
