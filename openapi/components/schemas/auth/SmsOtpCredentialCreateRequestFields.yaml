type: object
required:
  - type
properties:
  type:
    type: string
    enum:
      - SMS_OTP
    description: >-
      Discriminator value identifying this as an SMS OTP credential.
  phoneNumber:
    type: string
    pattern: '^\+[1-9]\d{1,14}$'
    description: >-
      New phone number, in strict E.164 format, to verify for a customer phone
      number change. This is how an Embedded Wallet customer starts a phone
      number change. When this value differs from the customer's current
      phone number and the customer already has an `ACTIVE` `SMS_OTP`
      credential, Grid creates a `PENDING` credential for this number and
      sends the one-time password to it. Verify the credential, then apply
      the change with `PATCH /customers/{customerId}`. Any of the customer's
      Embedded Wallet `accountId`s can be used. A different number with no
      `ACTIVE` `SMS_OTP` credential is rejected with `400` `INVALID_INPUT`;
      change the customer phone number with `PATCH /customers/{customerId}`
      instead. A value equal to the current phone number behaves as if the
      field were omitted: the credential is tied to the customer phone number
      on file.
    example: '+14155559876'
