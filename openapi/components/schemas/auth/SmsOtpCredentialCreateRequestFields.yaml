type: object
required:
  - type
properties:
  type:
    type: string
    enum:
      - SMS_OTP
    description: >-
      Discriminator value identifying this as an SMS OTP credential.
  phoneNumber:
    type: string
    pattern: '^\+[1-9]\d{1,14}$'
    description: >-
      A new phone number, in strict E.164 format, to register as a
      replacement credential.
    example: '+14155559876'
