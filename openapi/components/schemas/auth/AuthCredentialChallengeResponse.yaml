title: Auth Credential Challenge Response
description: >-
  Response body for `POST /auth/credentials/{id}/challenge`. Normally an
  `AuthCredentialResponseOneOf` — the re-issued challenge or re-sent OTP.
  When the OTP send's underlying wallet-provider activity is still in
  flight, this is instead a `WalletOperationProcessing` body with
  `status: "PROCESSING"` — re-request the challenge until the send
  settles; the backend also reconciles it to terminal on its own.
anyOf:
  - $ref: ./AuthCredentialResponseOneOf.yaml
  - $ref: ../common/WalletOperationProcessing.yaml
