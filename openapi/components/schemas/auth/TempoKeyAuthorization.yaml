title: Tempo Key Authorization
type: object
description: >-
  The access-key authorization Grid asks the wallet's root account to sign,
  as the network will read it. Decode `unsignedKeyAuthorization` to check
  these fields before signing. It carries limits and an expiry only, with no
  periodic limits and no call scopes. Unless the root authorizes the key on
  chain itself, it rides inline in the first transfer Grid makes with the
  key.
required:
  - chainId
  - keyType
  - keyId
  - expiry
  - limits
  - isAdmin
  - unsignedKeyAuthorization
properties:
  chainId:
    type: integer
    format: int64
    description: Chain id of the Tempo network the key is valid on.
    example: 4217
  keyType:
    type: string
    enum:
      - SECP256K1
    description: Signature type of the access key.
    example: SECP256K1
  keyId:
    type: string
    description: >-
      Address of the access key, in EIP-55 checksum form. Grid generated it
      and holds its private key.
    example: '0xfbE89dD5f773c84ea858EF1d4622d2D58E69e9c9'
  expiry:
    type: integer
    format: int64
    description: Unix time, in seconds, at which the key expires.
    example: 1795229075
  limits:
    type: array
    description: Per-token spending limits over the key's lifetime, in the token's base units.
    items:
      type: object
      required:
        - token
        - amount
      properties:
        token:
          type: string
          description: Address of the token contract, in EIP-55 checksum form.
          example: '0x20c0000000000000000000006a37DA5C996874BE'
        amount:
          type: string
          description: >-
            Limit in the token's base units, as a decimal string because it
            can exceed 64 bits.
          example: '50000000'
  isAdmin:
    type: boolean
    description: >-
      Whether the key may authorize further keys. Always `false`: an access
      key Grid holds can never add keys to the wallet.
    example: false
  unsignedKeyAuthorization:
    type: string
    description: >-
      Hex RLP encoding of the unsigned authorization, the exact bytes whose
      Keccak-256 hash is `payloadToSign`.
    example: '0xf84f82a5a1809...'
