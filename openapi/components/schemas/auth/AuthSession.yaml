title: Authentication Session
description: >-
  An authentication session on an Embedded Wallet internal account.
  Returned from `GET /auth/sessions` (list) and
  `POST /auth/credentials/{id}/verify` (on credential verification) or
  `POST /auth/sessions/{id}/refresh` (on mid-session refresh). Under the
  client-held-key model the client generates and retains the session
  signing key, so session-issuing responses carry no key material. The
  deprecated `encryptedSessionSigningKey` is populated only for legacy
  sessions not yet migrated to that model and is never returned by the
  list endpoint.
allOf:
  - $ref: ./AuthMethod.yaml
  - type: object
    required:
      - id
      - expiresAt
    properties:
      id:
        type: string
        description: >-
          System-generated unique identifier for the session. Pass this
          value to `DELETE /auth/sessions/{id}` to revoke the session
          before `expiresAt`. Overrides the `id` inherited from
          `AuthMethod` so this response identifies the session rather
          than the authenticating credential.
        example: Session:019542f5-b3e7-1d02-0000-000000000003
      encryptedSessionSigningKey:
        type: string
        deprecated: true
        description: >-
          Deprecated. Superseded by the client-held-key model, which is
          now the norm for every credential type: the client generates a
          session keypair before authentication and retains the private
          key, so the server has no key to deliver and this field is
          omitted from session-issuing responses.


          Historically populated only for `OAUTH` and `PASSKEY` sessions,
          where the session signing key was HPKE-sealed to the supplied
          `clientPublicKey` and returned here as a base58check string (a
          33-byte compressed P-256 encapsulated public key followed by
          AES-256-GCM ciphertext) for the client to decrypt with its
          private key. Migrated credential types omit it entirely; it
          remains present only for legacy sessions not yet moved to the
          client-held-key model, and will be removed in a future version.
          Always omitted from list responses (`GET /auth/sessions`).
        example: w99a5xV6A75TfoAUkZn869fVyDYvgVsKrawMALZXmrauZd8hEv66EkPU1Z42CUaHESQjcA5bqd8dynTGBMLWB9ewtXWPEVbZvocB4Tw2K1vQVp7uwjf
      expiresAt:
        type: string
        format: date-time
        description: >-
          Timestamp after which the session is no longer valid and the
          session signing key must not be used to sign further requests.
        example: '2026-04-09T15:30:01Z'
