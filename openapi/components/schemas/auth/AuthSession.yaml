title: Authentication Session
description: >-
  An authentication session on an Embedded Wallet internal account.
  Returned from `GET /auth/sessions` (list) and
  `POST /auth/credentials/{id}/verify` (on credential verification) or
  `POST /auth/sessions/{id}/refresh` (on mid-session refresh). The client
  generates and keeps the session signing key, so session-issuing
  responses carry no key material.
allOf:
  - $ref: ./AuthMethod.yaml
  - type: object
    required:
      - id
      - expiresAt
    properties:
      id:
        type: string
        description: >-
          System-generated unique identifier for the session. Pass this
          value to `DELETE /auth/sessions/{id}` to revoke the session
          before `expiresAt`. Overrides the `id` inherited from
          `AuthMethod` so this response identifies the session rather
          than the authenticating credential.
        example: Session:019542f5-b3e7-1d02-0000-000000000003
      encryptedSessionSigningKey:
        type: string
        deprecated: true
        description: >-
          Deprecated and no longer returned. Every session uses a
          compressed `clientPublicKey`, and the client keeps the matching
          private key as the session signing key. See the "Client keys &
          signing" guide.
      expiresAt:
        type: string
        format: date-time
        description: >-
          Timestamp after which the session is no longer valid and the
          session signing key must not be used to sign further requests.
        example: '2026-04-09T15:30:01Z'
