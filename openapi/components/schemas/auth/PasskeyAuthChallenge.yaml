title: Passkey Auth Challenge
description: >-
  Extended `AuthMethod` shape returned for `PASSKEY` credentials from
  `POST /auth/credentials/{id}/challenge`. Includes the WebAuthn
  `credentialId` needed to target the passkey, plus the Grid-issued
  `challenge`, corresponding `requestId`, and challenge `expiresAt`. The
  `challenge` value is the lowercase hex-encoded SHA-256 digest of the
  canonical session-creation request body, not a base64url string; that body
  is returned verbatim as `payloadToSign` so the client can inspect what the
  passkey authorizes before signing.
  The client UTF-8 encodes this string as the WebAuthn challenge and signs it
  with the passkey to produce the assertion submitted to
  `POST /auth/credentials/{id}/verify`.
allOf:
  - $ref: ./AuthMethod.yaml
  - type: object
    required:
      - credentialId
      - challenge
      - requestId
      - expiresAt
    properties:
      credentialId:
        type: string
        description: >-
          Base64url-encoded WebAuthn credential identifier for this passkey.
          Corresponds to `PublicKeyCredential.rawId`; pass this value as
          `allowCredentials[].id` when requesting a passkey assertion for this
          auth method.
        example: KEbWNCc7NgaYnUyrNeFGX9_3Y-8oJ3KwzjnaiD1d1LVTxR7v3CaKfCz2Vy_g_MHSh7yJ8yL0Pxg6jo_o0hYiew
      challenge:
        type: string
        description: >-
          Lowercase hex-encoded SHA-256 digest of the canonical
          session-creation request body for the pending passkey
          authentication. Do not base64url-decode this field; pass UTF-8 bytes
          of the string (for example, `new TextEncoder().encode(challenge)`) as
          the WebAuthn challenge to `navigator.credentials.get()`. Single-use;
          a new challenge is issued on the next call to
          `POST /auth/credentials/{id}/challenge`.
        example: dd114e7a8361e0df9e3d46163f3ecdcc2b22cac0ebae2a95954bb21e6575d020
      payloadToSign:
        type: string
        description: >-
          The exact canonical JSON of the Turnkey session request the passkey
          assertion authorizes. `challenge` is the lowercase hex-encoded
          SHA-256 digest of this string's UTF-8 bytes, so a client can verify
          the request before calling `navigator.credentials.get()`: parse it,
          check its activity type and that it registers the client's own
          `clientPublicKey`, and recompute the digest. Inspection only: do not
          send it back. Grid forwards the request it stored when issuing the
          challenge, so changing this string changes nothing.
        example: '{"organizationId":"5c1e8a3f-7b2d-4e9a-9c41-2f6d8b0a1e37","parameters":{"expirationSeconds":"900","publicKey":"02f45f2a22c908b9ce09a7150e514afd24627c401c38a4afc164e1ea783adaaa31"},"timestampMs":"1775662500000","type":"ACTIVITY_TYPE_STAMP_LOGIN"}'
      requestId:
        type: string
        description: >-
          Grid-issued `Request:<uuid>` identifier for this pending passkey
          authentication request. Echo this value exactly as the
          `Request-Id` header on the subsequent
          `POST /auth/credentials/{id}/verify` call so Grid can correlate
          the assertion with the issued challenge.
        example: Request:7c4a8d09-ca37-4e3e-9e0d-8c2b3e9a1f21
      expiresAt:
        type: string
        format: date-time
        description: >-
          Timestamp after which the issued challenge is no longer valid.
          The assertion must reach `POST /auth/credentials/{id}/verify`
          before this time; otherwise the client must request a fresh
          challenge via `POST /auth/credentials/{id}/challenge`.
        example: '2026-04-08T15:35:00Z'
