title: Auth Session Refresh Request
description: >-
  Request body for refreshing an active authentication session. The
  `clientPublicKey` is required on both steps of the signed-retry flow; its
  matching private key is retained on the client and becomes the new session
  signing key under the client-held-key model. On the initial call, Grid
  binds this key into the session-creation payload returned as
  `payloadToSign`; the client echoes the same key back on the signed retry.
type: object
required:
  - clientPublicKey
properties:
  clientPublicKey:
    type: string
    pattern: "^04[0-9a-fA-F]{128}$"
    description: >-
      Client-generated P-256 public key, hex-encoded in uncompressed SEC1
      format (`04` prefix followed by the 32-byte X and 32-byte Y coordinates;
      130 hex characters total). The matching private key is retained on the
      client and serves as the new session signing key under the
      client-held-key model. Grid binds this public key into the
      session-creation payload on the initial call; for legacy sessions not
      yet migrated it additionally seals the deprecated
      `encryptedSessionSigningKey` to it on the signed retry.
    example: 04f45f2a22c908b9ce09a7150e514afd24627c401c38a4afc164e1ea783adaaa31d4245acfb88c2ebd42b47628d63ecabf345484f0a9f665b63c54c897d5578be2
