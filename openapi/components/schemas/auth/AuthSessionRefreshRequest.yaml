title: Auth Session Refresh Request
description: >-
  Request body for refreshing an active authentication session. The
  `clientPublicKey` is required on both steps of the signed-retry flow and
  must match on both. On the initial call, Grid binds the supplied key
  into the session-creation payload returned as `payloadToSign`.
type: object
required:
  - clientPublicKey
properties:
  clientPublicKey:
    type: string
    pattern: '^0[23][0-9a-f]{64}$'
    minLength: 66
    maxLength: 66
    description: >-
      Client-generated P-256 public key as a compressed SEC1 point in
      lowercase hex: 66 characters, a `02` or `03` prefix followed by the
      32-byte X coordinate. The client retains the matching private key,
      which becomes the new session signing key.
    example: 02f45f2a22c908b9ce09a7150e514afd24627c401c38a4afc164e1ea783adaaa31
