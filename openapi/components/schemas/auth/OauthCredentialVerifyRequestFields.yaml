type: object
required:
  - type
  - oidcToken
  - clientPublicKey
properties:
  type:
    type: string
    enum:
      - OAUTH
    description: Discriminator value identifying this as an OAuth verification.
  oidcToken:
    type: string
    description: >-
      OIDC ID token issued by the identity provider. For reauthentication
      after a prior session expired, supply a fresh token — the token's
      `iat` claim must be less than 60 seconds before the request
      timestamp. The token identity (`iss`, `aud`, and `sub`) must match
      the registered OAuth credential. In production, the provider signature
      is verified against the issuer's JWKS. In sandbox, the token must still
      be JWT-shaped with supported `iss`, non-empty `aud` and `sub`, numeric
      `iat` and `exp`, and a `nonce` equal to the lowercase hex SHA-256
      digest of the `clientPublicKey` string exactly as sent in this
      request (its lowercase hex characters, UTF-8 encoded), but the
      signature segment may be a dummy value.
    example: eyJhbGciOiJSUzI1NiIsImtpZCI6ImFiYzEyMyIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJodHRwczovL2FjY291bnRzLmdvb2dsZS5jb20iLCJzdWIiOiIxMTIyMzM0NDU1IiwiYXVkIjoiMTIzNDU2Ny5hcHBzLmdvb2dsZXVzZXJjb250ZW50LmNvbSIsImVtYWlsIjoidXNlckBleGFtcGxlLmNvbSIsImlhdCI6MTc0NjczNjUwOSwiZXhwIjoxNzQ2NzQwMTA5fQ.-3_ETmSGOl4wGNLR1QSOMlHk5IvADpX3YdHFmTH9KmRu6sEhM20RsURjKrI4-_EKj7J_HtsdS1tCHm0iw2J0qtoczYFQqEW_U9qJD6QsuvTFx8Fj9rFa3ieYhZKi3kkBu6cADogUiudP50kf9345ATys2GrYm-ba5esgReW1WzGJG3SgCyIDnHFfxmeLjE2YE9EFxT73To3mPYAk0ywPL2MpFFV9F8I3PsnbDAxinaY75GeA8vJXATr8weEIXqHD2lxmXVE95qd2ZlcuyLUaEYyp9GXcOnx7SjhdJG88jl5BZQvxOVgBMo42iGjK674lSwsMiHpzLX98j6C786Rd9Q
  clientPublicKey:
    type: string
    pattern: '^0[23][0-9a-f]{64}$'
    minLength: 66
    maxLength: 66
    description: >-
      Client-generated, ephemeral P-256 public key as a compressed SEC1
      point in lowercase hex: 66 characters, a `02` or `03` prefix
      followed by the 32-byte X coordinate. Generate a fresh key pair for
      each verification request. The client retains the matching private
      key, which becomes the session signing key.
    example: 02f45f2a22c908b9ce09a7150e514afd24627c401c38a4afc164e1ea783adaaa31
