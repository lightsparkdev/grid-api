title: Email OTP Admin Credential Create Request
allOf:
  - $ref: ./AuthCredentialCreateRequest.yaml
  - $ref: ./AdminCredentialCreateRequestFields.yaml
  - type: object
    required:
      - type
      - email
    properties:
      type:
        type: string
        enum:
          - EMAIL_OTP
        description: Discriminator value identifying this as an email OTP credential.
      email:
        type: string
        format: email
        maxLength: 255
        description: >-
          The administrator's email address, which receives their one-time
          codes. Must differ from every other email credential on the account.
        example: admin@example.com
