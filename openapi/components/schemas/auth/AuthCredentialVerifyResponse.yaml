title: Auth Credential Verify Response
description: >-
  Response body for `POST /auth/credentials/{id}/verify`. Normally an
  `AuthSession` — the issued session on successful verification. When
  the underlying wallet-provider activity is still in flight, this is
  instead a `WalletOperationProcessing` body with `status: "PROCESSING"`
  — the client re-sends the byte-identical request until it gets the
  session; the backend also reconciles the activity to terminal on its
  own. When the credential is a `PENDING` OTP credential registered for a
  customer email or phone number change, this is the `AuthMethod` with
  `status: VERIFIED`, and no session is issued.
anyOf:
  - $ref: ./AuthSession.yaml
  - $ref: ../common/WalletOperationProcessing.yaml
  - $ref: ./AuthMethod.yaml
