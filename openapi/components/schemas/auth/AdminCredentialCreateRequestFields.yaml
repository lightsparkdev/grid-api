type: object
required:
  - adminReference
properties:
  adminReference:
    type: string
    minLength: 1
    maxLength: 255
    description: >-
      The platform's opaque reference for the administrator the credential
      belongs to, such as a member id. Grid stores it as given and uses it to
      revoke all of the administrator's credentials together.
    example: member_8f2c1a
