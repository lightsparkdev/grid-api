title: Delegated Key
type: object
required:
  - id
  - accountId
  - nickname
  - status
  - createdAt
  - updatedAt
description: >-
  A delegated signing key for either a card funding source or an agent. Card
  keys include `cardId` and `fundingSourceId`; agent keys include `agentId`.
  Returned from `POST /auth/delegated-keys` (on activation),
  `GET /auth/delegated-keys` (list), and `GET /auth/delegated-keys/{id}`.
  `accountId` says where the signing material comes from. For a key on an
  Embedded Wallet internal account, Grid generates and custodies the keypair
  and never returns the private key; `publicKey` identifies it. While `ACTIVE`,
  Grid may use it to authorize Spark token-transaction signing for the selected
  card funding source or agent in place of a session keypair. A key on a crypto
  external account that carries `providerWallet` is a provider wallet key. Grid
  creates it when the cardholder has delegated the wallet at the provider and
  the card is funded by that wallet, and while `ACTIVE` uses the delegated share
  to sign the card's transfers.
properties:
  id:
    type: string
    description: Grid-issued `DelegatedKey:<uuid>` identifier.
    example: DelegatedKey:019542f5-b3e7-1d02-0000-000000000021
  cardId:
    type: string
    description: The card this key is delegated for. Present only for card keys.
    example: Card:019542f5-b3e7-1d02-0000-000000000010
  fundingSourceId:
    type: string
    description: The card funding source this key is delegated for. Present only for card keys.
    example: CardFundingSource:019542f5-b3e7-1d02-0000-000000000011
  agentId:
    type: string
    description: The agent this key is delegated for. Present only for agent keys.
    example: Agent:019542f5-b3e7-1d02-0000-000000000042
  accountId:
    type: string
    description: >-
      The account this key is delegated for, derived from the card funding
      source or the agent's customer. An Embedded Wallet internal account for a
      key Grid generated, or a crypto external account that carries
      `providerWallet` for a provider wallet key.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  publicKey:
    type: string
    description: >-
      Compressed P-256 public key (hex) of the delegated API keypair. It equals
      the key in the payload the wallet owner stamped on the first leg. Present
      only on keys for an Embedded Wallet internal account.
    example: 02a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
  nickname:
    type: string
    description: Human-readable label for the delegated key.
    example: Settlement service key
  status:
    $ref: ./DelegatedKeyStatus.yaml
  createdAt:
    type: string
    format: date-time
    description: When the delegated key was created.
    example: '2026-04-08T15:30:01Z'
  updatedAt:
    type: string
    format: date-time
    description: When the delegated key was last updated.
    example: '2026-04-08T15:30:42Z'
