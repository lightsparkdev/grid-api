title: Delegated Key
type: object
required:
  - id
  - accountId
  - publicKey
  - nickname
  - status
  - createdAt
  - updatedAt
description: >-
  A delegated signing key for either a card funding source or an agent, backed
  by an Embedded Wallet internal account. Card keys include `cardId` and
  `fundingSourceId`; agent keys include `agentId`. Returned from
  `POST /auth/delegated-keys` (on activation),
  `GET /auth/delegated-keys` (list), and `GET /auth/delegated-keys/{id}`.
  The keypair is generated and custodied by Grid; the private key is never
  returned. While `ACTIVE`, Grid may use the key to authorize Spark
  token-transaction signing for the selected card funding source or agent in
  place of a session keypair. `publicKey` is informational metadata identifying
  the credential.
properties:
  id:
    type: string
    description: Grid-issued `DelegatedKey:<uuid>` identifier.
    example: DelegatedKey:019542f5-b3e7-1d02-0000-000000000021
  cardId:
    type: string
    description: The card this key is delegated for. Present only for card keys.
    example: Card:019542f5-b3e7-1d02-0000-000000000010
  fundingSourceId:
    type: string
    description: The card funding source this key is delegated for. Present only for card keys.
    example: CardFundingSource:019542f5-b3e7-1d02-0000-000000000011
  agentId:
    type: string
    description: The agent this key is delegated for. Present only for agent keys.
    example: Agent:019542f5-b3e7-1d02-0000-000000000042
  accountId:
    type: string
    description: >-
      The Embedded Wallet internal account this key is delegated for,
      derived from the card funding source or the agent's customer.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  publicKey:
    type: string
    description: Compressed P-256 public key (hex) of the delegated API keypair.
    example: 02a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
  nickname:
    type: string
    description: Human-readable label for the delegated key.
    example: Settlement service key
  status:
    $ref: ./DelegatedKeyStatus.yaml
  createdAt:
    type: string
    format: date-time
    description: When the delegated key was created.
    example: '2026-04-08T15:30:01Z'
  updatedAt:
    type: string
    format: date-time
    description: When the delegated key was last updated.
    example: '2026-04-08T15:30:42Z'
