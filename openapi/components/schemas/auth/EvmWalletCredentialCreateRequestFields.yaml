type: object
required:
  - type
  - address
properties:
  type:
    type: string
    enum:
      - EVM_WALLET
    description: >-
      Discriminator value identifying this as an EVM wallet credential.
  address:
    type: string
    pattern: '^0x[0-9a-fA-F]{40}$'
    description: >-
      The wallet's `0x`-prefixed 20-byte address, in any letter case. Grid
      checks that the wallet's signature on the retry comes from this
      address, and shows it back as the credential's `nickname`.
    example: '0x2c7536E3605D9C16a7a3D7b1898e529396a65c23'
