type: string
enum:
  - PENDING
  - ACTIVE
  - REVOKED
description: >-
  Status of a delegated signing key.


  - `PENDING`: The key cannot sign yet. For a key on an Embedded Wallet
  internal account, the policy-creation leg never completed. For an access key,
  the wallet's root has not authorized it. Only these two kinds are ever
  `PENDING`.

  - `ACTIVE`: Grid holds material that can sign for the card funding source or
  agent.

  - `REVOKED`: The key was revoked through Grid, or the delegation was revoked
  at the provider. An access key is also `REVOKED` once the wallet's root
  revokes it on chain or its `expiresAt` passes. It can no longer sign, and
  this is terminal.
example: ACTIVE
