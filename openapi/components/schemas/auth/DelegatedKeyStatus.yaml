type: string
enum:
  - PENDING
  - ACTIVE
  - REVOKED
description: >-
  Status of a delegated signing key.


  - `PENDING`: The policy-creation leg never completed, so the key cannot sign
  yet. Only `GRID_GENERATED` keys are ever `PENDING`.

  - `ACTIVE`: Grid holds material that can sign for the card funding source or
  agent.

  - `REVOKED`: The key was revoked through Grid, or the delegation was revoked
  at the provider. It can no longer sign, and this is terminal.
example: ACTIVE
