type: object
required:
  - type
properties:
  type:
    type: string
    enum:
      - EMAIL_OTP
    description: >-
      Discriminator value identifying this as an email OTP credential.
  email:
    type: string
    format: email
    maxLength: 255
    description: A new email address to register as a replacement credential.
    example: jane.new@example.com
