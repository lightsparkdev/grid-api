type: object
required:
  - type
properties:
  type:
    type: string
    enum:
      - EMAIL_OTP
    description: >-
      Discriminator value identifying this as an email OTP credential.
  email:
    type: string
    format: email
    maxLength: 255
    description: >-
      New email address to verify for a customer email change. This is how
      an Embedded Wallet customer starts an email change. When this value
      differs from the customer's current email and the customer already has
      an `ACTIVE` `EMAIL_OTP` credential, Grid creates a `PENDING` credential
      for this address and sends the one-time password to it. Verify the
      credential, then apply the change with `PATCH /customers/{customerId}`.
      Any of the customer's Embedded Wallet `accountId`s can be used. A
      different address with no `ACTIVE` `EMAIL_OTP` credential is rejected
      with `400` `INVALID_INPUT`; change the customer email with
      `PATCH /customers/{customerId}` instead. A value equal to the current
      email behaves as if the field were omitted: the credential is tied to
      the customer email on file.
    example: jane.new@example.com
