type: string
minLength: 1
maxLength: 100
description: >-
  A label for the credential, shown back as the `AuthMethod`'s `nickname` and
  in credential listings. Leading and trailing whitespace is ignored. Must be
  1-100 characters after trimming, with no `<` or `>` and no control
  characters. Nicknames need not be unique. When a create request omits it,
  the credential gets its type's default, described on `AuthMethod`.
  It is a label only: it does not change where one-time codes are sent or
  which wallet signs.
example: Work phone
