title: Access Key Restrictions
type: object
description: >-
  What a Tempo access key may spend, and until when. The network enforces
  both. Each limit covers the key's whole lifetime: recurring limits and
  call scopes are not offered.
required:
  - spendingLimits
  - expiresAt
properties:
  spendingLimits:
    type: array
    minItems: 1
    description: One limit per token the key may spend. Each currency appears once.
    items:
      $ref: ./AccessKeySpendingLimit.yaml
  expiresAt:
    type: string
    format: date-time
    description: >-
      When the key stops working. It must be in the future. To keep the card
      funded, create a new access key before then: when the new key becomes
      `ACTIVE`, Grid revokes this one in the same step, so the card is never
      without a key.
    example: '2027-11-19T00:00:00Z'
