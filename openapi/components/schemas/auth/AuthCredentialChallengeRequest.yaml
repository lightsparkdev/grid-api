title: Auth Credential Challenge Request
description: >-
  Request body for `POST /auth/credentials/{id}/challenge`. Required when
  re-challenging a `PASSKEY` credential — must carry `clientPublicKey` so
  Grid can bake it into the session-creation payload the returned
  challenge is computed from. Ignored for `EMAIL_OTP` and `SMS_OTP`, where
  the credential type alone is sufficient because the OTP is delivered
  out-of-band. OAuth credentials do not use this endpoint; authenticate or
  reauthenticate them with `POST /auth/credentials/{id}/verify`.
type: object
properties:
  clientPublicKey:
    type: string
    pattern: "^(0[23][0-9a-fA-F]{64}|04[0-9a-fA-F]{128})$"
    minLength: 66
    maxLength: 130
    description: >-
      Required for `PASSKEY` credentials; the matching private key is
      retained on the client. Send a compressed SEC1 key (`02`/`03`
      prefix followed by the 32-byte X coordinate; 66 hex characters)
      for the recommended client-held-key model, where that private key
      becomes the session signing key. Send an uncompressed SEC1 key
      (`04` prefix followed by the 32-byte X and 32-byte Y coordinates;
      130 hex characters) for the deprecated legacy flow, where Grid
      seals the session signing key to it instead. Grid bakes this
      public key into the session-creation payload that the returned
      `challenge` is computed from. Ignored for `EMAIL_OTP` and
      `SMS_OTP`.
    example: 02f45f2a22c908b9ce09a7150e514afd24627c401c38a4afc164e1ea783adaaa31
