type: object
description: >-
  A deposit that converts funds from an external network into
  an internal account belonging to the agent's customer. For networks other
  than `ACH_PULL`, a deposit reported `FAILED` or `EXPIRED` can still become
  `COMPLETED` when the funds arrive late; the platform then receives the
  `INCOMING_PAYMENT` webhook for the deposit's transaction again, now
  `COMPLETED`. For `ACH_PULL`, `PENDING` means the deposit was created and is
  waiting for the customer's debit authorization; nothing has moved. It
  becomes `EXPIRED` at `expiresAt`, 30 minutes after creation. `PROCESSING`
  means the debit was submitted to the bank and the amount was credited to
  the destination USDB account. `COMPLETED` means the debit settled. `FAILED`
  means Grid refused the debit at submission or the bank returned it (see
  `achPull.returnCode`). A return after crediting does not remove the credit.
required:
  - id
  - status
  - sourceNetwork
  - sourceCurrency
  - destinationInternalAccountId
  - destinationCurrency
  - targetType
  - target
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: System-generated unique deposit identifier.
    example: AgentDeposit:019542f5-b3e7-1d02-0000-000000000001
  status:
    $ref: ./AgentDepositStatus.yaml
    description: Current processing state of the deposit.
  sourceNetwork:
    $ref: ./AgentDepositNetwork.yaml
    description: Network from which the customer sends the deposit.
  sourceCurrency:
    type: string
    description: Currency or asset the customer sends.
    example: BTC
  sourceAmount:
    type: integer
    format: int64
    description: >-
      Amount to send in the smallest unit of `sourceCurrency`, when the deposit
      quote fixes the source amount.
    example: 31500
  destinationInternalAccountId:
    type: string
    description: Internal account that receives the converted deposit.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  destinationCurrency:
    type: string
    description: Currency credited to the destination internal account.
    example: USDB
  estimatedReceiveAmount:
    $ref: ../common/CurrencyAmount.yaml
    description: >-
      Estimated amount credited to the destination internal account after fees,
      denominated in the destination asset. Present for `LIGHTNING` deposits.
  quoteId:
    type: string
    description: >-
      The quote that funds the deposit. The transaction that pays the deposit
      carries the same `quoteId`, so a payment can be matched to its deposit.
    example: Quote:019542f5-b3e7-1d02-0000-000000000006
  targetType:
    $ref: ./AgentDepositTargetType.yaml
    description: Whether `target` is a Lightning invoice, chain address or external account ID.
  target:
    type: string
    description: >-
      BOLT11 invoice when `targetType` is `LIGHTNING_INVOICE`; a chain address
      when `CHAIN_ADDRESS`; the source external account ID when
      `EXTERNAL_ACCOUNT` for `ACH_PULL`.
    example: lnbc1pndepositpp5...
  achPull:
    $ref: ./AgentAchPull.yaml
    description: ACH debit details. Present only for `ACH_PULL`.
  paymentLinks:
    type: object
    description: >-
      Payment links present only for a `LIGHTNING` deposit.
    required:
      - cashApp
    properties:
      cashApp:
        type: string
        format: uri
        description: URL that opens the Lightning deposit in Cash App.
        example: https://cash.app/launch/lightning/lnbc1pndepositpp5...
      shortUrl:
        type: string
        format: uri
        description: Shortened URL for the Lightning deposit, when available.
        example: https://link.grid.money/deposit/Ab3dE7
  expiresAt:
    type:
      - string
      - 'null'
    format: date-time
    description: >-
      When the deposit must be paid by: the invoice's expiry for `LIGHTNING`,
      or the quote's for a chain deposit Grid funds through a quote. Omitted or
      null for standing chain deposit addresses, which do not expire.
      For `ACH_PULL`, the authorization deadline, 30 minutes after creation.
    example: '2026-10-09T18:05:00Z'
  paidAfterExpiry:
    type: boolean
    description: >-
      Whether a payment for this deposit arrived after `expiresAt`, so only a
      deposit with an `expiresAt` can have one. A chain payment that arrives
      after its quote expired is not converted: the deposit stays `EXPIRED`
      and Lightspark is alerted to recover the funds by hand, so the payment
      must not be sent again. Absent or `false` while no late payment is
      known.
    example: false
  createdAt:
    type: string
    format: date-time
    description: Time when the deposit was created.
    example: '2026-10-09T18:00:00Z'
  updatedAt:
    type: string
    format: date-time
    description: Time when the deposit was last updated.
    example: '2026-10-09T18:01:00Z'
