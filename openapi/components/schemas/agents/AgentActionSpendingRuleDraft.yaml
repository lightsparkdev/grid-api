type: object
description: >-
  A spending rule the agent proposed for its own cards, as the owner is asked
  to confirm it.
required:
  - draftId
  - writtenText
  - restatement
  - ruleHash
properties:
  draftId:
    type: string
    description: The proposed draft the action would put in force.
    example: SpendingRuleDraft:019542f5-b3e7-1d02-0000-000000000201
  writtenText:
    type: string
    description: >-
      The text the rule was written from, exactly as the agent submitted it.
      Untrusted text: escape it before display.
    example: Only buy groceries, at most $150 a week.
  statement:
    type: string
    maxLength: 500
    description: >-
      A plain statement every merchant must also satisfy, judged by a model.
      Absent when the rule has none. Untrusted text: escape it before display.
    example: The merchant is a grocery store
  restatement:
    type: array
    description: >-
      What the rule does, in plain sentences. Show the owner every sentence.
      Merchant names, questions and the statement appear inside quotation
      marks and are untrusted text: escape every sentence before display.
    items:
      type: string
    example:
      - >-
        Amounts are in USD. A purchase in another currency that must be
        checked against an amount needs the owner's approval.
      - Anything else is declined.
  ruleHash:
    type: string
    pattern: '^[0-9a-f]{64}$'
    description: >-
      SHA-256 of the rule and `statement`, in lowercase hex. Approving puts in
      force only the rule that hashes to it.
    example: 3f5a1c0e9b7d2a4c6e8f0a1b3c5d7e9f1a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d
