type: string
enum:
  - EXECUTE_QUOTE
  - ISSUE_PURCHASE_CARD
  - CLAIMABLE_PAYOUT
  - CREATE_SETTLEMENT_RULE
  - UPDATE_SETTLEMENT_RULE
description: |
  The type of action the agent is requesting.

  | Type | Description |
  |------|-------------|
  | `EXECUTE_QUOTE` | Execute a quote |
  | `ISSUE_PURCHASE_CARD` | Issue a purchase card: single-use, or recurring when `purchaseCard.recurring` is `true`. When `purchaseCard.increaseCardId` is set, raise the amount of that existing single-use card instead of issuing one. See `purchaseCard` |
  | `CLAIMABLE_PAYOUT` | Send a claimable payout to a person by phone number or email. See `claimablePayout` |
  | `CREATE_SETTLEMENT_RULE` | Make a settlement rule the agent proposed `ACTIVE`. See `settlementRule` |
  | `UPDATE_SETTLEMENT_RULE` | Change the match, shares or limits of a settlement rule the agent created. See `settlementRule` |
