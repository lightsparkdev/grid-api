type: object
description: >-
  A transfer quote requested by an agent. The source is an `EMBEDDED_WALLET`
  internal account of the agent's customer. The destination is either an
  `ACCOUNT`: another `EMBEDDED_WALLET` on the platform, or one of the
  customer's active `SPARK_WALLET` external accounts in the source's currency;
  an address on another chain (`CHAIN_ADDRESS`); or a BOLT11 Lightning
  invoice (`LIGHTNING_INVOICE`).


  A `CHAIN_ADDRESS` quote sends `USDB`. With `lockedCurrencySide` `SENDING`
  it commits to the `USDB` amount; with `RECEIVING` it commits to exactly the
  amount the destination receives, in the smallest unit of the destination's
  `currency`, and the fees are added to the `USDB` sent. Grid pays the chain
  itself at a locked rate, so the amount the destination receives is fixed
  when the quote is created and returned as `minimumReceivingAmount`. When
  Grid cannot deliver a `RECEIVING` amount exactly, it refuses the quote with
  400 `EXACT_AMOUNT_UNAVAILABLE`.


  A `LIGHTNING_INVOICE` quote sends `USDB` and pays exactly the invoice's
  amount. Its `lockedCurrencySide` must be `RECEIVING` and its
  `lockedCurrencyAmount` the invoice's amount in satoshis; the fees are added
  to the `USDB` sent. The quote expires no later than one minute before the
  invoice does. An invoice can be quoted once: another quote for it is refused
  with 409 `INVOICE_ALREADY_USED`, except a repeat of the same request with the
  same `Idempotency-Key`.
required:
  - source
  - destination
  - lockedCurrencySide
  - lockedCurrencyAmount
properties:
  source:
    $ref: ../quotes/QuoteSourceOneOf.yaml
  destination:
    $ref: ./AgentQuoteDestinationOneOf.yaml
  lockedCurrencySide:
    $ref: ../quotes/QuoteLockSide.yaml
  lockedCurrencyAmount:
    type: integer
    format: int64
    description: >-
      The amount to send/receive in the smallest unit of the locked
      currency (eg. cents). See `lockedCurrencySide` for more
      information.
    exclusiveMinimum: 0
    maximum: 9000000000000000
    example: 1000
