type: string
enum:
  - VIEW_TRANSACTIONS
  - CREATE_QUOTES
  - EXECUTE_QUOTES
  - MANAGE_EXTERNAL_ACCOUNTS
  - RECEIVE_FUNDS
  - MANAGE_IDENTITY
  - MANAGE_CARDS
description: >-
  Permission granted to an agent that determines what actions it can perform.
  VIEW_TRANSACTIONS: Can list and retrieve transactions and account balances.
  CREATE_QUOTES: Can create quotes.
  EXECUTE_QUOTES: Can execute quotes.
  MANAGE_EXTERNAL_ACCOUNTS: Can create and manage external accounts.
  RECEIVE_FUNDS: Can create deposit targets for receiving funds.
  MANAGE_IDENTITY: Can read and update customer identity information and start verification.
  MANAGE_CARDS: Can read, tighten, and freeze its cards, and issue, reveal, and close purchase cards.
