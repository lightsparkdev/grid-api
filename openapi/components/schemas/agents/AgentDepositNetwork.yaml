type: string
enum:
  - LIGHTNING
  - BASE
  - ETHEREUM
  - SOLANA
  - POLYGON
  - AVALANCHE
  - TEMPO
  - ARBITRUM
  - OPTIMISM
  - TRON
  - ACH_PULL
description: >-
  Network from which an agent customer can fund a deposit. `TRON` deposits
  support `USDT` only, `OPTIMISM` and `AVALANCHE` deposits support `USDC` only,
  and `TEMPO` deposits support `USDC` and `OUSD`. `ACH_PULL` is an ACH debit from one of the customer's
  own US bank accounts (external accounts).
