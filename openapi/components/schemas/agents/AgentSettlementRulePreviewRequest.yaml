description: A draft rule and a payment to split by it. The draft's fields sit at the top level, beside `amount`.
allOf:
  - $ref: ../settlement_rules/SettlementRuleDraft.yaml
  - type: object
    required:
      - amount
    properties:
      amount:
        type: integer
        format: int64
        minimum: 1
        maximum: 9000000000000000
        description: A payment to split, in the smallest unit of the draft's currency.
        example: 1000000
