type: string
enum:
  - STANDARD
description: |
  How an agent card is used and funded.

  | Kind | Description |
  |------|-------------|
  | `STANDARD` | A card issued for the agent, by the platform with `POST /cards` or by the agent with `POST /agents/me/cards`. The customer holds the card details and its spend is the customer's own; the agent can read it, tighten its limits, and freeze it. |
