type: string
enum:
  - QUOTE_EXPIRED
  - POLICY_DENIED
  - AGENT_INACTIVE
  - EXECUTION_FAILED
  - CARD_ISSUANCE_FAILED
  - APPROVAL_EXPIRED
  - PRICE_MOVED
  - ADDRESS_REFUSED
description: |
  Why an agent action has status `FAILED`.

  | Reason | Description |
  |--------|-------------|
  | `QUOTE_EXPIRED` | The action's quote expired before execution |
  | `POLICY_DENIED` | The agent policy no longer allowed the action |
  | `AGENT_INACTIVE` | The agent was paused or deleted before execution |
  | `EXECUTION_FAILED` | Grid could not execute the approved action |
  | `CARD_ISSUANCE_FAILED` | Grid could not issue the approved purchase card |
  | `APPROVAL_EXPIRED` | An `ISSUE_PURCHASE_CARD` action was not approved before it expired |
  | `PRICE_MOVED` | A quote to a `CHAIN_ADDRESS` would no longer deliver its `minimumReceivingAmount` when it executed, so Grid did not send |
  | `ADDRESS_REFUSED` | Grid refused the send's destination before it signed the send: the destination is no longer one the agent may send to (for example, a Spark address removed from the customer's saved addresses), or one of the customer's records of the address was refused or is held for review. A `CHAIN_ADDRESS` that screening refuses fails with `EXECUTION_FAILED` |
