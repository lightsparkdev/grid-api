type: object
description: >-
  Request for an Orchestra-backed deposit into one of the agent customer's
  internal accounts.
required:
  - sourceNetwork
  - sourceCurrency
  - destinationInternalAccountId
properties:
  sourceNetwork:
    $ref: ./AgentDepositNetwork.yaml
    description: Network from which the customer will send the deposit.
  sourceCurrency:
    type: string
    description: Currency or asset the customer will deposit.
    example: USDC
  destinationInternalAccountId:
    type: string
    description: >-
      Internal account that will receive the converted deposit. It must belong
      to the agent's associated customer and be allowed by the agent policy.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  destinationAmount:
    type: integer
    format: int64
    exclusiveMinimum: 0
    maximum: 9000000000000000
    description: >-
      Optional amount to receive, in the smallest unit of the destination
      account's currency. Required for amount-specific Lightning invoices.
    example: 2000
