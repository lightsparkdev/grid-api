type: string
enum:
  - BASE
  - ETHEREUM
  - SOLANA
  - POLYGON
  - AVALANCHE
  - TEMPO
  - ARBITRUM
  - OPTIMISM
  - TRON
description: >-
  Network an agent can send USDC, USDT or OUSD to from an embedded wallet.
  `TRON` supports `USDT` only, `BASE`, `OPTIMISM` and `AVALANCHE` support `USDC`
  only, and `TEMPO` supports `USDC` and `OUSD`.
