title: Agent Quote
allOf:
  - $ref: ../quotes/Quote.yaml
  - type: object
    properties:
      minimumReceivingAmount:
        type:
          - integer
          - 'null'
        format: int64
        description: >-
          Smallest amount the recipient receives, in the smallest unit of
          `receivingCurrency`, for a quote to a `CHAIN_ADDRESS` destination:
          `totalReceivingAmount` is an estimate, and the quote executes only if
          a fresh price at execution still delivers at least this amount.
          Otherwise the action fails with `PRICE_MOVED`. Null for a quote whose
          destination is not `CHAIN_ADDRESS`.
        example: 990000
      destinationSparkAddress:
        type: string
        description: >-
          The Spark address this quote pays, when its `destination` is one of
          the customer's `SPARK_WALLET` external accounts.
        example: spark1pgssyuuuhnrrdjswal5c3s3rafw9w3y5dd4cjy3duxlf7hjzkp0rqx6dj6mrhu
      destinationChainAddress:
        $ref: ./AgentChainAddressDestination.yaml
        description: >-
          The chain, address and stablecoin this quote pays, when it was
          created with a `CHAIN_ADDRESS` destination.
description: >-
  A quote created by an agent. For a `CHAIN_ADDRESS` destination, the quote's
  `destination` names the external account Grid recorded for the address, and
  `destinationChainAddress` names the address itself.
