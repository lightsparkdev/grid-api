type: object
required:
  - code
  - status
  - redeemed
properties:
  code:
    type: string
    description: The device code.
    example: jqzJR3AgI9OAwb_enypARw
  status:
    $ref: ./AgentDeviceCodeStatus.yaml
  redeemed:
    type: boolean
    description: Whether this device code was successfully redeemed. This is false for expired or invalidated codes.
    example: false
