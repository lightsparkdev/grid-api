type: object
description: >-
  Spending limits that cap the agent's transaction amounts and frequency. They
  cover both the agent's sends and purchases on cards issued for the agent. All amount
  fields are integers in the smallest unit of the specified currency. When a transaction
  is denominated in a different currency, Grid converts using the exchange rate at
  evaluation time.
required:
  - currency
  - perTransactionLimit
properties:
  currency:
    type: string
    description: >-
      ISO 4217 currency code that all amount limits are denominated in. This
      currency is immutable after the agent is created.
    example: USD
  perTransactionLimit:
    type: integer
    description: Maximum amount of a single send or card authorization.
    example: 50000
  dailyLimit:
    type:
      - integer
      - 'null'
    description: Maximum total the agent can send and spend on its cards per day. Null means no daily limit.
    example: 500000
  dailyTransactionLimit:
    type: integer
    description: Maximum number of sends and card authorizations the agent can make per day.
    example: 10
  monthlyLimit:
    type:
      - integer
      - 'null'
    description: Maximum total the agent can send and spend on its cards per month. Null means no monthly limit.
    example: 5000000
