type: object
description: >-
  Update request for `PATCH /agents/me/cards/{cardId}`. At least one field must
  be supplied. An agent may freeze the card or tighten merchant categories:
  `blockedMccs` must contain every code in the
  card's `effectiveBlockedMccs`, and `allowedMccs` may only lose codes once set.
  The only status an agent may set is `FROZEN`; unfreezing and loosening happen
  on the platform through `PATCH /cards/{id}`. The platform manages card
  velocity limits through `/card-velocity-limits`.
properties:
  status:
    type: string
    enum:
      - FROZEN
    description: Freeze the card. New authorizations are declined.
    example: FROZEN
  allowedMccs:
    type: array
    minItems: 1
    description: >-
      Merchant category codes the card may spend at. Once set, a replacement
      must be a subset of the current list.
    items:
      type: string
      pattern: ^[0-9]{4}$
    example:
      - '5411'
  blockedMccs:
    type: array
    description: >-
      Merchant category codes the card declines. A replacement must contain
      every code in the card's `effectiveBlockedMccs`, so an agent can never
      lift a block, Grid's default agent blocks included.
    items:
      type: string
      pattern: ^[0-9]{4}$
    example:
      - '5813'
