type: object
description: >-
  An action submitted by an agent that may require platform approval before execution.
  All agent-initiated operations (quote execution, transfers) are represented as AgentActions,
  giving the platform a consistent object to approve, reject, and audit regardless of the
  underlying operation type.
required:
  - id
  - agentId
  - customerId
  - platformCustomerId
  - status
  - type
  - expiresAt
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: System-generated unique identifier for this action.
    example: AgentAction:019542f5-b3e7-1d02-0000-000000000099
  agentId:
    type: string
    description: The agent that submitted this action.
    example: Agent:019542f5-b3e7-1d02-0000-000000000042
  customerId:
    type: string
    description: The customer on whose behalf the action was submitted.
    example: Customer:019542f5-b3e7-1d02-0000-000000000010
  platformCustomerId:
    type: string
    description: Platform-specific ID of the customer.
    example: user-a1b2c3
  status:
    $ref: ./AgentActionStatus.yaml
  type:
    $ref: ./AgentActionType.yaml
  quote:
    allOf:
      - $ref: ./AgentQuote.yaml
    description: >-
      The quote being executed. Contains the full amount, currency, destination, and rate
      details needed to present an approval decision to the user. Present for
      `EXECUTE_QUOTE`.
  previousQuote:
    allOf:
      - $ref: ./AgentQuote.yaml
    description: >-
      The quote the customer was shown before an approval found that the
      price had moved past `priceTolerance`. Present only while the action is
      `PENDING_APPROVAL` after such an approval; `quote` is then the new quote
      to show the customer, and approving it again repeats the check against
      it.
  priceTolerance:
    $ref: ./AgentApprovalPriceTolerance.yaml
    description: >-
      Present on a `PENDING_APPROVAL` `EXECUTE_QUOTE` action that Grid quotes
      again when it is approved: how far the price may move against the
      customer before they are asked again. Absent when approval executes
      `quote` as it is.
  purchaseCard:
    $ref: ./AgentPurchaseCardDetails.yaml
    description: >-
      The purchase card the agent asked for, so an approval decision can show
      its amount, limit, description and funding account. Present for
      `ISSUE_PURCHASE_CARD`.
  cardId:
    type: string
    description: >-
      The purchase card the action issued. Present for an `ISSUE_PURCHASE_CARD`
      action once it is `APPROVED` and the card is issued; read it with
      `GET /agents/me/cards/{cardId}`.
    example: Card:019542f5-b3e7-1d02-0000-000000000011
  transaction:
    allOf:
      - $ref: ../transactions/TransactionOneOf.yaml
    description: >-
      The resulting transaction, populated once the action has been approved and execution
      has begun. Absent while the action is `PENDING_APPROVAL` or `REJECTED`.
  rejectionReason:
    type: string
    description: >-
      Human-readable reason provided by the platform when rejecting the action.
      Only present when status is `REJECTED`.
    example: Transaction amount exceeds customer's current risk limit.
  failureReason:
    $ref: ./AgentActionFailureReason.yaml
    description: >-
      Machine-readable reason the action failed. Only present when status is
      `FAILED`; `rejectionReason` is used only for `REJECTED` actions.
  expiresAt:
    type: string
    format: date-time
    description: >-
      When the action expires. For an `EXECUTE_QUOTE` action with
      `priceTolerance`, this is the end of the platform's approval window,
      independent of the quote's own expiry: approval quotes the send again,
      and a pending action that reaches this time fails with
      `APPROVAL_EXPIRED`. For any other `EXECUTE_QUOTE` action, this is the
      quote's own expiry; a pending action that reaches it fails with
      `QUOTE_EXPIRED`, and approval never creates a replacement quote. For
      `ISSUE_PURCHASE_CARD`, this is the end of the approval window, after
      which a pending action fails with `APPROVAL_EXPIRED`.
    example: '2025-10-03T15:05:00Z'
  createdAt:
    type: string
    format: date-time
    description: When the action was submitted by the agent.
    example: '2025-10-03T15:00:00Z'
  updatedAt:
    type: string
    format: date-time
    description: When the action was last updated.
    example: '2025-10-03T15:02:00Z'
