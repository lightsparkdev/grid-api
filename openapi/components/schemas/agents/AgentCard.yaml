title: Agent Card
type: object
description: >-
  A card that belongs to the authenticated agent: the card itself and how the
  agent may use it.
required:
  - card
  - agentId
  - agentCardKind
  - effectiveBlockedMccs
properties:
  card:
    $ref: ../cards/Card.yaml
  agentId:
    type: string
    description: The agent the card belongs to.
    example: Agent:019542f5-b3e7-1d02-0000-000000000042
  agentCardKind:
    $ref: ./AgentCardKind.yaml
  effectiveBlockedMccs:
    type: array
    description: >-
      Every merchant category code the card declines: `blockedMccs` plus
      the categories Grid blocks for agent cards, unless the platform
      lifted those defaults (`defaultMccBlocksLifted`).
    items:
      type: string
      pattern: ^[0-9]{4}$
    example:
      - '7995'
      - '6051'
  purchase:
    $ref: ./AgentPurchaseCardDetails.yaml
    description: The purchase the card was issued for. Present for `PURCHASE` cards.
