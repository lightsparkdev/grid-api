title: Agent Customer Update Request
description: >-
  Request body for `PATCH /agents/me/customer`: the identity fields an agent
  may update on its customer. Any other field, including `email` and
  `currencies`, returns 400.
allOf:
  - type: object
    properties:
      fullName:
        type: string
        maxLength: 250
        description: Individual's full name
        example: John Michael Doe
      birthDate:
        type: string
        format: date
        description: Date of birth in ISO 8601 format (YYYY-MM-DD)
        example: '1990-01-15'
      nationality:
        type: string
        description: Country code (ISO 3166-1 alpha-2)
        example: US
      address:
        $ref: ../common/Address.yaml
      idType:
        $ref: ../customers/IdentificationType.yaml
      identifier:
        type: string
        maxLength: 100
        writeOnly: true
        description: >-
          The individual's identification number, required to onboard them as
          a US account holder. Only SSN (format `###-##-####`) and ITIN are
          currently accepted; other identification types are rejected.
          Write-only; never returned in customer responses.
        example: 123-45-6789
      countryOfIssuance:
        type: string
        description: >-
          Country that issued the identification (ISO 3166-1 alpha-2). Optional
          for an individual account holder: SSN and ITIN are US-issued, so this
          defaults to `US` and is rejected if set to anything else.
        example: US
      phoneNumber:
        type: string
        pattern: '^\+[1-9]\d{1,14}$'
        description: >-
          The customer's phone number in strict E.164 format. Like the other
          fields, accepted only while the customer's identity can still be
          edited, and only when no phone number is on file; repeating the number
          on file changes nothing, and changing it returns 400.
        example: '+14155551234'
  - $ref: ../customers/CustomerEdd.yaml
