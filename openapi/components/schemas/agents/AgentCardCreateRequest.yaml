type: object
description: >-
  Request body for `POST /agents/me/cards`. Without `kind`, or with
  `kind: STANDARD`, it issues the agent's standard card. With
  `kind: PURCHASE` it requests a single-use purchase card for one online
  purchase of `amount`, or with `recurring: true` a recurring purchase card
  that may spend up to `amount` each month at one merchant.
required:
  - fundingSource
properties:
  fundingSource:
    type: string
    description: >-
      Internal account id that funds the card. The account must belong to the
      agent's customer and be denominated in a card-eligible currency;
      otherwise the request is rejected with `INVALID_INPUT`. A `PURCHASE`
      card must be funded from an Embedded Wallet on which the agent holds an
      active delegated key.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
  kind:
    $ref: ./AgentCardKind.yaml
    description: >-
      The kind of card to issue. Defaults to `STANDARD`.
  amount:
    type: integer
    format: int64
    minimum: 1
    description: >-
      The purchase amount in the smallest unit of USD. Required for
      `kind: PURCHASE` and rejected otherwise. Grid adds an allowance for tax
      and shipping to set the card's limit; see `AgentPurchaseCardDetails`.
      For a recurring card it is the monthly limit itself, with no allowance
      added, so include tax and shipping in it.
    example: 4999
  description:
    type: string
    maxLength: 255
    description: >-
      What the card is for, such as the merchant and item, shown to the
      customer when they approve it. Allowed only with `kind: PURCHASE`.
    example: Running shoes from example-store.com
  recurring:
    type: boolean
    default: false
    description: >-
      Request a recurring purchase card: one that locks to the first merchant
      that charges it and may be charged there again, up to `amount` each
      calendar month, until it is closed. Use it for a subscription, a card
      saved with a merchant, a hotel or car rental, or an order that ships in
      parts. It always needs the customer's approval, whatever the agent's
      policy says, and is available only where the platform enables
      recurring purchase cards. Allowed only with `kind: PURCHASE`.
    example: false
