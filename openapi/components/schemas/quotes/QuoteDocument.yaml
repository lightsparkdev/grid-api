type: object
description: A supporting document attached to the payment behind a quote.
required:
  - id
  - documentType
properties:
  id:
    type: string
    description: ID of the payment document, as returned by `POST /payment-documents`
    example: PaymentDocument:019542f5-b3e7-1d02-0000-000000000001
  documentType:
    $ref: ../payment_documents/PaymentDocumentType.yaml
