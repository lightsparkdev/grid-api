title: Account
allOf:
  - $ref: ./BaseDestination.yaml
  - type: object
    required:
      - accountId
      - destinationType
    properties:
      destinationType:
        type: string
        enum:
          - ACCOUNT
      accountId:
        type: string
        description: Destination account identifier
        example: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
      paymentRail:
        allOf:
          - $ref: ../common/PaymentRail.yaml
          - description: >-
              The payment rail to use for the transfer. Omit it if you have no
              preference. Grid then picks the rail from the account and the amount.
              If you set it, use one of the account's `paymentRails`.
    description: Destination account details
