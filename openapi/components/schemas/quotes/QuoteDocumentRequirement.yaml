type: object
description: >-
  One supporting document the quote needs before it can be executed. Exactly
  one file satisfies it: the values in `acceptedDocumentTypes` are alternatives
  for that single file, not a list of files to send.
required:
  - requirementId
  - acceptedDocumentTypes
  - satisfied
properties:
  requirementId:
    $ref: ./QuoteDocumentRequirementId.yaml
    description: >-
      Identifies this requirement. Pass it back as the `requirementId` form
      field when uploading the file that satisfies it.
  acceptedDocumentTypes:
    type: array
    minItems: 1
    description: >-
      The document types that satisfy this requirement. Any one of them is
      enough; the upload declares which one the file is. A single-value array
      means the requirement accepts only that type.
    items:
      $ref: ./PaymentDocumentType.yaml
    example:
      - PURCHASE_ORDER
      - INVOICE
      - CONTRACT
  satisfied:
    type: boolean
    description: >-
      Whether a file has been accepted for this requirement. Once `true` it
      stays `true` — a satisfied requirement cannot be replaced.
    example: false
