description: >-
  The payment rail to send the payment over, with options specific to that rail.
  `paymentRail` selects the rail and determines which other fields are accepted.
  The rail must be one the destination account supports. Replaces the deprecated
  `paymentRail` on the destination; send one or the other, not both. If neither is
  set, Grid selects a rail.
oneOf:
  - $ref: ./AchRailOptions.yaml
  - $ref: ./BasicRailOptions.yaml
discriminator:
  propertyName: paymentRail
  mapping:
    ACH: ./AchRailOptions.yaml
    ACH_SAME_DAY: ./AchRailOptions.yaml
    ACH_COLOMBIA: ./BasicRailOptions.yaml
    BANK_TRANSFER: ./BasicRailOptions.yaml
    BRE_B: ./BasicRailOptions.yaml
    CIPS: ./BasicRailOptions.yaml
    FAST: ./BasicRailOptions.yaml
    FASTER_PAYMENTS: ./BasicRailOptions.yaml
    FEDNOW: ./BasicRailOptions.yaml
    INSTAPAY: ./BasicRailOptions.yaml
    MOBILE_MONEY: ./BasicRailOptions.yaml
    NEFT: ./BasicRailOptions.yaml
    PAYNOW: ./BasicRailOptions.yaml
    PESONET: ./BasicRailOptions.yaml
    PIX: ./BasicRailOptions.yaml
    RTGS: ./BasicRailOptions.yaml
    RTP: ./BasicRailOptions.yaml
    SEPA: ./BasicRailOptions.yaml
    SEPA_INSTANT: ./BasicRailOptions.yaml
    SPEI: ./BasicRailOptions.yaml
    SWIFT: ./BasicRailOptions.yaml
    UNIONPAY: ./BasicRailOptions.yaml
    UPI: ./BasicRailOptions.yaml
    WIRE: ./BasicRailOptions.yaml
