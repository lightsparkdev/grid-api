title: Real-time Funding
allOf:
  - $ref: ./BaseQuoteSource.yaml
  - type: object
    required:
      - currency
      - sourceType
    properties:
      sourceType:
        type: string
        enum:
          - REALTIME_FUNDING
      customerId:
        type: string
        description: >-
          Source customer ID. If this transaction is being initiated on behalf of a customer, this is required.
          If customerId is not provided, the quote will be created on behalf of the platform itself.
        example: Customer:019542f5-b3e7-1d02-0000-000000000009
      currency:
        type: string
        description: >-
          Currency code for the funding source. See
          [Supported Currencies](https://docs.lightspark.com/platform-overview/core-concepts/currencies-and-rails)
          for the full list of supported fiat and crypto currencies.
        example: USD
      cryptoNetwork:
        type: string
        description: >-
          The crypto network to use for the funding source. Required when `currency` is a
          stablecoin (e.g. USDC, USDT). Specifies which network the customer will deposit
          on, so the correct deposit address can be generated. Example values:
          `SOLANA`, `ETHEREUM`, `BASE`, `POLYGON`, `TRON`, `PLASMA`, `ARBITRUM`, `OPTIMISM`, `AVALANCHE`, `SPARK`,
          `LIGHTNING`, `BITCOIN`.
        example: SOLANA
      refundAddress:
        type: string
        maxLength: 128
        description: >-
          Optional. On-chain address the deposit is returned to if the quote cannot complete. Applies
          only when `currency` is a stablecoin. The full deposit is returned in the deposited currency on
          `cryptoNetwork`, so the address must be able to receive that currency on that network, and
          should be one the customer controls. Grid rejects an address that is not valid for
          `cryptoNetwork`, but cannot tell which EVM network an EVM address is meant for. The address the
          deposit was sent from is safe only when it is the customer's own wallet. An exchange or
          custodian withdrawal address often cannot credit a refund back to the customer. When omitted, a
          failed quote returns the deposit to the customer's internal account for that currency.
        example: '0xAbCDEF1234567890aBCdEf1234567890ABcDef12'
    description: >-
      Fund the quote using a real-time funding source (RTP, SEPA Instant, Spark, Stables, etc.).
      This will require manual just-in-time funding using `paymentInstructions` in the response.
      Because quotes expire quickly, this option is only valid for instant payment methods. Do not try
      to fund a quote with a non-instant payment method (ACH, etc.).
