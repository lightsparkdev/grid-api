type: object
required:
  - source
  - destination
  - lockedCurrencySide
  - lockedCurrencyAmount
properties:
  lookupId:
    type: string
    description: >-
      Lookup ID from a previous receiver lookup request. If provided,
      this can make the quote creation more efficient by reusing cached lookup data.

      NOTE: This is required for UMA destinations due to counterparty institution requirements.
      See `senderCustomerInfo` for more information.
    example: Lookup:019542f5-b3e7-1d02-0000-000000000009
  source:
    $ref: ./QuoteSourceOneOf.yaml
  destination:
    $ref: ./QuoteDestinationOneOf.yaml
  lockedCurrencySide:
    $ref: ./QuoteLockSide.yaml
  lockedCurrencyAmount:
    type: integer
    format: int64
    description: >-
      The amount to send/receive in the smallest unit of the locked
      currency (eg. cents). See `lockedCurrencySide` for more
      information.
    exclusiveMinimum: 0
    maximum: 9000000000000000
    example: 1000
  immediatelyExecute:
    type: boolean
    description: >-
      Whether to immediately execute the quote after creation. If true,
      the quote will be executed and the transaction will be created at
      the current exchange rate. It should only be used if you don't want
      to lock and view rate details before executing the quote. If you are
      executing a pre-existing quote, use the `/quotes/{quoteId}/execute`
      endpoint instead. This is false by default.

      This can only be used for quotes with a `source` which is either an internal account,
      or has direct pull functionality (e.g. ACH pull with an external account).

      Not supported when the `source` is an internal account of type
      `EMBEDDED_WALLET`: those transfers require a `Grid-Wallet-Signature`
      over the `payloadToSign` returned in the quote response, which is not
      available in a combined create-and-execute call. Create the quote
      first with `immediatelyExecute: false` and then call
      `POST /quotes/{quoteId}/execute` with the `Grid-Wallet-Signature` stamp
      header.
    example: false
  description:
    type: string
    maxLength: 1024
    description: Optional description/memo for the transfer
    example: 'Invoice #1234 payment'
  remittanceInformation:
    type: string
    maxLength: 80
    description: |-
      Free-form information about the payment, such as an invoice or reference number, that travels with it to the recipient. Printable ASCII only. Where it goes depends on the payment rail:
      - **ACH:** the addenda record.
      - **RTP and FedNow:** the remittance information field.
      - **Wire:** the OBI (Originator to Beneficiary Information).
      - **Other rails** (for example SEPA, PIX, SPEI, and Faster Payments): the payment reference shown on the recipient's bank statement. These references are often much shorter than 80 characters and may allow only letters and digits, so the value may be shortened and unsupported characters removed. Put the most important information first.

      To set the short description of the payment's purpose that an ACH recipient sees on their statement, such as `PAYROLL`, use `statementDescriptor`.
    example: '12345'
  statementDescriptor:
    $ref: ./StatementDescriptor.yaml
  purposeOfPayment:
    $ref: ./PurposeOfPayment.yaml
  documentIds:
    type: array
    minItems: 1
    maxItems: 3
    uniqueItems: true
    description: >-
      IDs of payment documents from `POST /payment-documents` that support
      this payment. Required when the destination requires supporting
      documents. Supply one document for each requirement of your
      `purposeOfPayment`. [Supporting
      Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents)
      lists which payouts need documents, the requirements for each purpose,
      and the document types each requirement accepts. Grid matches each
      document to a requirement by its `documentType`, which must be one of
      the types that requirement accepts.
      A request that leaves a requirement unfilled returns
      `400 DOCUMENTS_REQUIRED`. Each document must belong to the customer
      sending the payment, or to the platform when the platform itself is the
      sender. Any other ID returns `404 PAYMENT_DOCUMENT_NOT_FOUND`.


      Grid attaches every document to the payment before it returns the
      quote. With `immediatelyExecute: true`, Grid attaches the documents
      before it executes the quote. If an attachment fails, Grid creates no
      quote and returns `424 PAYMENT_DOCUMENT_ATTACHMENT_FAILED`. Retry the
      same request with the same `Idempotency-Key`.


      Requires the `Idempotency-Key` header. A destination that does not
      require supporting documents rejects `documentIds` with
      `400 INVALID_INPUT`.
    items:
      type: string
    example:
      - PaymentDocument:019542f5-b3e7-1d02-0000-000000000001
      - PaymentDocument:019542f5-b3e7-1d02-0000-000000000002
      - PaymentDocument:019542f5-b3e7-1d02-0000-000000000003
  platformFeeOverride:
    $ref: ./PlatformFeeOverride.yaml
  scaFactor:
    $ref: ../sca/ScaFactor.yaml
    description: >-
      Optional preferred factor for a Strong Customer Authentication challenge
      issued at quote creation. Only relevant for a realtime-funding source
      in a region where SCA is required (e.g. EU); ignored otherwise. Valid values are
      `SMS_OTP` (default) and `PASSKEY` — `TOTP` cannot carry the required
      dynamic linking and is rejected. When the quote is returned in
      `PENDING_AUTHORIZATION`, authorize it via `POST /quotes/{quoteId}/authorize`.
  senderCustomerInfo:
    type: object
    additionalProperties: true
    description: >
      Key-value pairs of additional information about the sender which was
      requested by the destination.
      This is relevant when the destination requires more sender info than
      was provided during customer creation.

      Any fields specified in `requiredPayerDataFields` from the
      response of the `/receiver/uma/{receiverUmaAddress}` (lookupUma) or
      `/receiver/external-account/{accountId}` (lookupExternalAccount)
      endpoints
      MUST be provided here if they were requested. If the destination did
      not request any additional information, this field can be omitted.
    example:
      FULL_NAME: Jane Receiver
      NATIONALITY: FR
