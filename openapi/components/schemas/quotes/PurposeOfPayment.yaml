type: string
description: >-
  The purpose of the payment. This may be required when sending to certain
  geographies (e.g. India).


  Some destinations accept only certain purposes. A business payout to China
  must use one of the purposes listed in [Supporting
  Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/supporting-documents),
  and each needs its own supporting documents. Those purposes also work on
  other corridors, where Grid sends the closest purpose the payout partner
  accepts, or the partner's own "other" purpose when none fits.
enum:
  - GIFT
  - SELF
  - GOODS_OR_SERVICES
  - EDUCATION
  - HEALTH_OR_MEDICAL
  - REAL_ESTATE_PURCHASE
  - TAX_PAYMENT
  - LOAN_PAYMENT
  - UTILITY_BILL
  - DONATION
  - TRAVEL
  - FAMILY_SUPPORT
  - SALARY_PAYMENT
  - EXPORTED_GOODS_PREPAYMENT
  - EXPORTED_GOODS_POSTPAYMENT
  - SERVICE_CHARGES
  - OFFICE_EXPENSES
  - DELIVERY_FEES
  - HOTEL_ACCOMMODATION
  - COMMISSION_ON_GOODS
  - COMMISSION_ON_SERVICES
  - ACCOUNTING_SERVICES
  - EXHIBITION_SERVICES
  - OTHER
