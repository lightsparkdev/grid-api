title: Account
allOf:
  - $ref: ./BaseQuoteSource.yaml
  - type: object
    required:
      - accountId
      - sourceType
    properties:
      sourceType:
        type: string
        enum:
          - ACCOUNT
      accountId:
        type: string
        description: Source account identifier
        example: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
      customerId:
        type: string
        description: >-
          The customer on whose behalf the transaction is being initiated.
          Required when funding from a `BULK_SETTLEMENT` account. The customer
          is never the account owner, because the platform owns the account.
          When funding from an FBO account, this field is optional. If you omit
          it, the transaction is initiated on behalf of the platform. For any
          other account, it defaults to the account owner's customerId.
        example: Customer:019542f5-b3e7-1d02-0000-000000000001
      railOptions:
        allOf:
          - $ref: ./PullRailOptionsOneOf.yaml
          - description: >-
              Options for the ACH debit Grid originates when `accountId` is an
              external US bank account. `companyEntryDescription` sets the text
              the account holder's bank shows on their statement for the debit.
              Sending `railOptions` when `accountId` is any other account, such as
              an internal account, returns `400 INVALID_INPUT`.
    description: Source account details
