type: object
required:
  - source
  - destination
properties:
  source:
    $ref: ./InternalAccountReference.yaml
    description: Source internal account details
  destination:
    $ref: ./ExternalAccountDestinationReference.yaml
    description: Destination external account details
  amount:
    type: integer
    format: int64
    description: >-
      Amount in the smallest unit of the currency (e.g., cents for USD/EUR,
      satoshis for BTC)
    example: 12550
  platformTransactionId:
    type: string
    maxLength: 255
    description: >-
      Your platform's identifier for the transaction this request creates.
      Grid stores it on the transaction and returns it in transaction
      responses and webhooks. Grid does not require it to be unique. To find
      transactions by this value, use the `platformTransactionId` filter on
      `GET /transactions`.
    example: txn_9f84e0c2a72c4fa
  remittanceInformation:
    type: string
    maxLength: 80
    description: >-
      Free-form information about the payment that travels with it to the
      recipient. The field this populates depends on the payment rail: for ACH
      it populates the Addenda record, for FedNow and RTP it populates the
      remittanceInformation field, and for wires it populates the OBI
      (Originator to Beneficiary Information) / beneficiary information.
    example: '12345'
  purposeOfPayment:
    $ref: ../quotes/PurposeOfPayment.yaml
