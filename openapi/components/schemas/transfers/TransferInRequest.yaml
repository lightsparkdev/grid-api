type: object
required:
  - source
  - destination
properties:
  source:
    $ref: ./ExternalAccountReference.yaml
    description: Source external account details
  destination:
    $ref: ./InternalAccountReference.yaml
    description: Destination internal account details
  amount:
    type: integer
    format: int64
    description: >-
      Amount in the smallest unit of the currency (e.g., cents for USD/EUR,
      satoshis for BTC)
    example: 12550
  platformTransactionId:
    type: string
    maxLength: 255
    description: >-
      Your platform's identifier for the transaction this request creates.
      It must be unique across your platform's transactions, including
      transactions that expired, failed, or were refunded. A value that is
      already in use returns `409 DUPLICATE_PLATFORM_TRANSACTION_ID`. Grid
      returns it on the transaction in API responses and webhooks. To look
      up a transaction by this value, use the `platformTransactionId` filter
      on `GET /transactions`.
    example: txn_9f84e0c2a72c4fa
