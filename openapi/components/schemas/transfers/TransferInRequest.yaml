type: object
required:
  - source
  - destination
properties:
  source:
    $ref: ./ExternalAccountReference.yaml
    description: Source external account details
  destination:
    $ref: ./InternalAccountReference.yaml
    description: Destination internal account details
  amount:
    type: integer
    format: int64
    description: >-
      Amount in the smallest unit of the currency (e.g., cents for USD/EUR,
      satoshis for BTC)
    example: 12550
  platformTransactionId:
    type: string
    maxLength: 255
    description: >-
      Your platform's identifier for the transaction this request creates.
      Grid stores it on the transaction and returns it in transaction
      responses and webhooks. Grid does not require it to be unique. To find
      transactions by this value, use the `platformTransactionId` filter on
      `GET /transactions`.
    example: txn_9f84e0c2a72c4fa
