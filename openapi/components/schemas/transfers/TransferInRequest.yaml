type: object
required:
  - source
  - destination
properties:
  source:
    $ref: ./ExternalAccountReference.yaml
    description: Source external account details
  destination:
    $ref: ./InternalAccountReference.yaml
    description: Destination internal account details
  amount:
    type: integer
    format: int64
    description: >-
      Amount in the smallest unit of the currency (e.g., cents for USD/EUR,
      satoshis for BTC)
    example: 12550
  platformTransactionId:
    type: string
    minLength: 1
    maxLength: 255
    description: >-
      Your platform's ID for the resulting transaction. Must be unique per
      platform.
    example: txn_9f84e0c2a72c4fa
