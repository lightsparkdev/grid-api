title: Sweep Failure
type: object
description: >-
  A payment that settled into a rule-based account but was not swept to the
  destination of the account's rule.
required:
  - sourceAccountId
  - destinationAccountId
  - amount
  - incomingTransactionId
  - reason
  - canonicalAccountId
properties:
  sourceAccountId:
    type: string
    description: The rule-based internal account the payment settled into.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000005
  destinationAccountId:
    type: string
    description: >-
      The destination configured on the account's rule, which the funds did not
      reach.
    example: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
  amount:
    allOf:
      - $ref: ../common/CurrencyAmount.yaml
    description: The amount that could not be swept.
  incomingTransactionId:
    type: string
    description: >-
      The transaction that brought the funds into the rule-based account.
      Delivery of this event is at-least-once, so deduplicate on this value.
    example: Transaction:019542f5-b3e7-1d02-0000-000000000010
  sendTransactionId:
    type:
      - string
      - 'null'
    description: >-
      The operation covering both the deposit into the rule-based account and
      the sweep out of it, present once the sweep got far enough to create one.
      Null when the sweep was never attempted. Use it to correlate this event
      with the `OUTGOING_PAYMENT.FAILED` event for the same sweep rather than
      counting the failure twice.
    example: Transaction:019542f5-b3e7-1d02-0000-000000000011
  reason:
    allOf:
      - $ref: ./SweepFailureReason.yaml
    description: Why the sweep could not be completed.
    example: BELOW_MINIMUM
  canonicalAccountId:
    type: string
    description: >-
      The account holder's own account in the same currency that the funds were
      moved to — the customer's, or the platform's for a platform-owned
      rule-based account. A rule-based account never holds a balance, so a sweep
      that cannot reach its destination always lands the funds here.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000006
