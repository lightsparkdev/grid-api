title: Wallet Operation Failed Data
type: object
required:
  - operationId
  - requestId
  - operationType
  - resourceType
  - resourceId
  - status
  - error
properties:
  operationId:
    type: string
    description: >-
      Grid-internal identifier for this operation. Useful when contacting
      support about a specific operation; not a correlation key — use
      `requestId` to match this webhook to the request you made.
    example: Operation:019542f5-b3e7-1d02-0000-000000000099
  requestId:
    type: string
    description: >-
      The `Request-Id` you supplied on the signed retry that produced this
      terminal result — the same value you would have echoed on every retry
      had you received a `200 { status: "PROCESSING" }` response while it was
      settling. This is the primary way to correlate this webhook to the
      request you made.
    example: Request:9f7a2c10-5e88-4fb1-bd0e-1c3a8e7b2d45
  operationType:
    type: string
    description: The kind of operation that reached a terminal state.
    enum:
      - auth_credential.delete
      - session.revoke
      - wallet.export
    example: wallet.export
  resourceType:
    type: string
    description: >-
      The kind of business resource `resourceId` identifies. Determined by
      `operationType`: `auth_credential.delete` → `AUTH_METHOD`,
      `session.revoke` → `SESSION`, `wallet.export` → `INTERNAL_ACCOUNT`.
    enum:
      - AUTH_METHOD
      - SESSION
      - INTERNAL_ACCOUNT
    example: SESSION
  resourceId:
    type: string
    description: >-
      LSID of the business resource this operation affected: the deleted
      `AuthMethod:<uuid>` for `auth_credential.delete`, the revoked
      `Session:<uuid>` for `session.revoke`, or the `InternalAccount:<uuid>`
      whose wallet was exported for `wallet.export`.
    example: Session:019542f5-b3e7-1d02-0000-00000000009a
  status:
    type: string
    enum:
      - failed
    description: Terminal status of the operation.
    example: failed
  error:
    $ref: ./OperationError.yaml
