type: object
required:
  - reason
  - code
properties:
  code:
    type: string
    description: |
      | Error Code | Description |
      |------------|-------------|
      | FORBIDDEN | Insufficient permissions. `details.refusalReason` names the cause when Grid knows it |
      | USER_NOT_READY | Customer exists but is not ready for operation |
      | COUNTERPARTY_NOT_ALLOWED | Counterparty has not been enabled for your account |
      | VELOCITY_LIMIT_EXCEEDED | Counterparty has exceeded velocity limits |
      | END_USER_TERMS_NOT_ACCEPTED | Customer has not accepted the End User Terms |
      | CUSTOMER_NOT_VERIFIED | The customer is not verified and cannot perform this action |
      | SANCTION_BLOCKED | Blocked by sanction screening |
      | DESTINATION_NOT_ALLOWED | The agent may not pay this destination |
      | CORRIDOR_UNDER_MAINTENANCE | Payments to this corridor are paused for maintenance. |
    enum:
      - FORBIDDEN
      - USER_NOT_READY
      - COUNTERPARTY_NOT_ALLOWED
      - VELOCITY_LIMIT_EXCEEDED
      - END_USER_TERMS_NOT_ACCEPTED
      - CUSTOMER_NOT_VERIFIED
      - SANCTION_BLOCKED
      - DESTINATION_NOT_ALLOWED
      - CORRIDOR_UNDER_MAINTENANCE
  reason:
    type: string
    description: Error message
  details:
    type: object
    description: >-
      Additional error details. Shape varies by `code`. A `FORBIDDEN` refusal
      with a known cause carries `refusalReason`, plus the fields that reason
      names.
    properties:
      refusalReason:
        $ref: ./RefusalReason.yaml
      permission:
        type: string
        description: >-
          The `AgentPermission` the agent's policy lacks. Present with refusal
          reason `AGENT_PERMISSION_REQUIRED`. Grid may add permissions, so
          accept a value not yet listed there.
        example: ISSUE_CARDS
      policyDenialReason:
        $ref: ../agents/AgentPolicyDenialReason.yaml
        description: >-
          The policy rule that denied the quote. Present with refusal reason
          `AGENT_POLICY_DENIED`.
    additionalProperties: true
