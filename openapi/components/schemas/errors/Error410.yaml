type: object
required:
  - reason
  - code
properties:
  code:
    type: string
    description: |
      | Error Code | Description |
      |------------|-------------|
      | CUSTOMER_DELETED | Customer has been permanently deleted |
      | QUOTE_EXPIRED | The quote has expired and can no longer be acted on; request a new quote |
    enum:
      - CUSTOMER_DELETED
      - QUOTE_EXPIRED
  reason:
    type: string
    description: Error message
  details:
    type: object
    description: Additional error details
    additionalProperties: true
