type: object
required:
  - reason
  - code
properties:
  code:
    type: string
    description: |
      | Error Code | Description |
      |------------|-------------|
      | SERVICE_UNAVAILABLE | Downstream service is temporarily unavailable |
      | CORRIDOR_UNAVAILABLE | Payments to this corridor are temporarily switched off, for example for maintenance. Retry later |
    enum:
      - SERVICE_UNAVAILABLE
      - CORRIDOR_UNAVAILABLE
  reason:
    type: string
    description: Error message
  details:
    type: object
    description: Additional error details
    additionalProperties: true
