type: object
required:
  - reason
  - code
properties:
  code:
    type: string
    description: |
      | Error Code | Description |
      |------------|-------------|
      | DOCUMENT_REJECTED | The verification provider screened the uploaded file and marked it unusable. `precheckErrors` names each problem it found |
      | PERIOD_NOT_REPORTABLE | No statement is available for the requested window. Retrying will not change that |
    enum:
      - DOCUMENT_REJECTED
      - PERIOD_NOT_REPORTABLE
  reason:
    type: string
    description: Error message
  precheckErrors:
    type: array
    description: >-
      One entry per problem the verification provider found in the uploaded
      file, passed through verbatim. Common values are `dataNotReadable` (the
      data on the document cannot be read), `screenshot` (the file is a screen
      capture rather than a photo or scan), `grayscale` (a black-and-white copy
      of a color document), and `documentExpired`.
    items:
      type: string
    example:
      - dataNotReadable
  details:
    type: object
    description: Additional error details
    additionalProperties: true
