type: object
required:
  - reason
  - code
properties:
  code:
    type: string
    description: |
      | Error Code | Description |
      |------------|-------------|
      | GRID_SWITCH_ERROR | Grid switch error |
      | INTERNAL_ERROR | Internal server or UMA error |
    enum:
      - GRID_SWITCH_ERROR
      - INTERNAL_ERROR
  reason:
    type: string
    description: Error message
  details:
    type: object
    description: Additional error details
    additionalProperties: true
