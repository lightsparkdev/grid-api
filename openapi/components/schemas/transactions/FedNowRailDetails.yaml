title: FedNow Transfer
description: An instant payment over the FedNow Service.
allOf:
  - $ref: ./BaseUsdBankRailDetails.yaml
  - type: object
    required:
      - paymentRail
      - status
    properties:
      paymentRail:
        type: string
        enum:
          - FEDNOW
      status:
        $ref: ./FedNowRailStatus.yaml
      endToEndId:
        type: string
        description: The originator's end-to-end reference for the payment.
        example: E2E-9f2c6b6f
      uetr:
        type: string
        description: >-
          Unique End-to-end Transaction Reference assigned to the payment. Often absent on FedNow.
        example: f47bbdd1-3d90-44c4-998d-a02bd814d5d3
      instructionId:
        type: string
        description: >-
          Point-to-point reference the instructing bank assigned to the payment
          instruction. Present only when the bank reports it.
        example: 20260607021214862B2Z1Q45804374247-1
      transactionId:
        type: string
        description: >-
          Transaction identification the first instructing bank assigned. Give it to
          the counterparty's bank to trace the payment.
        example: 20260607021214862B2Z1Q45804374247
      remittanceInformation:
        type: string
        description: Unstructured remittance information sent with the payment.
        example: 'INV-12345'
