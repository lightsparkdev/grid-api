title: FedNow Transfer
description: An instant payment over the FedNow Service.
allOf:
  - $ref: ./BaseUsdBankRailDetails.yaml
  - type: object
    required:
      - paymentRail
      - status
    properties:
      paymentRail:
        type: string
        enum:
          - FEDNOW
      status:
        type: string
        enum:
          - PENDING
          - SETTLED
          - FAILED
        description: |-
          Status of the payment on FedNow.

          | Status | Description |
          |--------|-------------|
          | `PENDING` | Submitted and awaiting the receiving bank's response. |
          | `SETTLED` | The receiving bank accepted the payment and the funds settled. |
          | `FAILED` | The receiving bank or the network rejected the payment and no funds moved. |
        example: SETTLED
      endToEndId:
        type: string
        description: The originator's end-to-end reference for the payment.
        example: E2E-9f2c6b6f
      remittanceInformation:
        type: string
        description: Unstructured remittance information sent with the payment.
        example: 'INV-12345'
