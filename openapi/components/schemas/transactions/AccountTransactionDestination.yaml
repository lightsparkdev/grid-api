title: Account Destination
allOf:
  - $ref: ./BaseTransactionDestination.yaml
  - type: object
    required:
      - accountId
      - destinationType
    properties:
      destinationType:
        type: string
        enum:
          - ACCOUNT
      accountId:
        type: string
        description: Destination account identifier
        example: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
      railDetails:
        $ref: ./RailDetailsOneOf.yaml
      onChainTransaction:
        $ref: ./OnChainTransaction.yaml
        deprecated: true
        description: >-
          Deprecated. Use `railDetails`, which carries the same hash and network when
          `paymentRail` is `ONCHAIN`.
    description: Destination account details
