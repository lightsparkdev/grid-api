title: ACH Transfer
description: A transfer over the ACH network.
allOf:
  - $ref: ./BaseUsdBankRailDetails.yaml
  - type: object
    required:
      - paymentRail
      - status
    properties:
      paymentRail:
        $ref: ./AchPaymentRail.yaml
      status:
        $ref: ./AchRailStatus.yaml
      traceNumber:
        type: string
        description: >-
          15-digit ACH trace number of the original entry. A return, dishonor,
          contest or reversal is a separate entry with its own trace, listed on
          its item in `events`.
        example: '021000020123456'
      statementDescriptor:
        type: string
        maxLength: 10
        description: >-
          The entry's Company Entry Description, which the receiving bank shows on
          the account holder's statement. On payments you originate, this is the
          quote's `statementDescriptor`, or Grid's default.
        example: PAYROLL
      addenda:
        type: string
        description: >-
          Payment-related text carried in the entry's addenda record. On payments you
          originate, this is the `remittanceInformation` you provided.
        example: 'INV-12345'
      returnedAt:
        type: string
        format: date-time
        description: When the receiving bank returned the entry. Present once the entry has been returned, including after a later dishonor or contest.
        example: '2026-10-01T14:00:00Z'
      returnCode:
        type: string
        pattern: '^R[0-9]{2}$'
        description: >-
          The NACHA return reason code the receiving bank returned the entry under,
          such as `R01` (insufficient funds) or `R10` (customer advises unauthorized).
          Present whenever `returnedAt` is. Group returns by this code to track your return
          rate for each reason, or by `returnCategory` for Nacha's threshold
          categories. NACHA may add codes, so accept any value matching the pattern.
        example: R01
      returnCategory:
        $ref: ./AchReturnCategory.yaml
        description: >-
          The Nacha return-rate category `returnCode` counts toward. Present only when
          the code is in one, so a return such as `R01` has `returnCode` but no
          `returnCategory`.
      dishonoredAt:
        type: string
        format: date-time
        description: When the originating bank dishonored the return. Present once `status` has reached `RETURN_DISHONORED`.
        example: '2026-10-04T14:00:00Z'
      contestedAt:
        type: string
        format: date-time
        description: When the receiving bank contested the dishonor. Present when `status` is `RETURN_CONTESTED`.
        example: '2026-10-07T14:00:00Z'
      reversedAt:
        type: string
        format: date-time
        description: When the originator reversed the entry. Present when `status` is `REVERSED`.
        example: '2026-10-01T14:00:00Z'
      events:
        type: array
        description: >-
          The entries sent in response to the original one, oldest first: its
          return, a dishonor of that return, a contest of the dishonor, and a
          reversal. Each is its own entry on the ACH network, so its
          `traceNumber`, once the bank reports it, is the one to quote to your
          bank about that event. Entries answering a reversal are listed in that
          reversal's own `events`. The fields above (`returnedAt`, `returnCode`,
          `dishonoredAt` and the rest) describe the original entry's return
          chain. Empty until the first event.
        items:
          $ref: ./AchEntryEvent.yaml
