title: ACH Transfer
description: A transfer over the ACH network.
allOf:
  - $ref: ./BaseUsdBankRailDetails.yaml
  - type: object
    required:
      - paymentRail
      - status
    properties:
      paymentRail:
        type: string
        enum:
          - ACH
          - ACH_SAME_DAY
      status:
        type: string
        enum:
          - PENDING
          - SETTLED
          - RETURNED
          - REVERSED
          - FAILED
        description: |-
          Status of the entry on the ACH network.

          | Status | Description |
          |--------|-------------|
          | `PENDING` | Submitted to the ACH network and not yet settled. |
          | `SETTLED` | The entry settled. |
          | `RETURNED` | The receiving bank returned the entry, before or after it settled. |
          | `REVERSED` | The originator reversed the entry after it settled. |
          | `FAILED` | The entry was rejected before submission and no funds moved. |

          A return or reversal can arrive days after `SETTLED`. This status reports the ACH
          entry; the transaction's top-level `status` reports where the funds are now, so a
          return moves the transaction to `FAILED`. If an incoming payment's return is
          dishonored and the credit comes back, the transaction moves to `COMPLETED` again
          while this status stays `RETURNED`. A returned payout stays `FAILED`, since it has
          already been refunded.
        example: SETTLED
      traceNumber:
        type: string
        description: 15-digit ACH trace number of the entry.
        example: '021000020123456'
      addenda:
        type: string
        description: >-
          Payment-related text carried in the entry's addenda record. On payments you
          originate, this is the `remittanceInformation` you provided.
        example: 'INV-12345'
      returnedAt:
        type: string
        format: date-time
        description: When the receiving bank returned the entry. Present when `status` is `RETURNED`.
        example: '2026-10-01T14:00:00Z'
      reversedAt:
        type: string
        format: date-time
        description: When the originator reversed the entry. Present when `status` is `REVERSED`.
        example: '2026-10-01T14:00:00Z'
