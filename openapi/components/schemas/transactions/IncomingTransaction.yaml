title: Incoming Transaction
allOf:
  - $ref: ./Transaction.yaml
  - type: object
    required:
      - type
    properties:
      type:
        type: string
        enum:
          - INCOMING
      source:
        $ref: ./TransactionSourceOneOf.yaml
      receivedAmount:
        $ref: ../common/CurrencyAmount.yaml
        description: >-
          Amount received in the recipient's currency. Absent until the amount
          is priced — a payment swept out of a rule-based account is created
          when the deposit settles, before its quote locks a rate.
      fees:
        type: integer
        format: int64
        description: >-
          The total fees available from the receive quote in the smallest unit
          of the sending currency (eg. cents).
        minimum: 0
        example: 10
      reconciliationInstructions:
        $ref: ../common/ReconciliationInstructions.yaml
        description: Included for all transactions except those with "CREATED" status
      failureReason:
        $ref: ./IncomingTransactionFailureReason.yaml
        description: >-
          If the transaction failed, this field provides the reason for failure.
          Set only when `status` is `FAILED`. A rule-based account whose sweep
          was refused is not a failure of this transaction — see
          `sweepFailureReason`.
      sweepFailureReason:
        allOf:
          - $ref: ./SweepFailureReason.yaml
        description: >-
          Why the onward sweep did not reach the rule's destination, when this
          payment settled into a rule-based account.


          Distinct from `failureReason`, and never set at the same time: the two
          describe different events and are told apart by `status`. This
          transaction **succeeded** — the deposit landed and `status` is
          `COMPLETED`; only the sweep out of the account was refused, and the
          funds are in `sweepCanonicalAccountId`. `failureReason` appears only
          when `status` is `FAILED`, meaning the payment itself did not credit.


          Omitted for any account that is not rule-based.
      sweepCanonicalAccountId:
        type: string
        description: >-
          The account holder's own account in the same currency the funds were
          moved to when a sweep could not be completed — the customer's, or the
          platform's for a platform-owned rule-based account. A rule-based
          account never holds a balance. Present whenever
          `sweepFailureReason` is.
