type: string
enum:
  - LNURLP_FAILED
  - PAY_REQUEST_FAILED
  - PAYMENT_APPROVAL_WEBHOOK_ERROR
  - PAYMENT_APPROVAL_TIMED_OUT
  - OFFRAMP_FAILED
  - MISSING_MANDATORY_PAYEE_DATA
  - QUOTE_EXPIRED
  - QUOTE_EXECUTION_FAILED
  - COLLECTION_FAILED
description: >-
  Reason for failure of an incoming transaction. This is used to provide more
  context on why a transaction failed. If the transaction is not in a failed
  state, this field is omitted. COLLECTION_FAILED means an inbound bank-rail
  collection deposit (e.g. a SWIFT wire) failed after arrival and did not
  credit — most commonly a compliance-screening rejection or an unresolved
  request for information, on either the collection provider's side or
  Grid's. Failed collections are returned to the sender per the collection
  provider's process.
