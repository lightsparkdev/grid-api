type: object
required:
  - currency
  - estimatedExchangeRate
  - min
  - max
properties:
  currency:
    $ref: ../common/Currency.yaml
  estimatedExchangeRate:
    type: number
    description: >-
      An estimated exchange rate from the sender's currency to this currency.
      This is not a locked rate and is subject to change when calling the quotes
      endpoint.
    exclusiveMinimum: 0
    example: 1.08
  min:
    type: integer
    format: int64
    description: The minimum amount that can be received in this currency.
    exclusiveMinimum: 0
    example: 1
  max:
    type: integer
    format: int64
    description: The maximum amount that can be received in this currency.
    exclusiveMinimum: 0
    example: 1000000
  purposeOfPaymentRestrictions:
    type: array
    description: >-
      The `purposeOfPayment` values this currency accepts, listed for each
      recipient type. Find the entry matching your recipient, then send one of
      its `allowedPurposes` when you create a quote. A value outside that list
      is rejected with `SENDER_NOT_ACCEPTED`. When a recipient type has no
      entry, no restriction is known for it. A receiving institution can still
      decline a payment after the quote for a reason outside this list.
    items:
      $ref: ./PurposeOfPaymentRestriction.yaml
  minSendingAmount:
    type: integer
    format: int64
    description: >-
      The minimum amount that can be sent for this currency, in the smallest
      unit of the sender's currency (e.g. cents for USD). Same semantics as
      `minSendingAmount` on the exchange rates endpoint. This is an estimate
      based on the current exchange rate and is subject to change when calling
      the quotes endpoint. Omitted when the sending-side bound cannot be
      resolved.
    minimum: 0
    example: 100
  maxSendingAmount:
    type: integer
    format: int64
    description: >-
      The maximum amount that can be sent for this currency, in the smallest
      unit of the sender's currency (e.g. cents for USD). Same semantics as
      `maxSendingAmount` on the exchange rates endpoint. This is an estimate
      based on the current exchange rate and is subject to change when calling
      the quotes endpoint. Omitted when the sending-side bound cannot be
      resolved.
    minimum: 0
    example: 500000
