type: object
required:
  - claimToken
  - quoteId
properties:
  claimToken:
    type: string
    minLength: 1
    maxLength: 128
    description: The claim token from the recipient's link.
  quoteId:
    type: string
    description: The quote from `POST /claimable-payouts/claim/quote`.
    example: Quote:019542f5-b3e7-1d02-0000-000000000006
