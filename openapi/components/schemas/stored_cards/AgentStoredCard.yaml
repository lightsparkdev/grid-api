type: object
description: >-
  A stored card the agent may use: its display fields only. The number is
  reached only through `POST /agents/me/stored-cards/{storedCardId}/reveal`.
allOf:
  - $ref: ./StoredCardDisplay.yaml
  - type: object
    required:
      - id
    properties:
      id:
        type: string
        maxLength: 64
        description: System-generated unique identifier of the stored card.
        example: StoredCard:019542f5-b3e7-1d02-0000-000000000077
