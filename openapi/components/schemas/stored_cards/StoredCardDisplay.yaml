type: object
description: >-
  What can be shown about a stored card. None of it is cardholder data a
  merchant could charge.
required:
  - lastFour
  - brand
  - funding
  - expiryMonth
  - expiryYear
properties:
  lastFour:
    type: string
    pattern: '^[0-9]{4}$'
    minLength: 4
    maxLength: 4
    description: Last four digits of the card number.
    example: '0005'
  brand:
    $ref: ./StoredCardBrand.yaml
  funding:
    $ref: ./StoredCardFunding.yaml
  issuerCountry:
    type: string
    minLength: 2
    maxLength: 2
    description: ISO 3166-1 alpha-2 country of the card's issuer, when the BIN data names one.
    example: US
  expiryMonth:
    type: integer
    minimum: 1
    maximum: 12
    description: Expiry month, 1 to 12.
    example: 8
  expiryYear:
    type: integer
    minimum: 2000
    maximum: 2199
    description: Four-digit expiry year.
    example: 2029
  nickname:
    type: string
    maxLength: 64
    description: The customer's own label for the card.
    example: Personal Visa
