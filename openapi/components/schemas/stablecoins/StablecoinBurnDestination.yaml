type: object
required: [type, rail]
properties:
  type:
    type: string
    enum: [EXTERNAL_ACCOUNT, GRID_INTERNAL_ACCOUNT]
    description: Burn destination variant.
  externalAccountId:
    type: string
    description: Grid bank `ExternalAccount` receiving fiat redemption proceeds. Required when `type` is `EXTERNAL_ACCOUNT`.
    example: ExternalAccount:019542f5-b3e7-1d02-0000-000000000205
  accountId:
    type: string
    description: Grid `InternalAccount` receiving fiat redemption proceeds through its bank funding instructions. Required when `type` is `GRID_INTERNAL_ACCOUNT`.
    example: InternalAccount:019542f5-b3e7-1d02-0000-000000000206
  rail:
    $ref: ./StablecoinBurnDestinationRail.yaml
allOf:
  - if:
      properties:
        type:
          const: EXTERNAL_ACCOUNT
    then:
      properties:
        externalAccountId: {}
      required: [externalAccountId]
      not:
        properties:
          accountId: {}
        required: [accountId]
  - if:
      properties:
        type:
          const: GRID_INTERNAL_ACCOUNT
    then:
      properties:
        accountId: {}
      required: [accountId]
      not:
        properties:
          externalAccountId: {}
        required: [externalAccountId]
