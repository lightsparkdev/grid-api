title: Rail Fee Config
allOf:
  - $ref: ./FeeConfig.yaml
  - type: object
    properties:
      feeType:
        enum:
          - RAIL
      rail:
        $ref: ../common/PaymentRail.yaml
        description: >-
          The rail used in the transaction. `ACH`, `ACH_SAME_DAY`, `RTP`, `FEDNOW` and
          `WIRE` are accepted today; other rails return a `NOT_IMPLEMENTED` error.
      direction:
        $ref: ./FeeDirection.yaml
      originator:
        $ref: ./FeeOriginator.yaml
    required:
      - rail
      - direction
      - originator
description: >-
  A fee charged when a transaction uses the specified rail. There can be at most one for
  a given rail, direction and originator. For example, a config with rail: ACH, direction: OUT,
  originator: GRID will charge a fee on all outgoing ACH transactions. `ACH` and
  `ACH_SAME_DAY` are separate rails, so price each one with its own config.
