allOf:
  - $ref: ./FeeConfig.yaml
  - type: object
    properties:
      feeType:
        enum:
          - RAIL
      rail:
        $ref: ../common/PaymentRail.yaml
        description: >-
          The rail used in the transaction. `ACH`, `RTP`, `FEDNOW` and `WIRE` are
          accepted today; other rails return a `NOT_IMPLEMENTED` error.
      direction:
        type: string
        enum:
          - IN
          - OUT
        description: >-
          Whether the money is coming in or going out, relative to Grid. Only `OUT` is accepted today.
        example: OUT
      originator:
        type: string
        enum:
          - GRID
          - EXTERNAL
        description: >-
          Who originated the movement over the rail. An ACH OUT where Grid is the originator means Grid is
          pushing out the funds, while an ACH OUT with an EXTERNAL originator indicates Grid received an
          ACH pull request from an external source.
        example: GRID
    required:
      - rail
      - direction
      - originator
description: >-
  A fee charged when a transaction uses the specified rail. There can be at most one for
  a given rail, direction and originator. For example, a config with rail: ACH, direction: OUT,
  originator: GRID will charge a fee on all outgoing ACH transactions.
