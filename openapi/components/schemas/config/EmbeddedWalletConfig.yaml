type: object
description: |
  Per-platform embedded-wallet configuration. Controls branding and OTP
  behavior for the email sent when a customer authenticates with an
  EMAIL_OTP credential. Fields omitted from a request are left unchanged.
properties:
  appName:
    type: string
    maxLength: 255
    description: App name displayed in the default OTP email template.
    example: Acme Wallet
  otpLength:
    type: integer
    minimum: 6
    maximum: 9
    description: |
      Number of digits / characters in the OTP code. Defaults to 6 when
      not set.
    example: 6
  alphanumeric:
    type: boolean
    description: |
      If true, OTP includes letters in addition to digits. Defaults to
      numeric-only when not set.
    example: false
  expirationSeconds:
    type: integer
    minimum: 1
    maximum: 600
    description: |
      OTP validity window in seconds. Defaults to 300 when not set.
    example: 300
  sendFromEmailAddress:
    type: string
    format: email
    maxLength: 255
    description: Custom sender email address for OTP emails.
    example: noreply@acme.com
  sendFromEmailSenderName:
    type: string
    maxLength: 255
    description: |
      Custom sender display name. Defaults to "Notifications" when not set.
    example: Acme Notifications
  replyToEmailAddress:
    type: string
    format: email
    maxLength: 255
    description: Custom reply-to email address for OTP emails.
    example: support@acme.com
  logoUrl:
    type: string
    format: uri
    maxLength: 512
    description: URL to a PNG logo for the OTP email. Resized to 340x124px.
    example: https://acme.com/logo.png
  walletProvisioning:
    $ref: ./WalletProvisioning.yaml
    description: |
      When this platform's customers' embedded wallets are created. Defaults
      to `AT_CUSTOMER_CREATE`. A change applies to customers whose
      embedded-wallet account isn't created yet.
  sessionLifetime:
    type: integer
    minimum: 60
    description: |
      How long each new embedded-wallet session lasts, in seconds, for this
      platform's customers: every sign-in and every session refresh. Defaults
      to 900 (15 minutes) when not set. At most the maximum a platform can
      configure, currently one year; a value above it is rejected. A change
      applies to sessions created after it.
    example: 3600
  networkFees:
    $ref: ./NetworkFeeMode.yaml
    description: |
      Who pays the network fee on this platform's customers' Embedded Wallet
      sends. Defaults to `GRID_PAYS`. A change applies to quotes created after
      it. Of cards, only those funded by an Embedded Wallet account on Tempo
      follow this setting, and each one's delegated key is created for the
      mode in force at the time, shown as the key's `networkFees`. A change
      does not move them: to move one to the new mode, revoke its delegated
      key with
      `DELETE /auth/delegated-keys/{id}` and delegate it again with
      `POST /auth/delegated-keys`. Cards funded on Spark pay no network fee. Card transfers Grid makes with an access
      key from a Tempo wallet your platform runs are always paid by Grid,
      whatever this setting.
