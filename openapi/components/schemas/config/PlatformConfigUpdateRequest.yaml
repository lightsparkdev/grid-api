type: object
properties:
  umaDomain:
    type: string
    example: mycompany.com
  webhookEndpoint:
    type: string
    example: https://api.mycompany.com/webhooks/uma
  supportedCurrencies:
    type: array
    items:
      $ref: ./PlatformCurrencyConfig.yaml
  embeddedWalletConfig:
    $ref: ./EmbeddedWalletConfig.yaml
    description: |
      Update or create the embedded-wallet configuration for this platform.
      Fields omitted from the nested object are left unchanged. Omit this
      field at the top level to leave the embedded-wallet configuration
      unchanged entirely.
  cardTokenization2faConfig:
    $ref: ./CardTokenization2FAConfig.yaml
    description: |
      Update card-tokenization authentication branding and delivery settings.
      Fields omitted from the nested object are left unchanged. Changes apply
      to subsequent delivery attempts.
  cardConfigs:
    $ref: ./CardConfig.yaml
    description: >-
      Update platform-level card settings. Fields omitted from the nested
      object are left unchanged. For `maxSpendPerTransaction`, supply null to
      clear the platform cap or a positive integer to set it. Omit this field
      at the top level to leave all card settings unchanged.
  feeConfigs:
    type: array
    items:
      $ref: ./FeeConfig.yaml
    description: |
      Merge-by-key upsert of platform fee configs, keyed by
      `(feeType, sourceCurrency)`. Setting variable and fixed fees to 0 for
      an existing fee config deactivates it. Only `sourceCurrency: USD` is
      accepted today. Omit this field to leave fee configs unchanged.
