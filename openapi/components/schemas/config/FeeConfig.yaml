type: object
description: >-
  A platform-configured fee collected by Grid and settled to the platform internal account. There can be at most one fee config for a given fee type and source currency pair. The fee will apply to all transactions of the fee type that originate in the source currency .
properties:
  id:
    type: string
    description: System-generated unique identifier.
    readOnly: true
    example: GridPlatformTransactionFeeConfig:019542f5-b3e7-1d02-0000-000000000007
  feeEventType:
    $ref: ./FeeEventType.yaml
  sourceCurrency:
    type: string
    description: >-
      Currency code of the sending side this fee applies to. Only `USD` is
      accepted today; other currencies return a `NOT_IMPLEMENTED` error.
    example: USD
  variableFeeBps:
    type: integer
    minimum: 0
    maximum: 10000
    description: >-
      Variable fee in basis points (1 bps = 0.01%) to apply to a transaction's source-currency amount.
    example: 30
  fixedFee:
    $ref: ../common/CurrencyAmount.yaml
    description: >-
      Fixed fee charged per transaction, in the smallest unit of
      `sourceCurrency`. `fixedFee.currency.code` must match `sourceCurrency`.
  isActive:
    type: boolean
    description: >-
      Whether this fee config is currently active. Reads return only active
      configs.
    readOnly: true
    example: true
required:
  - feeEventType
  - sourceCurrency
  - variableFeeBps
  - fixedFee
