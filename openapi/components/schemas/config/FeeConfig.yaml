type: object
description: >-
  A platform-configured fee collected by Grid and settled to the platform internal account. There can be at most one fee config for a given fee type and source currency pair. The fee will apply to all transactions of the fee type that originate in the source currency.
properties:
  feeType:
    $ref: ./FeeType.yaml
  sourceCurrency:
    type: string
    description: >-
      Currency code of the sending side this fee applies to. Only `USD` is
      accepted today; other currencies return a `NOT_IMPLEMENTED` error.
    example: USD
  variableFeeBps:
    type: integer
    minimum: 0
    maximum: 10000
    description: >-
      Variable fee in basis points (1 bps = 0.01%) to apply to a transaction's source-currency amount.
    example: 30
  fixedFee:
    type: object
    description: Fixed fee charged per transaction.
    properties:
      amount:
        type: integer
        format: int64
        minimum: 0
        description: >-
          Fee amount in the smallest unit of the fixed fee's `currency`
          (e.g., cents for USD).
        example: 100
      currency:
        type: string
        description: >-
          Three-letter currency code (ISO 4217) the fixed fee is denominated
          in. Some cryptocurrencies may use their own ticker symbols (e.g.
          "BTC" for Bitcoin, "USDC" for USDC, etc.)
        example: USD
    required:
      - amount
      - currency
required:
  - feeType
  - sourceCurrency
  - variableFeeBps
  - fixedFee
