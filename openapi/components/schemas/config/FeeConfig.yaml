type: object
description: >-
  A platform-configured fee collected by Grid and settled to the platform internal account. These fields are shared by every platform fee config.
properties:
  feeType:
    $ref: ./FeeType.yaml
  variableFeeBps:
    type: integer
    minimum: 0
    maximum: 10000
    description: >-
      Variable fee in basis points (1 bps = 0.01%) to apply to a transaction's source-currency amount.
    example: 30
  fixedFee:
    $ref: ./FixedFee.yaml
required:
  - feeType
  - variableFeeBps
  - fixedFee
