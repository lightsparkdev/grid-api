type: object
description: >-
  A fee you charge on cross-currency transactions. There can be at most one for a
  given source currency, and it applies to every cross-currency transaction that
  starts in it.
properties:
  feeType:
    $ref: ./FeeType.yaml
  sourceCurrency:
    type: string
    description: >-
      Currency code of the sending side this fee applies to. Only `USD` is
      accepted today; other currencies return a `NOT_IMPLEMENTED` error.
    example: USD
  variableFeeBps:
    type: integer
    minimum: 0
    maximum: 10000
    description: >-
      Variable fee in basis points (1 bps = 0.01%) to apply to a transaction's source-currency amount.
    example: 30
  fixedFee:
    $ref: ./FixedFee.yaml
required:
  - feeType
  - sourceCurrency
  - variableFeeBps
  - fixedFee
