type: string
enum:
  - GRID_PAYS
  - CUSTOMER_PAYS
description: >-
  Who pays the network fee when a customer's Embedded Wallet sends on a
  network that charges the sender one (Tempo today).

  - `GRID_PAYS`: Grid pays the fee. The wallet needs only the amount it sends,
  and the quote's `networkFee` is 0.

  - `CUSTOMER_PAYS`: The wallet pays the fee on chain, in the currency it
  sends, on top of the amount it sends. The quote's `networkFee` is the most
  the fee can cost, and the wallet must hold the amount plus that fee.
example: GRID_PAYS
