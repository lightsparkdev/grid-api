type: object
description: Platform-level settings that apply to cards issued by the platform.
properties:
  pinTargetOrigin:
    anyOf:
      - type: string
        format: uri
        pattern: '^https://(?:[^\s/?#@:\[\]\\]+|\[[0-9A-Fa-f:.]+\])(?::[0-9]{1,5})?$'
      - type: 'null'
    description: >-
      Canonical HTTPS origin of the page that hosts the PIN-entry iframe
      returned by `GET /cards/{id}/pin-entry-url`. Include the scheme, host,
      and optional port, without a path, trailing slash, query, fragment,
      or credentials. The iframe is restricted to this origin, so it must
      match the embedding page's origin exactly. Different user-specific
      paths on the same origin use this one setting.


      Required before requesting a PIN-entry URL. Omit this field when
      updating platform configuration to preserve its value; set it to
      `null` to clear it. If unset, PIN-entry URL requests return
      `409 CONFLICT`. Changes apply to newly requested URLs.
    example: https://app.example.com
  maxNetworkRiskScore:
    anyOf:
      - type: integer
        minimum: 0
        maximum: 999
      - type: 'null'
    description: >-
      Maximum normalized network risk score allowed for real-time card
      authorizations. Scores range from 0 (lowest risk) to 999 (highest risk).
      Visa scores are normalized by multiplying the raw 0–99 score by 10.
      Scores equal to the ceiling are allowed. Authorizations without a
      score are also allowed. The lowest configured card or platform ceiling
      applies.
      Omit to preserve the current setting or send null to clear this scope.
    example: 700
  panRevealCssUrl:
    anyOf:
      - type: string
        format: uri
        pattern: '^https://[^@]*$'
        maxLength: 512
      - type: 'null'
    description: >-
      HTTPS URL of a stylesheet that styles the card-details iframe returned
      by `POST /cards/{id}/reveal`, so the revealed PAN, expiry, and CVV carry
      your branding instead of the default. The card processor's page links
      the stylesheet and the cardholder's browser fetches it, so it must be
      reachable over HTTPS without credentials. Style the `card`, `pan`,
      `expiry`, and `cvv` ids and the `pan-separator` class; the rest of the
      page structure is not a contract. The stylesheet loads into the page
      rendering the live card details, so host it somewhere you would trust
      with them. `null` restores the default styling. A `cssUrl` in the body of
      `POST /cards/{id}/reveal` overrides this for one reveal. Applies to cards
      whose `cardCapabilities.supportsPanReveal` is true; cards revealed through
      the card issuer's own hosted flow are styled by that issuer.
    example: https://acme.com/card-reveal.css
  authorizationEndpoint:
    anyOf:
      - $ref: ../cards/CardAuthorizationEndpoint.yaml
      - type: 'null'
    description: >-
      The endpoint Grid calls for a real-time decision on each card
      authorization that Grid's own checks approve. See the
      `CARD_AUTHORIZATION.REQUEST` webhook for the request it receives and
      the decision it must return. `null` while no endpoint is set, in which
      case Grid's own checks decide every authorization.


      When an update sets this field, Grid first sends the endpoint one signed
      `CARD_AUTHORIZATION.REQUEST` with `data.isTest: true` and example data.
      The endpoint should answer it without running its business checks. The
      update succeeds only if the endpoint returns `200` with a valid
      `CardAuthorizationDecision` within 1.5 seconds. The decision in
      that response is ignored. Otherwise the update returns
      `400 WEBHOOK_DELIVERY_ERROR` and none of its changes apply.


      Omit this field to preserve the endpoint. Send an object to set or
      replace it, or send `null` to remove it. Changes apply to authorizations
      that arrive after the update returns.
    example:
      url: https://api.mycompany.com/grid/card-authorizations
      timeoutBehavior: DECLINE
