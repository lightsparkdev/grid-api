type: object
description: Platform-level settings that apply to cards issued by the platform.
properties:
  pinTargetOrigin:
    anyOf:
      - type: string
        format: uri
        pattern: '^https://(?:[^\s/?#@:\[\]\\]+|\[[0-9A-Fa-f:.]+\])(?::[0-9]{1,5})?$'
      - type: 'null'
    description: >-
      Canonical HTTPS origin of the page that hosts the PIN-entry iframe
      returned by `GET /cards/{id}/set-pin-url`. Include the scheme, host,
      and optional port, without a path, trailing slash, query, fragment,
      or credentials. The iframe is restricted to this origin, so it must
      match the embedding page's origin exactly. Different user-specific
      paths on the same origin use this one setting.


      Required before requesting a PIN-entry URL. Omit this field when
      updating platform configuration to preserve its value; set it to
      `null` to clear it. If unset, PIN-entry URL requests return
      `409 CONFLICT`. Changes apply to newly requested URLs.
    example: https://app.example.com
  maxSpendPerTransaction:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      The largest amount any of your cards can authorize on a single
      transaction, in the smallest unit of each card's currency (cents for
      USD). An authorization for exactly the limit is allowed. A later clearing
      can still settle above it — a restaurant tip, for example — so this caps
      the authorization, not the final settled amount. It covers every card
      Grid makes authorization decisions for, both those you have already
      issued and any you issue later, and does not apply to cards whose issuer
      makes the decisions. Where a card sets its own `maxSpendPerTransaction`,
      the lower of the two applies. `null` means no platform-wide limit.
    example: 10000
  maxSpendPerDay:
    anyOf:
      - type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      - type: 'null'
    description: >-
      Platform-level cap on cumulative new spend during one UTC calendar day
      for every card whose authorization decisions are made by Grid. The value
      is interpreted in the smallest unit of each card's currency. Grid
      enforces the lower of this cap and the card's configured
      `maxSpendPerDay`; null means no platform-level daily cap. The window
      resets at 00:00 UTC. Refunds, reversals, and authorization expiries do not
      restore capacity during the day. The cap applies to existing cards and
      cards issued later. Provider-decided card programs are unaffected.
    example: 50000
  maxTransactionsPerDay:
    anyOf:
      - type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
      - type: 'null'
    description: >-
      Platform-level cap on the number of transactions each card may authorize
      during one UTC calendar day, for every card whose authorization
      decisions are made by Grid. Grid enforces the lower of this cap and the
      card's configured `maxTransactionsPerDay`; null means no platform-level
      daily transaction cap. The window resets at 00:00 UTC. Each approved
      authorization counts once; refunds, reversals, and authorization
      expiries do not restore capacity during the day. The cap applies to
      existing cards and cards issued later. Provider-decided card programs
      are unaffected.
    example: 50
  panRevealCssUrl:
    anyOf:
      - type: string
        format: uri
        pattern: '^https://[^@]*$'
        maxLength: 512
      - type: 'null'
    description: >-
      HTTPS URL of a stylesheet that styles the card-details iframe returned
      by `POST /cards/{id}/reveal`, so the revealed PAN, expiry, and CVV carry
      your branding instead of the default. The card processor's page links
      the stylesheet and the cardholder's browser fetches it, so it must be
      reachable over HTTPS without credentials. Style the `card`, `pan`,
      `expiry`, and `cvv` ids and the `pan-separator` class; the rest of the
      page structure is not a contract. The stylesheet loads into the page
      rendering the live card details, so host it somewhere you would trust
      with them. `null` restores the default styling. A `cssUrl` in the body of
      `POST /cards/{id}/reveal` overrides this for one reveal. Applies to cards
      whose `cardCapabilities.supportsPanReveal` is true; cards revealed through
      the card issuer's own hosted flow are styled by that issuer.
    example: https://acme.com/card-reveal.css
