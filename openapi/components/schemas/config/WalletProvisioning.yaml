type: string
enum:
  - AT_CUSTOMER_CREATE
  - AT_FIRST_CREDENTIAL
description: >-
  When a customer's embedded wallet is created. Each customer keeps the mode
  the platform had when the customer was created.

  - `AT_CUSTOMER_CREATE`: Once the customer is eligible, with the customer's
  email as the wallet's first `EMAIL_OTP` credential. Creating a customer
  requires an email.

  - `AT_FIRST_CREDENTIAL`: When the first auth credential is added to the
  customer's embedded-wallet account. Once the customer is eligible, the
  account is created and stays `PENDING` until then. Creating a customer
  requires no email.
