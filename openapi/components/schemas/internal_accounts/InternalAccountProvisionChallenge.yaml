title: Internal Account Provision Challenge
description: >-
  `202` response from `POST /internal-accounts/{id}/provision`. Stamp
  `payloadToSign` with the session API keypair of a verified credential on
  any of the customer's Embedded Wallet internal accounts, then retry the
  same request with the full stamp in `Grid-Wallet-Signature` and the
  `requestId` echoed in `Request-Id`.
allOf:
  - $ref: ../common/SignedRequestChallenge.yaml
  - type: object
    required:
      - currencies
    properties:
      currencies:
        type: array
        description: >-
          Currency codes of the accounts the signed retry opens. Show them to
          the customer before asking for the signature.
        items:
          type: string
        example:
          - OUSD
