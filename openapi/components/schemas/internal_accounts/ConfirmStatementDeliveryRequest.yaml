type: object
required:
  - periodStart
properties:
  periodStart:
    type: string
    format: date
    description: >-
      First day of the statement period being confirmed. Must be the first
      day of a month that has already begun.
    example: '2026-09-01'
  deliveredAt:
    type: string
    format: date-time
    description: >-
      When the statement was delivered to the customer. Must include a
      timezone offset and must not be in the future. Defaults to the current
      time.
    example: '2026-10-03T14:31:00Z'
