type: object
required:
  - statementMonth
  - statementDeliveredAt
properties:
  statementMonth:
    type: string
    pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    description: >-
      The statement month the receipt covers, as `YYYY-MM`. A statement month is
      a calendar month in US Central time, and it must have already begun.
    example: '2026-09'
  statementDeliveredAt:
    type: string
    format: date-time
    description: >-
      When you issued the statement to the customer. Must include a timezone
      offset, must not be in the future, and must be at or after the end of
      the period.
    example: '2026-10-03T14:31:00Z'
