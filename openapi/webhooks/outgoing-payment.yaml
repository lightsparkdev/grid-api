post:
  summary: Outgoing payment status webhook
  description: >
    Webhook that is called when an outgoing payment's status changes. A side's
    `railDetails` carries the rail-level status of that leg; for example, a payout
    the receiving bank returns arrives as `OUTGOING_PAYMENT.FAILED` with
    `destination.railDetails.status` set to `RETURNED`, and the payout is refunded
    to its source. A returned payout stays `FAILED` even if the receiving bank later
    dishonors the return: the refund has already been posted, so the funds are
    reconciled manually and no further status event is sent for the payout.

    This endpoint should be implemented by clients of the Grid API.


    ### Authentication

    The webhook includes a signature in the `X-Grid-Signature` header that
    allows you to verify that the webhook was sent by Grid.

    To verify the signature:

    1. Get the Grid public key provided to you during integration

    2. Decode the base64 signature from the header

    3. Create a SHA-256 hash of the request body

    4. Verify the signature using the public key and the hash


    If the signature verification succeeds, the webhook is authentic. If not, it
    should be rejected.


    This webhook is informational only and is sent when an outgoing payment
    completes successfully, fails, or is refunded.
  operationId: outgoingPaymentWebhook
  tags:
    - Webhooks
  security:
    - WebhookSignature: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/webhooks/OutgoingPaymentWebhook.yaml'
        examples:
          outgoingCompletedPayment:
            summary: Completed outgoing payment
            value:
              id: Webhook:019542f5-b3e7-1d02-0000-000000000007
              type: OUTGOING_PAYMENT.COMPLETED
              timestamp: '2025-08-15T14:32:00Z'
              data:
                id: Transaction:019542f5-b3e7-1d02-0000-000000000005
                status: COMPLETED
                type: OUTGOING
                direction: DEBIT
                source:
                  sourceType: ACCOUNT
                  accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                destination:
                  destinationType: ACCOUNT
                  accountId: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                customerId: Customer:019542f5-b3e7-1d02-0000-000000000001
                platformCustomerId: 18d3e5f7b4a9c2
                senderUmaAddress: $sender@uma.domain
                receiverUmaAddress: $recipient@external.domain
                sentAmount:
                  amount: 10550
                  currency:
                    code: USD
                    name: United States Dollar
                    symbol: $
                    decimals: 2
                receivedAmount:
                  amount: 9706
                  currency:
                    code: EUR
                    name: Euro
                    symbol: €
                    decimals: 2
                exchangeRate: 0.92
                quoteId: Quote:019542f5-b3e7-1d02-0000-000000000006
                settledAt: '2025-08-15T14:30:00Z'
                createdAt: '2025-08-15T14:25:18Z'
                description: 'Payment for invoice #1234'
                paymentInstructions: []
                rateDetails:
                  counterpartyMultiplier: 1.08
                  counterpartyFixedFee: 10
                  gridApiMultiplier: 0.925
                  gridApiFixedFee: 10
                  gridApiVariableFeeRate: 0.003
                  gridApiVariableFeeAmount: 30
          outgoingCompletedCryptoPayment:
            summary: Completed crypto payout to an external wallet
            value:
              id: Webhook:019542f5-b3e7-1d02-0000-000000000008
              type: OUTGOING_PAYMENT.COMPLETED
              timestamp: '2025-08-15T14:32:00Z'
              data:
                id: Transaction:019542f5-b3e7-1d02-0000-000000000009
                status: COMPLETED
                type: OUTGOING
                direction: DEBIT
                source:
                  sourceType: ACCOUNT
                  accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                destination:
                  destinationType: ACCOUNT
                  accountId: ExternalAccount:c34dcbd6-dced-4ec4-b756-3c3a9ea3d789
                  railDetails:
                    paymentRail: ONCHAIN
                    transactionHash: h82pJGF9p7kpzb6eU326EFZf2cDnimbTFVeJtx1qtBmUNJAEqN76R7PwPfHt3oWb8R6cKvhgyxQdDn53jFrK6wFx
                    network: SOLANA
                  onChainTransaction:
                    transactionHash: h82pJGF9p7kpzb6eU326EFZf2cDnimbTFVeJtx1qtBmUNJAEqN76R7PwPfHt3oWb8R6cKvhgyxQdDn53jFrK6wFx
                    network: SOLANA
                customerId: Customer:019542f5-b3e7-1d02-0000-000000000001
                platformCustomerId: 18d3e5f7b4a9c2
                sentAmount:
                  amount: 100000
                  currency:
                    code: USDC
                    name: USD Coin
                    symbol: ''
                    decimals: 6
                receivedAmount:
                  amount: 100000
                  currency:
                    code: USDC
                    name: USD Coin
                    symbol: ''
                    decimals: 6
                quoteId: Quote:019542f5-b3e7-1d02-0000-000000000010
                settledAt: '2025-08-15T14:30:00Z'
                createdAt: '2025-08-15T14:25:18Z'
                description: USDC withdrawal to self-custody wallet
                paymentInstructions: []
          outgoingAchPaymentReturned:
            summary: ACH payout returned by the receiving bank
            description: >-
              The payout settled, and the receiving bank later returned the ACH entry.
              The transaction moves to `FAILED` with `PAYOUT_RETURNED`, and the
              destination's `railDetails` moves to `RETURNED`. The refund back to the
              source follows as `OUTGOING_PAYMENT.REFUND_PENDING` and
              `OUTGOING_PAYMENT.REFUND_COMPLETED`.
            value:
              id: Webhook:019542f5-b3e7-1d02-0000-000000000011
              type: OUTGOING_PAYMENT.FAILED
              timestamp: '2025-08-18T15:02:00Z'
              data:
                id: Transaction:019542f5-b3e7-1d02-0000-000000000012
                status: FAILED
                type: OUTGOING
                direction: DEBIT
                source:
                  sourceType: ACCOUNT
                  accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                destination:
                  destinationType: ACCOUNT
                  accountId: ExternalAccount:b23dcbd6-dced-4ec4-b756-3c3a9ea3d456
                  railDetails:
                    paymentRail: ACH
                    status: RETURNED
                    bankAccount:
                      accountHolderName: Jane Receiver
                      routingNumber: '021000021'
                      accountNumber: '****4321'
                    traceNumber: '021000020123456'
                    addenda: 'INV-2025-0815'
                    settledAt: '2025-08-15T14:30:00Z'
                    returnedAt: '2025-08-18T15:00:00Z'
                customerId: Customer:019542f5-b3e7-1d02-0000-000000000001
                platformCustomerId: 18d3e5f7b4a9c2
                sentAmount:
                  amount: 50000
                  currency:
                    code: USD
                    name: United States Dollar
                    symbol: $
                    decimals: 2
                receivedAmount:
                  amount: 50000
                  currency:
                    code: USD
                    name: United States Dollar
                    symbol: $
                    decimals: 2
                quoteId: Quote:019542f5-b3e7-1d02-0000-000000000013
                settledAt: '2025-08-15T14:30:00Z'
                createdAt: '2025-08-15T14:25:18Z'
                description: Vendor payout
                paymentInstructions: []
                failureReason: PAYOUT_RETURNED
          failedPayment:
            summary: Failed outgoing payment
            value:
              id: Webhook:019542f5-b3e7-1d02-0000-000000000007
              type: OUTGOING_PAYMENT.FAILED
              timestamp: '2025-08-15T14:32:00Z'
              data:
                id: Transaction:019542f5-b3e7-1d02-0000-000000000005
                status: FAILED
                type: OUTGOING
                direction: DEBIT
                source:
                  sourceType: ACCOUNT
                  accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                destination:
                  destinationType: ACCOUNT
                  accountId: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                customerId: Customer:019542f5-b3e7-1d02-0000-000000000001
                platformCustomerId: 18d3e5f7b4a9c2
                senderUmaAddress: $sender@uma.domain
                receiverUmaAddress: $recipient@external.domain
                sentAmount:
                  amount: 10550
                  currency:
                    code: USD
                    name: United States Dollar
                    symbol: $
                    decimals: 2
                createdAt: '2025-08-15T14:25:18Z'
                quoteId: Quote:019542f5-b3e7-1d02-0000-000000000006
                failureReason: QUOTE_EXECUTION_FAILED
  responses:
    '200':
      description: Webhook received successfully
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized - Signature validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors/Error401.yaml
    '409':
      description: Conflict - Webhook has already been processed (duplicate id)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors/Error409.yaml
