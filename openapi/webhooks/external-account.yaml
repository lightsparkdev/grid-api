post:
  summary: External account ownership verification status change
  description: >
    Webhook that is called when the ownership verification status of an
    external account changes.

    This endpoint should be implemented by clients of the Grid API.


    ### Authentication

    The webhook includes a signature in the `X-Grid-Signature` header that
    allows you to verify that the webhook was sent by Grid.

    To verify the signature:

    1. Get the Grid public key provided to you during integration

    2. Decode the base64 signature from the header

    3. Create a SHA-256 hash of the request body

    4. Verify the signature using the public key and the hash


    If the signature verification succeeds, the webhook is authentic. If not, it
    should be rejected.


    ### Event types

    - `EXTERNAL_ACCOUNT.OWNERSHIP_VERIFICATION_NOT_REQUIRED` — Fired when an
    external account is created and ownership verification does not apply to
    it. The `data` payload contains the full external account object.

    - `EXTERNAL_ACCOUNT.OWNERSHIP_VERIFICATION_REQUIRED` — Fired when an
    external account requires ownership verification before transfers above
    regulatory thresholds can be sent to it. The `data` payload contains the
    full external account object.

    - `EXTERNAL_ACCOUNT.OWNERSHIP_VERIFICATION_PENDING_REVIEW` — Fired when a
    submitted ownership verification enters review. The `data` payload contains
    the full external account object.

    - `EXTERNAL_ACCOUNT.OWNERSHIP_VERIFICATION_VERIFIED` — Fired when ownership
    of the external account has been verified. The `data` payload contains the
    full external account object.

    - `EXTERNAL_ACCOUNT.OWNERSHIP_VERIFICATION_FAILED` — Fired when an
    ownership verification attempt fails; a new verification can be started.
    The `data` payload contains the full external account object.


  operationId: externalAccountWebhook
  tags:
    - Webhooks
  security:
    - WebhookSignature: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/webhooks/ExternalAccountWebhook.yaml
        examples:
          ownershipVerified:
            summary: Ownership of a self-custody wallet has been verified
            value:
              id: Webhook:019542f5-b3e7-1d02-0000-000000000040
              type: EXTERNAL_ACCOUNT.OWNERSHIP_VERIFICATION_VERIFIED
              timestamp: '2025-08-15T14:32:00Z'
              data:
                id: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                customerId: Customer:da459a29-1fb7-41ce-a4cb-eb3a3c9fd7a7
                status: ACTIVE
                currency: USDC
                ownershipType: FIRST_PARTY
                ownershipVerificationStatus: VERIFIED
                accountInfo:
                  accountType: ETHEREUM_WALLET
                  address: '0xAbCDEF1234567890aBCdEf1234567890ABcDef12'
          ownershipVerificationFailed:
            summary: An ownership verification attempt failed
            value:
              id: Webhook:019542f5-b3e7-1d02-0000-000000000041
              type: EXTERNAL_ACCOUNT.OWNERSHIP_VERIFICATION_FAILED
              timestamp: '2025-08-15T14:32:00Z'
              data:
                id: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                customerId: Customer:da459a29-1fb7-41ce-a4cb-eb3a3c9fd7a7
                status: ACTIVE
                currency: USDC
                ownershipType: FIRST_PARTY
                ownershipVerificationStatus: FAILED
                accountInfo:
                  accountType: ETHEREUM_WALLET
                  address: '0xAbCDEF1234567890aBCdEf1234567890ABcDef12'
  responses:
    '200':
      description: >
        Webhook received successfully
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized - Signature validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors/Error401.yaml
    '409':
      description: Conflict - Webhook has already been processed (duplicate id)
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors/Error409.yaml
