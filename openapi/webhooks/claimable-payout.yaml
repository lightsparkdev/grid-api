post:
  summary: Claimable payout webhook
  description: >
    Fired when a claimable payout is claimed, paid, expires or fails, so the
    platform can tell the sender. `CLAIMABLE_PAYOUT.EXPIRED` and
    `CLAIMABLE_PAYOUT.FAILED` mean the hold on the sender's wallet was
    released.

    This endpoint should be implemented by clients of the Grid API.


    ### Authentication

    The webhook includes a signature in the `X-Grid-Signature` header that
    allows you to verify that the webhook was sent by Grid.

    To verify the signature:

    1. Get the Grid public key provided to you during integration

    2. Decode the base64 signature from the header

    3. Create a SHA-256 hash of the request body

    4. Verify the signature using the public key and the hash


    If the signature verification succeeds, the webhook is authentic. If not, it
    should be rejected.
  operationId: claimablePayoutWebhook
  tags:
    - Webhooks
  security:
    - WebhookSignature: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/webhooks/ClaimablePayoutWebhook.yaml'
        examples:
          paid:
            summary: Claimable payout paid
            value:
              id: Webhook:019542f5-b3e7-1d02-0000-000000000021
              type: CLAIMABLE_PAYOUT.PAID
              timestamp: '2025-10-04T09:00:00Z'
              data:
                id: ClaimablePayout:019542f5-b3e7-1d02-0000-000000000077
                agentId: Agent:019542f5-b3e7-1d02-0000-000000000042
                customerId: Customer:019542f5-b3e7-1d02-0000-000000000010
                platformCustomerId: user-a1b2c3
                status: PAID
                sourceAccountId: InternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                amount:
                  amount: 5000
                  currency:
                    code: USDB
                    name: USDB
                    symbol: $
                    decimals: 2
                recipient:
                  name: Maria
                  phoneNumber: '+639171234567'
                  country: PH
                externalAccountId: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                transactionId: Transaction:019542f5-b3e7-1d02-0000-000000000030
                receivedAmount:
                  amount: 287000
                  currency:
                    code: PHP
                    name: Philippine Peso
                    symbol: ₱
                    decimals: 2
                paymentRail: MOBILE_MONEY
                expiresAt: '2025-10-10T15:00:00Z'
                createdAt: '2025-10-03T15:00:00Z'
                updatedAt: '2025-10-04T09:00:00Z'
  responses:
    '200':
      description: Webhook received successfully
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors/Error400.yaml
    '401':
      description: Unauthorized - Signature validation failed
      content:
        application/json:
          schema:
            $ref: ../components/schemas/errors/Error401.yaml
