name: Workflow smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check OIDC claims and read-only API access
        run: |
          set -u
          echo "oidc_url_present=${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          RESP=$(curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api.stainless.com" || true)
          TOKEN=$(printf '%s' "$RESP" | jq -r '.value // empty' 2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            echo "no_token"
            printf '%s\n' "$RESP" | head -c 300
            echo
            exit 0
          fi
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | jq '{iss,aud,sub,repository,repository_owner,repository_visibility,ref,event_name,workflow_ref,job_workflow_ref,sha,run_id}'
          for u in "https://api.stainless.com/v0/user" "https://api.stainless.com/v0/orgs/lightspark" "https://api.stainless.com/v0/projects/grid"; do
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$u" || true)
            echo "GET $u -> $code"
            head -c 300 /tmp/resp
            echo
          done
